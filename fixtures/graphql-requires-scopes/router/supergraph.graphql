schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/requiresScopes/v0.1", for: SECURITY)
{
  query: Query
}

directive @requiresScopes(scopes: [[requiresScopes__Scope!]!]!) on FIELD_DEFINITION | OBJECT | INTERFACE | SCALAR | ENUM
scalar requiresScopes__Scope
directive @join__graph(name: String!, url: String!) on ENUM_VALUE
directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR
directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar join__FieldSet
scalar link__Import

enum link__Purpose {
  SECURITY
  EXECUTION
}

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://localhost:4001/graphql")
  INVENTORY @join__graph(name: "inventory", url: "http://localhost:4002/graphql")
  SHIPPING @join__graph(name: "shipping", url: "http://localhost:4003/graphql")
}

type Query @join__type(graph: CATALOG) {
  product(id: ID!): Product @join__field(graph: CATALOG)
}

type Product
  @join__type(graph: CATALOG, key: "id")
  @join__type(graph: INVENTORY, key: "id")
  @join__type(graph: SHIPPING, key: "id")
{
  id: ID!
  name: String! @join__field(graph: CATALOG)
  weight: Int! @join__field(graph: INVENTORY) @join__field(graph: SHIPPING, external: true) @requiresScopes(scopes: [["read:weight"], ["staff"]])
  estimate: Int! @join__field(graph: SHIPPING, requires: "weight") @requiresScopes(scopes: [["read:weight", "read:estimate"]])
  fragile: Boolean! @join__field(graph: SHIPPING, requires: "weight") @requiresScopes(scopes: [["read:fragile"]])
}
