service: jobs-shared
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1

functions:
  health:
    handler: src/health.handler
    events:
      - http: GET health

  work:
    handler: src/work.handler
    events:
      - sqs:
          arn: !GetAtt JobsQueue.Arn

resources:
  Resources:
    JobsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: jobs-queue

  Outputs:
    RestApiId:
      Value: !Ref ApiGatewayRestApi
    RestApiRootResourceId:
      Value: !GetAtt ApiGatewayRestApi.RootResourceId
    JobsQueueUrl:
      Value: !Ref JobsQueue
