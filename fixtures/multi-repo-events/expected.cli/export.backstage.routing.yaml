apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: routing
  annotations:
    flowatlas/graph-id: repo:routing
spec:
  type: service
  lifecycle: unknown
  owner: unknown
  providesApis:
    - routing-asyncapi
  consumesApis:
    - loans-asyncapi
  dependsOn:
    - component:notifications
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: routing-asyncapi
  description: "The channels routing publishes (1), read from the code by flowatlas."
spec:
  type: asyncapi
  lifecycle: unknown
  owner: unknown
  definition:
    $text: ./routing.asyncapi.yaml
