apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  template:
    spec:
      containers:
        - name: orders
          image: registry.example.test/orders:1.0
          envFrom:
            - configMapRef:
                name: orders-settings
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  ports:
    - port: 8080
      targetPort: 4100
