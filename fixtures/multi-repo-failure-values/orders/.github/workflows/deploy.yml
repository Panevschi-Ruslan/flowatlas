name: deploy

on:
  push:
    branches: [main]

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launch the prod stacks
        run: |
          pip install sceptre
          sceptre --merge-vars --var-file vars/base.yaml --var-file vars/prod.yaml launch -y prod
