apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
spec:
  template:
    metadata:
      labels:
        app: stock
    spec:
      containers:
        - name: stock
          image: registry.example.test/stock:1.0
          ports:
            - containerPort: 4100
          envFrom:
            - configMapRef:
                name: stock-config
---
apiVersion: v1
kind: Service
metadata:
  name: stock
spec:
  selector:
    app: stock
  ports:
    - port: 80
      targetPort: 4000
