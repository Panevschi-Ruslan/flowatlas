apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge
  namespace: shop
spec:
  rules:
    - host: admin.example.test
      http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: shop-orders
                port:
                  number: 8080
    - http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: shop-orders
                port:
                  number: 8080
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: shop-catalog
                port:
                  number: 8083
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
