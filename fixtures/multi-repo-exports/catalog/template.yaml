AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: The shop's catalog, its routes hung from the gateway's APIs.

Globals:
  Function:
    Runtime: nodejs20.x
    CodeUri: src/

Resources:
  # ------------------------------------------- GET /products, on the REST API

  ListProducts:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catalog-list-products
      Handler: list-products.handler

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !ImportValue shop-rest-api-id
      ParentId: !ImportValue shop-rest-api-root
      PathPart: products

  ProductsGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue shop-rest-api-id
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListProducts.Arn}/invocations

  # ------------------------------------ GET /products/{id}, on the HTTP API

  GetProduct:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catalog-get-product
      Handler: get-product.handler

  ProductIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !ImportValue shop-http-api-id
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetProduct.Arn
      PayloadFormatVersion: '2.0'

  ProductRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !ImportValue shop-http-api-id
      RouteKey: GET /products/{id}
      Target: !Sub integrations/${ProductIntegration}

  # ------------------------------------------------------ restocking

  RestockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: catalog-restock

  # Reads the orders stack's queue, and places a new order through the shop's API.
  Reorder:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catalog-reorder
      Handler: reorder.handler
      Environment:
        Variables:
          SHOP_API_URL: !ImportValue shop-api-url
          RESTOCK_TOPIC_ARN: !Ref RestockTopic
      Events:
        Placed:
          Type: SQS
          Properties:
            Queue: !ImportValue orders-placed-queue-arn

  # The transform takes an event's API only from the same template.
  Legacy:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catalog-legacy
      Handler: list-products.legacy
      Events:
        Old:
          Type: Api
          Properties:
            RestApiId: !ImportValue shop-rest-api-id
            Path: /legacy
            Method: get

Outputs:
  RestockTopicArn:
    Value: !Ref RestockTopic
    Export:
      Name: catalog-restock-topic-arn
