components:
  schemas:
    AddressDto:
      type: object
      properties:
        line1:
          type: string
        city:
          type: string
        postcode:
          type: string
      required:
        - line1
        - city
        - postcode
      x-flowatlas-type: type:orders#AddressDto
    CategoryDto:
      type: object
      properties:
        id:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryDto"
      required:
        - id
        - children
      x-flowatlas-type: type:orders#CategoryDto
    CreateDraftDto:
      type: object
      properties:
        title:
          type: string
      required:
        - title
      x-flowatlas-type: type:orders#CreateDraftDto
    CreateOrderDto:
      type: object
      properties:
        customerId:
          type: string
        channel:
          type: string
        note:
          type: string
        total:
          $ref: "#/components/schemas/MoneyDto"
        shipTo:
          $ref: "#/components/schemas/AddressDto"
      required:
        - customerId
        - channel
        - note
        - total
        - shipTo
      x-flowatlas-type: type:orders#CreateOrderDto
    DeepDto:
      type: object
      properties:
        label:
          type: string
        next:
          $ref: "#/components/schemas/DeepL1"
      required:
        - label
        - next
      x-flowatlas-type: type:orders#DeepDto
    DeepL1:
      type: object
      properties:
        next:
          $ref: "#/components/schemas/DeepL2"
      required:
        - next
      x-flowatlas-type: type:orders#DeepL1
    DeepL2:
      type: object
      properties:
        next:
          $ref: "#/components/schemas/DeepL3"
      required:
        - next
      x-flowatlas-type: type:orders#DeepL2
    DeepL3:
      type: object
      properties:
        next:
          $ref: "#/components/schemas/DeepL4"
      required:
        - next
      x-flowatlas-type: type:orders#DeepL3
    DeepL4:
      type: object
      properties:
        leaf:
          type: string
      required:
        - leaf
      x-flowatlas-type: type:orders#DeepL4
    LockedDraftDto:
      type: object
      properties:
        draft:
          $ref: "#/components/schemas/CreateDraftDto"
        lockedBy:
          type: string
      required:
        - draft
        - lockedBy
      x-flowatlas-type: type:orders#LockedDraftDto
    MoneyDto:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
      required:
        - amount
        - currency
      x-flowatlas-type: type:@fx/wire#MoneyDto
    OrderDto:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
        placedAt:
          type: string
          format: date-time
      required:
        - id
        - total
        - placedAt
      x-flowatlas-type: type:orders#OrderDto
    WireBrokenDto:
      type: object
      properties:
        placedAt:
          type: number
        reference:
          type: string
        delivery:
          const: post
      required:
        - placedAt
        - reference
        - delivery
      x-flowatlas-type: type:orders#WireBrokenDto
    WireDto:
      type: object
      properties:
        placedAt:
          type: string
        reference:
          type: string
        signature:
          type: string
        note:
          type: string
        secret:
          type: string
        customer_id:
          type: string
        coupon:
          type: number
        extras:
          x-flowatlas-unread: any-typed
        channel:
          type: string
          enum:
            - phone
            - web
        tags:
          type: array
          items:
            type: string
        counts:
          type: object
        shipping_city:
          type: string
        score:
          x-flowatlas-unread: transformed
      required:
        - placedAt
        - reference
        - signature
        - customer_id
        - coupon
        - extras
        - channel
        - tags
        - counts
        - shipping_city
        - score
      x-flowatlas-type: type:orders#WireDto
