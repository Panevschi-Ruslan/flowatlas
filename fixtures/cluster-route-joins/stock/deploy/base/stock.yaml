apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
spec:
  template:
    metadata:
      labels:
        app: stock
    spec:
      containers:
        - name: stock
          image: registry.example.test/shop/stock:1.0
          ports:
            - name: http
              containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: stock
spec:
  selector:
    app: stock
  ports:
    - port: 80
      targetPort: http
