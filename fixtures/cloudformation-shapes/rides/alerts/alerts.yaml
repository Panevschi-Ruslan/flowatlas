AWSTemplateFormatVersion: '2010-09-09'
Description: The hourly alerts, a stack the rides stack nests and hands its city to.

Parameters:
  City:
    Type: String

Resources:
  AlertFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub rides-${City}-alert
      Runtime: nodejs20.x
      Handler: alerts/alert.handler
      Code: ../src

  AlertRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub rides-${City}-alerts-hourly
      ScheduleExpression: rate(1 hour)
      Targets:
        - Id: alert
          Arn: !GetAtt AlertFunction.Arn
