apiVersion: v1
kind: Service
metadata:
  name: stock-api
  namespace: shop
spec:
  selector:
    app.kubernetes.io/name: stock
  ports:
    - port: 8080
      targetPort: 4000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stock
  namespace: shop
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock
    spec:
      containers:
        - name: stock
          image: stock
          env:
            - name: PORT
              value: "4000"
