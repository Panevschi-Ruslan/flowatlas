# The questions the benchmark asks (P238), fixed before any run.
#
# Each is a template over the key: `subject` names how its subject is chosen
# (questions.mjs), `index` which one of the candidates, in the key's order.
# `from` is the repository the question is asked from: the whole workspace
# for arms A and D, that repository alone for B and C. `scorer` is how the
# answer is marked: a set (precision and recall), an exact value, or yes/no.
#
# The kinds where flowatlas should not help (single-repo, code-text, explain)
# are here on purpose, and reported like the rest. `pilot: true` marks the
# eight the pilot runs: two of each group.
#
# Do not change a prompt after a recorded run: a changed prompt is a new
# question, with a new id.

questions:
  - id: callers-backend-1
    kind: cross-repo-callers
    group: reach
    subject: called-backend-route
    index: 0
    pilot: true
    scorer: symbols
    prompt: Which functions anywhere in this project send requests to `{route}` of the {service} service? Give each as Class.method, or as the function's name for a plain function.
