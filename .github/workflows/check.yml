name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A clean checkout has no build output and no fixture graphs, which is the
      # state this workflow exists to keep passing. `check` runs the five gates
      # in the one order that works: build, typecheck, fixture graph, test,
      # invariants, snapshots.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The pull-request action, run from this checkout against the demo project with
  # the command this checkout builds (P231): every step but the comment, which
  # is off so the repository's own pull requests are not written on, and with
  # the docs check at its default, against the head graph diff keeps. The demo's
  # services are folders of this repository, not repositories, so no ref of
  # them can be read and fail-on would fail every run: it is off.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: npm install --global ./packages/cli

      - id: flowatlas
        uses: ./action
        with:
          config: fixtures/multi-repo/flowatlas.config.json
          base: HEAD~1
          version: installed
          comment: 'off'
          fail-on: ''

      - run: test -n "${{ steps.flowatlas.outputs.verdict }}" && test -n "${{ steps.flowatlas.outputs.reaches }}" && test -n "${{ steps.flowatlas.outputs.stale-docs }}"
      # The docs check read the graph diff built, rather than finding none.
      - run: test -s fixtures/multi-repo/.flowatlas/pull-request-graph.db

  # The team's graph (P236), published by the action from this checkout over the
  # demo project: built, bundled and uploaded as the artifact `flowatlas-graph`.
  # A run on a push to main is the one `flowatlas pull gh:…` reads; a pull
  # request's run uploads one too, for downloading by hand, which `gh:` refuses.
  team-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: npm install --global ./packages/cli

      - id: graph
        uses: ./action
        with:
          config: fixtures/multi-repo/flowatlas.config.json
          version: installed
          publish: true
          retention-days: 7

  # Builds and runs the unit tests on Windows (P83). A failure fails the run
  # since the tests passed there (P199, P200); the fixture snapshot gate is not
  # run here, and requiring the job before a merge is the repository's branch
  # protection. The fixture graphs are made first (P199), because the linker's
  # and the MCP server's tests read them and a clean checkout has none; `check`
  # makes them the same way.
  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/fixtures-run.mjs
      - run: pnpm -r test
