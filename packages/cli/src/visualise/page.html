<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
__PAGE_CSS__</style>

<div class="shell">
  <header class="strip" id="strip">
    <h1 class="wordmark">__TITLE__</h1>
    <dl class="pills" id="band"></dl>
    <div class="built" id="built"></div>
    <p class="pill-note" id="pill-note" aria-live="polite" hidden></p>
  </header>

  <div class="rail-row">
    <div class="fleet" id="fleet"></div>

    <div class="finder" role="search">
      <input type="search" id="find" autocomplete="off" spellcheck="false"
        placeholder="Find a route, channel, table, type, gap, class or node" aria-label="Find anything in the project"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="find-out" aria-keyshortcuts="/">
      <kbd class="find-key" aria-hidden="true">/</kbd>
      <div class="find-out" id="find-out" role="listbox" aria-label="Found" hidden></div>
    </div>
  </div>

  <div class="work">
    <section class="panel" id="ways">
      <div class="panel-head">
        <h2>Ways in</h2>
        <span class="hint" id="entry-count"></span>
      </div>
      <div class="filters">
        <select id="kind" aria-label="Kind of entry">
          <option value="">All kinds</option>
        </select>
        <div class="list-filter" id="list-filter" aria-live="polite" hidden></div>
      </div>
      <ul class="list" id="entries"></ul>
    </section>

    <section class="panel" id="views">
      <div class="panel-head">
        <h2 id="view-title">The whole project</h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-view="map" aria-selected="true">Map</button>
          <button class="tab" role="tab" data-view="steps" aria-selected="false">Steps</button>
          <button class="tab" role="tab" data-view="crossings" aria-selected="false">Crossings</button>
          <button class="tab" role="tab" data-view="missing" aria-selected="false">Not joined</button>
          <button class="tab" role="tab" data-view="busiest" aria-selected="false">Busiest</button>
          <button class="tab" role="tab" data-view="changes" aria-selected="false" id="tab-changes" hidden>Changes</button>
          <button class="tab" role="tab" data-view="graph" aria-selected="false">Graph</button>
        </div>
      </div>
      <aside class="start" id="start" aria-labelledby="start-title" hidden></aside>
      <p class="v-notice" id="v-notice" role="status" hidden></p>
      <div class="filters t-bar" id="table-bar" hidden>
        <button class="tool v-link" id="t-link" data-view-link title="Copy a link to this tab">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.5-2.5a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/>
            <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.2 9.1a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
          <span>Copy link</span>
        </button>
      </div>
      <div class="tab-sheet" id="tab-sheet"></div>
      <div class="steps-view" id="steps-view" hidden>
        <div class="s-bar">
          <label class="hint">depth
            <select id="s-depth"><option>4</option><option>8</option><option selected>12</option><option>24</option></select>
          </label>
          <span class="g-split s-modes" role="group" aria-label="How the steps are drawn" id="s-modes">
            <button class="tool" data-step-mode="compact" aria-pressed="true"
              title="A line per step: what it is, where, and only the marks that change the reading">Compact</button>
            <button class="tool" data-step-mode="detailed" aria-pressed="false"
              title="Every mark, the full path, the settings read and the lines logged">Detailed</button>
            <button class="tool" data-step-mode="waterfall" aria-pressed="false"
              title="A bar per step, coloured by service, laid out in steps, not time">Waterfall</button>
          </span>
          <button class="tool" id="s-copy" title="Copy this way in as Markdown for an assistant: steps, places, shapes, gaps, ids">Copy as prompt</button>
          <span class="hint" id="s-note"></span>
          <button class="tool v-link" id="s-link" data-view-link title="Copy a link to the steps of this way in">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.5-2.5a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/>
              <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.2 9.1a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
            <span>Copy link</span>
          </button>
        </div>
        <div class="s-head" id="s-head"></div>
        <ol class="s-list" id="s-list" aria-label="Steps, in call order"></ol>
      </div>
      <div class="map" id="map-view" hidden>
        <div class="g-bar">
          <span class="hint">links</span>
          <span id="m-kinds" class="g-filters" style="padding:0;border:0"></span>
          <label class="hint g-pick"><input type="checkbox" id="m-packages"> packages</label>
          <label class="hint g-pick" id="m-dev-pick" hidden><input type="checkbox" id="m-dev"> development too</label>
          <label class="hint g-pick">layout
            <select id="m-layout">
              <option value="calls">call order</option>
              <option value="role">by role</option>
            </select>
          </label>
          <label class="hint g-pick">check
            <select id="m-mark">
              <option value="">nothing</option>
              <option value="problems">problems to fix</option>
              <option value="dead">channels with one end</option>
              <option value="uncalled">routes nothing calls</option>
              <option value="cycles">services that reach each other</option>
              <option value="unread">services not read</option>
            </select>
          </label>
          <span class="g-split" role="group" aria-label="Clusters">
            <button class="tool" id="m-open-all" title="Open every cluster">Open all</button>
            <button class="tool" id="m-close-all" title="Close every cluster">Close all</button>
          </span>
          <button class="tool" id="m-whole" hidden>Whole map</button>
          <div class="g-tools">
            <button class="tool" id="m-copy" title="Copy a link to this view">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.5-2.5a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/>
                <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.2 9.1a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
              <span>Copy link</span>
            </button>
            <span class="hint">export</span>
            <span class="g-split" role="group" aria-label="Export the map">
              <button class="tool" id="m-svg-out" title="Save the map as an SVG file">SVG</button>
              <button class="tool" id="m-png-out" title="Save the map as a PNG picture">PNG</button>
            </span>
            <button class="tool" id="m-full" aria-pressed="false" title="Full screen (F)">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
              <span>Full screen</span> <kbd>F</kbd>
            </button>
          </div>
        </div>
        <div class="g-stage" id="m-stage">
          <div class="g-canvas" id="m-canvas">
            <svg id="m-svg" role="group" aria-roledescription="map of services">
              <defs>
                <marker id="m-arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9"
                  markerUnits="userSpaceOnUse" orient="auto-start-reverse">
                  <path d="M0 0.8 L8 4 L0 7.2 z" fill="context-stroke"></path>
                </marker>
              </defs>
              <g id="m-world"></g>
            </svg>
            <p class="g-notice" id="m-notice" role="status" hidden></p>
            <div class="g-zoom">
              <button class="tool" id="m-zoom-in" aria-label="Zoom in">+</button>
              <button class="tool" id="m-zoom-out" aria-label="Zoom out">&minus;</button>
              <button class="tool" id="m-fit">Fit</button>
            </div>
          </div>
          <aside class="g-details" id="m-details" aria-label="Map details"></aside>
        </div>
        <p class="g-status" id="m-status" role="status"></p>
      </div>
      <div class="graph" id="graph-view" hidden>
        <div class="g-bar">
          <button class="tool" id="g-back" disabled>&larr; Back</button>
          <button class="tool" id="g-forward" disabled>Forward &rarr;</button>
          <label class="hint g-pick">
            hops
            <select id="g-hops"><option>1</option><option selected>2</option><option>3</option></select>
          </label>
          <div class="g-pop-wrap">
            <button class="tool g-pop-btn" id="g-filters-btn" aria-expanded="false" aria-controls="g-filters"
              title="What the drawing leaves out: edge types, trust, plumbing, and how much it draws">Filters</button>
            <div class="g-pop g-filters" id="g-filters" role="group" aria-label="Filters" hidden>
              <label class="hint g-pick g-pop-row">
                most nodes
                <select id="g-cap">
                  <option>30</option><option selected>60</option><option>120</option><option>250</option>
                </select>
              </label>
            </div>
          </div>
          <div class="g-pop-wrap">
            <button class="tool g-pop-btn" id="g-check-btn" aria-expanded="false" aria-controls="g-check"
              title="Problems, and a path between two nodes">Check</button>
            <div class="g-pop g-check" id="g-check" role="group" aria-label="Check" hidden>
              <button class="tool" id="g-problems" aria-expanded="false" aria-controls="g-answer">Problems</button>
              <label class="hint g-pick"><input type="checkbox" id="g-only"> problems only</label>
              <span class="hint" id="g-only-note"></span>
              <span class="g-check-group" role="group" aria-label="Path between two nodes">
                <span class="hint">path</span>
                <button class="tool g-end" id="g-from" data-end="from">from: pick&hellip;</button>
                <button class="tool" id="g-way" aria-pressed="false" title="Follow edges the way calls run, or either way">&rarr; one way</button>
                <button class="tool g-end" id="g-to" data-end="to">to: pick&hellip;</button>
                <label class="hint g-pick">within
                  <select id="g-path-depth"><option>6</option><option selected>12</option><option>24</option></select>
                  steps</label>
              </span>
            </div>
          </div>
          <button class="tool" id="g-clear" hidden>Back to the neighbourhood</button>
          <div class="g-tools">
            <button class="tool" id="g-find-btn" data-find-open title="Search everything (/)">
              <span>Search</span> <kbd>/</kbd>
            </button>
            <button class="tool" id="g-types" aria-pressed="false"
              title="Write under each node what it takes and gives back (T)">
              <span>Types</span> <kbd>T</kbd>
            </button>
            <button class="tool" id="g-copy" title="Copy a link to this view">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.5-2.5a2.6 2.6 0 0 0-3.7-3.7l-.9.9"/>
                <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.2 9.1a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
              <span>Copy link</span>
            </button>
            <span class="hint">export</span>
            <span class="g-split" role="group" aria-label="Export the drawing">
              <button class="tool" id="g-svg-out" title="Save the drawing as an SVG file">SVG</button>
              <button class="tool" id="g-png-out" title="Save the drawing as a PNG picture">PNG</button>
            </span>
            <button class="tool" id="g-full" aria-pressed="false" title="Full screen (F)">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
              <span>Full screen</span> <kbd>F</kbd>
            </button>
          </div>
        </div>
        <div class="g-answer" id="g-answer" aria-live="polite" hidden></div>
        <div class="g-answer" id="g-steps" aria-label="Steps of this way in" hidden></div>
        <div class="g-stage" id="g-stage">
          <div class="g-canvas" id="g-canvas">
            <svg id="g-svg" role="group" aria-roledescription="graph">
              <defs>
                <marker id="g-arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7"
                  orient="auto-start-reverse">
                  <path d="M0 0.8 L8 4 L0 7.2 z" fill="context-stroke"></path>
                </marker>
              </defs>
              <g id="g-world"></g>
            </svg>
            <p class="g-notice" id="g-notice" role="status" hidden></p>
            <div class="g-zoom">
              <button class="tool" id="g-zoom-in" aria-label="Zoom in">+</button>
              <button class="tool" id="g-zoom-out" aria-label="Zoom out">&minus;</button>
              <button class="tool" id="g-fit">Fit</button>
            </div>
          </div>
          <div class="g-drawer" id="g-drawer">
            <div class="g-grip" id="g-grip" role="separator" tabindex="0" aria-orientation="vertical"
              aria-controls="g-details" aria-label="Width of the details panel"
              title="Drag to resize; arrow keys too"></div>
            <button class="g-fold" id="g-fold" aria-controls="g-details" aria-expanded="true"
              aria-label="Fold the details panel" title="Fold the details panel">
              <svg viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5 7 5 3.5 8.5"/></svg>
            </button>
            <button class="g-rail" id="g-rail" aria-controls="g-details" title="Unfold the details panel">
              <span>details</span><b id="g-rail-name"></b>
            </button>
            <aside class="g-details" id="g-details" aria-label="Node details" hidden></aside>
          </div>
        </div>
        <p class="g-status" id="g-status" role="status"></p>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </div>

  <footer class="colophon">
    <p id="standfirst"></p>
    <p id="colophon"></p>
    <p class="colophon-keys"><button class="link-button" data-keys-open>Keys</button> <kbd>?</kbd> &middot;
      <button class="link-button" data-palette-open>Commands</button> <kbd>&#8984;K</kbd></p>
  </footer>
</div>

<div class="overlay" id="palette" hidden>
  <div class="dialog palette-box" role="dialog" aria-modal="true" aria-label="Commands">
    <input type="text" id="palette-input" autocomplete="off" spellcheck="false" role="combobox"
      aria-autocomplete="list" aria-expanded="true" aria-controls="palette-list"
      placeholder="Type a command, or what to search for" aria-label="Command">
    <ul class="palette-list" id="palette-list" role="listbox" aria-label="Commands"></ul>
  </div>
</div>

<div class="overlay" id="keys-help" hidden>
  <div class="dialog keys-box" role="dialog" aria-modal="true" aria-labelledby="keys-title" tabindex="-1">
    <div class="g-head"><h3 id="keys-title">Keys</h3>
      <button class="g-close" data-keys-close aria-label="Close" title="Close (Escape)">&times;</button></div>
    <div class="keys-list" id="keys-list"></div>
  </div>
</div>

<div class="row-menu" id="row-menu" hidden>
  <ul class="row-menu-list" id="row-menu-list" role="menu" aria-label="Copy from this row"></ul>
  <p class="row-menu-foot" id="row-menu-foot" hidden></p>
</div>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<script type="application/json" id="graph">__DATA__</script>

<script type="module">
/* Everything below is written in by the command, each part from a module of
   its own (`PAGE_PARTS` in commands/visualise.ts), so that a test imports
   exactly the text the browser runs. The parts share this one script: the
   logic first, then the page's context and one factory per panel, then the
   boot that calls them in order. */

/* The graph view's logic, written in by the command from graph.js. */
__GRAPH_LOGIC__

/* The frame's logic - links, touch, pictures - written in from frame.js. */
__FRAME_LOGIC__

/* The map's logic - services, links, layout, checks - written in from map.js. */
__MAP_LOGIC__

/* One subject as the Markdown an assistant is handed - written in from core's
   prompt-text.js, the renderer the MCP server's describe_for_prompt writes with. */
__PROMPT_LOGIC__

/* A way in as its steps, and as a prompt - written in from steps.js. */
__STEPS_LOGIC__

/* The page: what every panel reads, then one panel each - written in from
   panels/*.js, their imports dropped since everything above is in scope. */
__CONTEXT_LOGIC__

__BAND_LOGIC__

__WAYS_LOGIC__

__SHEET_LOGIC__

__TABLES_LOGIC__

__FIND_LOGIC__

__MENU_LOGIC__

__MISSING_LOGIC__

__GRAPH_DRAW_LOGIC__

__DETAILS_LOGIC__

__CHECKING_LOGIC__

__GRAPH_UI_LOGIC__

__FRAME_UI_LOGIC__

__MAP_UI_LOGIC__

__STEPS_UI_LOGIC__

__PALETTE_LOGIC__

__WIRING_LOGIC__

__BOOT_LOGIC__

bootPage(JSON.parse(document.getElementById('graph').textContent));
</script>
