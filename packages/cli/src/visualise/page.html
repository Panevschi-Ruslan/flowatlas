       then the half-chosen path, then the answer itself. True when it closed
       something. */
    const dismissAnswer = () => {
      if (state.answer === 'problems') {
        state.answer = state.query === null ? null : 'query';
        drawAnswer();
        return true;
      }
      if (state.query === null && state.answer === 'ends') {
        state.ends = { from: null, to: null };
        state.answer = null;
        drawAnswer();
        drawDetails();
        return true;
      }
      if (state.query !== null) {
        clearQuery();
        return true;
      }
      return false;
    };

    const chooseEnd = (v, end = state.picking) => {
      state.ends[end] = v;
      state.picking = null;
      if (state.ends.from !== null && state.ends.to !== null) askPath();
      else {
        state.answer = 'ends';
        drawAnswer();
        drawDetails();
      }
    };

    const filtersSaid = () => {
      const hiddenServices = repos.filter((name) => !shown.has(name)).length;
      const off = [
        hiddenServices && plural(hiddenServices, 'service', 'services'),
        state.hiddenEdgeTypes.size && plural(state.hiddenEdgeTypes.size, 'edge type', 'edge types'),
        state.hiddenConfidences.size && plural(state.hiddenConfidences.size, 'kind of trust', 'kinds of trust'),
      ].filter(Boolean);
      return off.length === 0 ? 'with no filters on' : 'with ' + off.join(', ') + ' hidden by the filters';
    };

    const nameOf = (v) => `<b>${esc(nodes[v][LB])}</b>`;
    const pickable = (v, note, text) =>
      `<li><button class="g-far" data-pick="${v}" style="--hue:${hueOf(nodes[v][RP])}" ` +
      `title="${esc(nodes[v][LB])}${placeOf(v) ? ', ' + esc(placeOf(v)) : ''}">` +
      `<span class="label">${esc(text || nodes[v][LB])}</span><small>${esc(note)}</small></button>${graphLink(v)}</li>`;
    const listHtml = (key, title, items, empty) => {
      const open = state.answerOpen.has(key);
      const shownItems = open ? items : items.slice(0, ANSWER_LIMIT);
      return `<h4>${title} &middot; ${items.length.toLocaleString()}</h4>` +
        (items.length === 0 ? `<p class="g-none">${empty}</p>` : `<ul>${shownItems.join('')}</ul>`) +
        (shownItems.length < items.length
          ? `<button class="g-more-btn" data-list="${key}">Show ${(items.length - shownItems.length).toLocaleString()} more</button>`
          : '');
    };
    const reasonsAt = (v) => {
      const found = problems.of(v);
      return problems.reasonsOf([...found.on, ...found.atLine]).join(', ');
    };

    const problemsHtml = () => {
      const { waysIn, crossings, calls } = problems.list();
      const ways = waysIn.map((item) => pickable(item.node,
        [repoName(item.node), item.unhandled ? 'no handler read' : '', reasonsAt(item.node)].filter(Boolean).join(' · ')));
      const crossed = crossings.map((item) => {
        const e = data.edges[item.edge];
        const v = problems.has(e[1]) ? e[1] : e[0];
        return pickable(v, `${repoName(e[0])} → ${repoName(e[1])} · ${edgeTypes[e[2]]}, ${confidences[e[3]]} · ` +
          `${[reasonsAt(e[0]), reasonsAt(e[1])].filter(Boolean).join(', ')}`, `${nodes[e[0]][LB]} → ${nodes[e[1]][LB]}`);
      });
      const unjoined = calls.map((item) => pickable(item.node,
        [repoName(item.node), item.unjoined ? 'joined nothing' : '', reasonsAt(item.node)].filter(Boolean).join(' · ')));
      return '<p>Where to look first. A problem is a row of <b>Not joined</b> that names a node or sits at its ' +
        'line; a node carrying one is badged with the count.</p>' +
        listHtml('ways', 'Ways in with problems', ways, 'Every way in has a handler that was read, and no row.') +
        listHtml('crossings', 'Crossings with problems', crossed, 'No crossing has a row at either end.') +
        listHtml('calls', 'Calls that did not join, or carry rows', unjoined, 'Every call joined, and none carries a row.');
    };

    const pathHtml = (hood) => {
      const way = state.directed ? 'along edges the way the calls run' : 'along edges either way';
      const ends = `from ${nameOf(hood.from)} to ${nameOf(hood.to)}`;
      if (!hood.found) {
        const tries = [state.directed && 'either way', hood.depth < 24 && 'a longer search', filterNow().active && 'fewer filters']
          .filter(Boolean);
        return `<p><b>No path</b> ${ends} within ${plural(hood.depth, 'step', 'steps')} ${way}, ${filtersSaid()}.</p>` +
          `<p>Searched the ${plural(hood.searched, 'node', 'nodes')} ${nameOf(hood.from)} reaches that way.` +
          (tries.length ? ' Try ' + tries.join(', or ') + '.' : '') + '</p>';
      }
      return `<p><b>${plural(hood.paths, 'shortest path', 'shortest paths')}</b> of ${plural(hood.length, 'step', 'steps')} ` +
        `${ends}, ${way}, ${filtersSaid()}.` +
        (hood.left > 0 ? ` ${plural(hood.left, 'node', 'nodes')} on them not drawn: the cap is ${state.cap}; one whole path is drawn first.` : '') +
        '</p>';
    };

    const impactHtml = (hood) => {
      const found = state.query.found;
      const entries = found.entries.map((v) => pickable(v,
        `${repoName(v)} · ${kinds[nodes[v][KD]] || typeOf(v)} · ${plural(found.dist.get(v), 'hop', 'hops')} back`));
      const screens = found.doors.filter((v) => typeOf(v) !== 'entry').map((v) => pickable(v,
        `${repoName(v)} · ${kinds[nodes[v][KD]] || typeOf(v)} · ${plural(found.dist.get(v), 'hop', 'hops')} back`));
      const stops = found.withoutEntry.map((s) => esc(repos[s]));
      if (found.reached === 0) {
        return `<p><b>Nothing reaches</b> ${nameOf(found.target)} along the edges <code>flowatlas impact</code> walks ` +
          'back, so a change to it is seen only from it.</p>';
      }
      return `<p><b>${plural(found.reached, 'node reaches', 'nodes reach')}</b> ${nameOf(found.target)} within ` +
        `${plural(found.depth, 'hop', 'hops')} back, walked as <code>flowatlas impact</code> walks it, so no filter applies.` +
        (hood.left > 0 ? ` ${plural(hood.left, 'node', 'nodes')} not drawn: the cap is ${state.cap}; every way in is drawn first, with one chain down from it.` : '') +
        '</p>' +
        (stops.length ? `<p>Also reaches ${stops.join(', ')}, where the chain stops before an entry point.</p>` : '') +
        listHtml('entries', 'Entry points', entries, 'Nothing that reaches it is an entry point.') +
        (screens.length ? listHtml('screens', 'Screen actions', screens, '') : '');
    };

    const endsHtml = () => {
      const set = state.ends.from !== null ? 'from' : 'to';
      const other = set === 'from' ? 'to' : 'from';
      return `<p>Path ${set} ${nameOf(state.ends[set])}. Now choose where it ${other === 'to' ? 'ends' : 'starts'}: ` +
        `<b>Path ${other} here</b> on another node, or <b>${other}: pick&hellip;</b> above and search.</p>`;
    };

    const paintChecks = () => {
      const { waysIn, crossings, calls } = problems.list();
      problemsBtn.textContent = `Problems · ${(waysIn.length + crossings.length + calls.length).toLocaleString()}`;
      problemsBtn.setAttribute('aria-expanded', String(state.answer === 'problems'));
      for (const [end, button] of Object.entries(endBtns)) {
        const v = state.ends[end];
        button.textContent = `${end}: ` + (v === null ? 'pick…' : middle(nodes[v][LB], 30));
        button.title = v === null ? `Pick where the path ${end === 'from' ? 'starts' : 'ends'}` : nodes[v][LB];
        button.classList.toggle('is-picking', state.picking === end);
      }
      wayBtn.innerHTML = state.directed ? '&rarr; one way' : '&harr; either way';
      wayBtn.setAttribute('aria-pressed', String(!state.directed));
      pathDepthSel.value = String(state.pathDepth);
      clearBtn.hidden = state.query === null;
      onlyBox.checked = state.problemsOnly;
      onlyBox.disabled = state.query !== null;
      onlyNote.textContent = state.problemsOnly && state.query === null && state.hood && state.hood.clean
        ? plural(state.hood.clean, 'node', 'nodes') + ' without problems hidden'
        : '';
      searchEl.placeholder = state.picking === null ? searchPrompt
        : `Pick where the path ${state.picking === 'from' ? 'starts' : 'ends'} (Escape to stop)`;
    };

    /* The answer box and, while a question is asked, the line under the
       drawing. True when it wrote that line. */
    function drawAnswer() {
      paintChecks();
      const query = state.query;
      const showing = state.answer === 'query' ? (query === null ? null : query.kind)
        : state.answer === 'ends' ? (query === null && (state.ends.from === null) !== (state.ends.to === null) ? 'ends' : null)
        : state.answer;
      answerEl.hidden = showing === null;
      answerEl.classList.toggle('is-none', showing === 'path' && !state.hood.found);
      if (showing === 'problems') answerEl.innerHTML = problemsHtml();
      else if (showing === 'path') answerEl.innerHTML = pathHtml(state.hood);
      else if (showing === 'impact') answerEl.innerHTML = impactHtml(state.hood);
      else if (showing === 'ends') answerEl.innerHTML = endsHtml();
      if (query === null || state.hood === null) return false;

      const hood = state.hood;
      const drawn = `<b>${plural(hood.nodes.length, 'node', 'nodes')}</b> drawn`;
      statusEl.className = 'g-status' + (hood.left > 0 ? ' is-cut' : '');
      statusEl.innerHTML = query.kind === 'path'
        ? (hood.found
          ? `${drawn} on the shortest ${hood.paths === 1 ? 'path' : 'paths'} from ${nameOf(hood.from)} to ${nameOf(hood.to)}.`
          : `<b>No path</b> from ${nameOf(hood.from)} to ${nameOf(hood.to)} within ${plural(hood.depth, 'step', 'steps')}.`)
        : `${drawn} upstream of ${nameOf(query.target)}, of ${plural(query.found.reached, 'node', 'nodes')} that reach it.`;
      if (hood.left > 0) statusEl.innerHTML += ` <b>${hood.left.toLocaleString()} more</b> not drawn: the cap is ${state.cap}.`;
      return true;
    }

    problemsBtn.addEventListener('click', () => {
      state.answer = state.answer === 'problems' ? (state.query === null ? null : 'query') : 'problems';
      drawAnswer();
    });
    onlyBox.addEventListener('change', () => { state.problemsOnly = onlyBox.checked; draw(false); });
    for (const [end, button] of Object.entries(endBtns)) {
      button.addEventListener('click', () => {
        state.picking = state.picking === end ? null : end;
        paintChecks();
        if (state.picking !== null) searchEl.focus();
      });
    }
    wayBtn.addEventListener('click', () => {
      state.directed = !state.directed;
      if (state.query !== null && state.query.kind === 'path') draw(true);
      else paintChecks();
    });
    pathDepthSel.addEventListener('change', () => {
      state.pathDepth = Number(pathDepthSel.value);
      if (state.query !== null && state.query.kind === 'path') draw(true);
    });
    function clearQuery() {
      state.query = null;
      state.answer = null;
      state.expanded = [];
      state.also = [];
      draw(true);
      syncControls();
    }
    clearBtn.addEventListener('click', clearQuery);
    answerEl.addEventListener('click', (event) => {
      const more = event.target.closest('[data-list]');
      if (more) { state.answerOpen.add(more.dataset.list); drawAnswer(); return; }
      const named = event.target.closest('[data-pick]');
      if (!named) return;
      const v = Number(named.dataset.pick);
      if (state.hood.layer.has(v)) { select(v, false); camera.reveal(at(v)); } else go(v);
    });
    panel.addEventListener('click', (event) => {
      const target = event.target.closest('button[data-check]');
      if (!target || state.open === null) return;
      if (target.dataset.check === 'impact') askImpact(state.open);
      else chooseEnd(state.open, target.dataset.check);
    });

    /* ── state changes: every control ends in one of these ── */

    /* The view in the address: the focus, the hops and what was expanded, each
       node by its key, so the link opens the same view after a rebuild; then
       the question asked of it, and what the filters hide, by name. */
    const askNow = () => {
      const query = state.query;
      if (query !== null && query.kind === 'impact') return { kind: 'impact' };
      if (query !== null && query.kind === 'path') {
        return { kind: 'path', to: state.ends.to, depth: state.pathDepth, directed: state.directed };
      }
      return state.problemsOnly ? { kind: 'only' } : null;
    };
    const hiddenNow = () => ({
      services: repos.filter((name) => !shown.has(name)),
      edgeTypes: [...state.hiddenEdgeTypes].map((i) => edgeTypes[i]),
      confidences: [...state.hiddenConfidences].map((i) => confidences[i]),
    });
    const hashNow = () => formatHash(keys, state.focus, state.hops, state.expanded, {
      ask: askNow(),
      hidden: hiddenNow(),
      also: state.also,
    });
    const writeHash = () => {
      if (view !== 'graph') return;
      history.replaceState(null, '', hashNow());
      notice.moved();
    };

    const syncControls = () => {
      backBtn.disabled = !trail.canBack();
      forwardBtn.disabled = !trail.canForward();
      writeHash();
      titleEl.textContent = nodes[state.focus][LB];
    };

    const draw = (frame) => {
      state.hood = asked();
      state.placed = layout(model, state.hood, {
        column: BOX.column, row: BOX.row, laneGap: BOX.laneGap, laneHead: BOX.laneHead,
      });
      if (state.open !== null && !state.hood.layer.has(state.open)) state.open = null;
      if (!state.hood.layer.has(state.cursor)) state.cursor = state.focus;
      drawDrawing();
      drawStatus();
      drawDetails();
      if (frame) camera.frame(state.placed, at(state.focus), false);
      writeHash();
    };

    const select = (v, moveFocus) => {
      state.cursor = v;
      if (state.open !== v) state.openGroups.clear();
      state.open = v;
      paintSelection(moveFocus);
      drawDetails();
    };

    const go = (v, record = true, query = null) => {
      if (record) trail.visit(v);
      state.query = query;
      state.focus = v;
      state.cursor = v;
      state.open = v;
      state.expanded = [];
      state.also = [];
      state.openGroups.clear();
      state.unfolded = new Set();
      state.opened = new Set();
      draw(true);
      syncControls();
    };

    /* A group opens in place into what it holds; a chip draws, or folds back,
       the plumbing in front of its node. */
    const openGroup = (id) => {
      state.opened.add(id);
      state.cursor = state.hood.parent.get(id) ?? state.focus;
      draw(false);
    };
    const toggleChain = (v) => {
      if (state.unfolded.has(v)) state.unfolded.delete(v); else state.unfolded.add(v);
      state.cursor = v;
      draw(false);
    };

    const expand = (v) => {
      if (!state.expanded.includes(v)) state.expanded.push(v);
      state.cursor = v;
      state.open = v;
      draw(false);
      writeHash();
    };

    /* Who else uses a node, drawn as context or put away again. */
    const toggleAlso = (v) => {
      if (!state.hood.others.has(v)) return;
      state.also = state.also.includes(v) ? state.also.filter((u) => u !== v) : [...state.also, v];
      state.cursor = v;
      state.open = v;
      draw(false);
    };

    const closeDetails = () => {
      state.open = null;
      paintSelection(panel.contains(document.activeElement));
      drawDetails();
    };

    /* ── controls ── */

    backBtn.addEventListener('click', () => go(trail.back(), false));
    forwardBtn.addEventListener('click', () => go(trail.forward(), false));
    hopsSel.addEventListener('change', () => { state.hops = Number(hopsSel.value); draw(true); syncControls(); });
    gCapSel.addEventListener('change', () => { state.cap = Number(gCapSel.value); draw(true); });
    document.getElementById('g-zoom-in').addEventListener('click', () => camera.zoom(1.25));
    document.getElementById('g-zoom-out').addEventListener('click', () => camera.zoom(0.8));
    document.getElementById('g-fit').addEventListener('click', () => camera.frame(state.placed, at(state.focus), true));

    /* Filters: services on the rail above, edge types and trust here. */
    const filterBar = document.getElementById('g-filters');
    const filterChips = [];
    const chips = (title, names, hidden) => {
      const label = document.createElement('span');
      label.className = 'hint';
      label.textContent = title;
      filterBar.append(label);
      names.forEach((name, i) => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = name;
        chip.setAttribute('aria-pressed', 'true');
        chip.addEventListener('click', () => {
          if (hidden.has(i)) hidden.delete(i); else hidden.add(i);
          chip.setAttribute('aria-pressed', String(!hidden.has(i)));
          draw(false);
        });
        filterChips.push({ chip, hidden, i });
        filterBar.append(chip);
      });
    };
    chips('edges', edgeTypes, state.hiddenEdgeTypes);
    chips('trust', confidences, state.hiddenConfidences);
    {
      // Plumbing is folded into a chip on what it wraps unless asked for.
      const label = document.createElement('span');
      label.className = 'hint';
      label.textContent = 'plumbing';
      const toggle = document.createElement('button');
      toggle.className = 'chip';
      toggle.textContent = 'drawn as nodes';
      toggle.title = 'Guards, interceptors, pipes and middleware: folded into a chip on what they wrap, ' +
        'or drawn as nodes of their own';
      toggle.setAttribute('aria-pressed', String(state.plumbing));
      toggle.addEventListener('click', () => {
        state.plumbing = !state.plumbing;
        state.unfolded.clear();
        toggle.setAttribute('aria-pressed', String(state.plumbing));
        draw(false);
      });
      filterBar.append(label, toggle);
    }
    filterBar.insertAdjacentHTML('beforeend', '<span class="hint">services: the rail above</span>');

    /* Pointer: one finger or a mouse drags to pan; two fingers pan and pinch to
       zoom; a wheel or a trackpad pans, and a trackpad pinch or ctrl+wheel zooms.
       Every pointer down is kept by id, in the canvas's own pixels, so a second
       finger joining or one lifting picks up where the gesture is. */
    const fingers = new Map();
    let dragged = false;
    const local = (event) => {
      const box = wrap.getBoundingClientRect();
      return { x: event.clientX - box.left, y: event.clientY - box.top };
    };
    let anchor = null;
    wrap.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || event.target.closest('.g-zoom, .g-notice, .g-mini')) return;
      // A mouse or a pen is one pointer: one let go outside the canvas never
      // said so, and must not turn the next drag into a pinch.
      if (event.pointerType !== 'touch') fingers.clear();
      fingers.set(event.pointerId, local(event));
      if (fingers.size === 1) { anchor = local(event); dragged = false; }
      else {
        // A second finger is a pinch, never a click on whatever it landed on.
        dragged = true;
        wrap.classList.add('is-panning');
      }
    });
    wrap.addEventListener('pointermove', (event) => {
      if (!fingers.has(event.pointerId)) return;
      const here = local(event);
      if (fingers.size >= 2) {
        const before = [...fingers.values()].slice(0, 2);
        fingers.set(event.pointerId, here);
        const after = [...fingers.values()].slice(0, 2);
        const move = pinch(before, after);
        camera.pan(move.dx, move.dy);
        camera.zoomAt(move.at.x, move.at.y, move.factor);
        return;
      }
      fingers.set(event.pointerId, here);
      const dx = here.x - anchor.x, dy = here.y - anchor.y;
      if (!dragged && Math.hypot(dx, dy) < 4) return;
      if (!dragged) {
        dragged = true;
        wrap.setPointerCapture(event.pointerId);
        wrap.classList.add('is-panning');
      }
      camera.pan(dx, dy);
      anchor = here;
    });
    const lift = (event) => {
      fingers.delete(event.pointerId);
      // The finger left behind carries on panning from where it is now.
      if (fingers.size === 1) anchor = [...fingers.values()][0];
      if (fingers.size === 0) wrap.classList.remove('is-panning');
    };
    wrap.addEventListener('pointerup', lift);
    wrap.addEventListener('pointercancel', lift);
    wrap.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (event.ctrlKey || event.metaKey) {
        const box = wrap.getBoundingClientRect();
        camera.zoomAt(event.clientX - box.left, event.clientY - box.top, Math.exp(-event.deltaY * 0.004));
      } else camera.pan(-event.deltaX, -event.deltaY);
    }, { passive: false });

    svg.addEventListener('click', (event) => {
      if (dragged) { dragged = false; return; }
      const chip = event.target.closest('.g-chip');
      if (chip) { toggleChain(Number(chip.dataset.chip)); return; }
      const badge = event.target.closest('.g-more');
      if (badge) { expand(Number(badge.dataset.more)); return; }
      const also = event.target.closest('.g-also');
      if (also) { toggleAlso(Number(also.dataset.also)); return; }
      const node = event.target.closest('.g-node');
      if (node && node.dataset.group !== undefined) openGroup(node.dataset.group);
      else if (node) select(Number(node.dataset.node), false);
    });
    svg.addEventListener('dblclick', (event) => {
      const node = event.target.closest('.g-node');
      if (node && node.dataset.node !== undefined && !event.target.closest('.g-more, .g-also, .g-chip')) {
        go(Number(node.dataset.node));
      }
    });

    /* The trace follows the pointer, and the keys. */
    svg.addEventListener('pointerover', (event) => {
      // Not while panning or pinching: the pointer is moving the drawing.
      if (fingers.size > 0 && dragged) return;
      const node = event.target.closest('.g-node');
      traceTo(node ? unitOf(node) : null);
    });
    svg.addEventListener('pointerleave', () => traceTo(null));
    svg.addEventListener('focusin', (event) => {
      const node = event.target.closest('.g-node');
      if (node) traceTo(unitOf(node));
    });
    svg.addEventListener('focusout', () => traceTo(null));
    statusEl.addEventListener('click', (event) => {
      if (!event.target.closest('[data-again]')) return;
      state.opened.clear();
      draw(false);
    });

    const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    svg.addEventListener('keydown', (event) => {
      const node = event.target.closest('.g-node');
      if (!node) return;
      const v = unitOf(node);
      if (KEYS[event.key]) {
        event.preventDefault();
        state.cursor = step(state.placed, v, KEYS[event.key]);
        paintSelection(true);
        camera.reveal(at(state.cursor));
      } else if (isGroup(v) && (event.key === 'Enter' || event.key === ' ' || event.key === '+')) {
        event.preventDefault();
        openGroup(v);
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select(v, true);
      } else if ((event.key === 'w' || event.key === 'W') && state.hood.chips.has(v)) {
        event.preventDefault();
        toggleChain(v);
      } else if (event.key === '+') {
        event.preventDefault();
        expand(v);
      } else if ((event.key === 'o' || event.key === 'O') && !isGroup(v) && state.hood.others.has(v)) {
        event.preventDefault();
        toggleAlso(v);
      } else if (event.key === 'Escape' && state.open !== null) {
        event.preventDefault();
        closeDetails();
      }
    });

    panel.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target) return;
      const v = state.open;
      if (target.dataset.go !== undefined) go(Number(target.dataset.go));
      else if (target.dataset.group !== undefined) { state.openGroups.add(target.dataset.group); drawDetails(); }
      else if (target.dataset.act === 'close') closeDetails();
      else if (target.dataset.act === 'centre') go(v);
      else if (target.dataset.act === 'expand') expand(v);
      else if (target.dataset.act === 'also') toggleAlso(v);
      else if (target.dataset.act === 'walk') { current = v; drawEntries(); showView('walk'); }
    });
    panel.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.preventDefault(); closeDetails(); }
    });

    /* ── search over every node, as a combobox ── */

    const findInput = document.getElementById('g-search');
    const resultsEl = document.getElementById('g-results');
    let hits = [];
    let active = -1;

    const closeResults = () => {
      resultsEl.hidden = true;
      findInput.setAttribute('aria-expanded', 'false');
      findInput.removeAttribute('aria-activedescendant');
      active = -1;
    };

    const markActive = () => {
      resultsEl.querySelectorAll('.g-hit').forEach((el, n) => el.setAttribute('aria-selected', String(n === active)));
      if (active >= 0) {
        const el = document.getElementById('g-hit-' + active);
        findInput.setAttribute('aria-activedescendant', el.id);
        el.scrollIntoView({ block: 'nearest' });
      } else findInput.removeAttribute('aria-activedescendant');
    };

    const drawResults = () => {
      if (findInput.value.trim() === '') { closeResults(); return; }
      const found = search(model, findInput.value, 40);
      hits = found.hits;
      active = hits.length > 0 ? 0 : -1;
      resultsEl.innerHTML = hits.map((i, n) =>
        `<li id="g-hit-${n}" role="option" class="g-hit" data-hit="${i}" aria-selected="false" ` +
        `style="--hue:${hueOf(nodes[i][RP])}">` +
        `<span class="row-name"><span class="glyph">${esc(glyphOf(i))}</span>${esc(nodes[i][LB])}</span>` +
        `<span class="row-meta">${esc(repoName(i))} &middot; ${esc(kinds[nodes[i][KD]] || typeOf(i))}` +
        (placeOf(i) ? ' &middot; ' + esc(placeOf(i)) : '') + '</span></li>').join('') +
        (found.total > hits.length
          ? `<li role="presentation"><div class="cut">${(found.total - hits.length).toLocaleString()} more. Keep typing to narrow.</div></li>`
          : '') +
        (found.total === 0 ? '<li role="presentation"><div class="cut">Nothing matches every word.</div></li>' : '');
      resultsEl.hidden = false;
      findInput.setAttribute('aria-expanded', 'true');
      markActive();
    };

    const pick = (i) => {
      closeResults();
      findInput.value = '';
      if (state.picking !== null) chooseEnd(i);
      else go(i);
    };

    findInput.addEventListener('input', drawResults);
    findInput.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (resultsEl.hidden) { drawResults(); return; }
        if (hits.length === 0) return;
        active = (active + (event.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
        markActive();
      } else if (event.key === 'Enter') {
        if (active >= 0 && !resultsEl.hidden) { event.preventDefault(); pick(hits[active]); }
      } else if (event.key === 'Escape' && !resultsEl.hidden) {
        // Closing the list is all this Escape does; the panel and full screen stay.
        event.preventDefault();
        closeResults();
      } else if (event.key === 'Escape' && state.picking !== null) {
        // So is giving up picking a path's end, the search's other errand.
        event.preventDefault();
        stopPicking();
      }
    });
    findInput.addEventListener('blur', () => setTimeout(closeResults, 120));
    resultsEl.addEventListener('mousedown', (event) => event.preventDefault());
    resultsEl.addEventListener('click', (event) => {
      const hit = event.target.closest('.g-hit');
      if (hit) pick(Number(hit.dataset.hit));
    });

    const graph = {
      go,
      refresh: () => { if (state.focus !== null) draw(false); },
      /* Opening the tab: on what was asked for, else where it was, else the
         way in the walk is on. */
      show(asked) {
        if (asked !== undefined && asked !== null) go(asked);
        else if (state.focus === null) go(current ?? 0);
        else { draw(true); syncControls(); }
      },
      setHops(hops) { state.hops = hops; hopsSel.value = String(hops); },
      /* What a link says the filters hide, by name; a name this page does not
         have hides nothing. Drawn by whatever opens the view next. */
      setHidden(hidden) {
        const pick = (names, list) => new Set(names.map((name) => list.indexOf(name)).filter((i) => i >= 0));
        const services = new Set(hidden.services);
        shown.clear();
        for (const name of repos) if (!services.has(name)) shown.add(name);
        for (const b of fleet.querySelectorAll('.ship')) b.setAttribute('aria-pressed', String(shown.has(b.dataset.repo)));
        state.hiddenEdgeTypes.clear();
        for (const i of pick(hidden.edgeTypes, edgeTypes)) state.hiddenEdgeTypes.add(i);
        state.hiddenConfidences.clear();
        for (const i of pick(hidden.confidences, confidences)) state.hiddenConfidences.add(i);
        for (const { chip, hidden: set, i } of filterChips) chip.setAttribute('aria-pressed', String(!set.has(i)));
        drawEntries();
      },
      /* The question a link asks of the view on its focus. Says why when it
         cannot be asked here; true when it was. */
      ask(question, focus) {
        if (question.kind === 'only') {
          state.problemsOnly = true;
          draw(false);
          return true;
        }
        if (question.kind === 'impact') {
          askImpact(focus);
          return true;
        }
        if (question.to === null) return false;
        state.ends = { from: focus, to: question.to };
        state.directed = question.directed;
        state.pathDepth = PATH_DEPTHS.includes(question.depth) ? question.depth : 12;
        askPath();
        return true;
      },
    };

    /* ── the frame: full screen, the drawer, pictures, links ─────────── */

    /* What a person set for themselves - the panel's width, whether it is
       folded - kept in this browser only. The page is whole without it: a
       private window, or storage switched off, just starts from the defaults. */
    const remembered = {
      read(key, fallback) {
        try {
          const value = localStorage.getItem('flowatlas.graph.' + key);
          return value === null ? fallback : JSON.parse(value);
        } catch { return fallback; }
      },
      write(key, value) {
        try { localStorage.setItem('flowatlas.graph.' + key, JSON.stringify(value)); } catch { /* kept for this visit only */ }
      },
    };

    /* A button says what it did, in its own words, for a moment. */
    const flash = (button, text, ok = true) => {
      const label = button.querySelector('span') || button;
      if (button.dataset.label === undefined) button.dataset.label = label.textContent;
      label.textContent = text;
      button.classList.toggle('is-done', ok);
      clearTimeout(Number(button.dataset.timer));
      button.dataset.timer = String(setTimeout(() => {
        label.textContent = button.dataset.label;
        button.classList.remove('is-done');
      }, 1600));
    };

    /* What a link asked for and could not be given, said over the drawing
       until the view moves on or it is dismissed. */
    const noticeEl = document.getElementById('g-notice');
    let noticeAt = null;
    const notice = {
      say(html) {
        noticeEl.innerHTML = `<span>${html}</span>` +
          '<button class="g-close" aria-label="Dismiss" title="Dismiss">&times;</button>';
        noticeEl.hidden = false;
        noticeAt = hashNow();
      },
      clear() {
        noticeEl.hidden = true;
        noticeEl.replaceChildren();
        noticeAt = null;
      },
      /* Called whenever the address changes: a notice is about the view it
         was said over, not the next one. */
      moved() { if (noticeAt !== null && hashNow() !== noticeAt) notice.clear(); },
    };
    noticeEl.addEventListener('click', (event) => { if (event.target.closest('button')) notice.clear(); });

    /* What a link had expanded, and whose "who else" it drew, on top of its
       focus. */
    const reopen = (expanded, also) => {
      state.expanded = [...expanded];
      state.also = [...also];
      draw(true);
      writeHash();
    };

    /* Full screen is the page's, not the browser's: the browser's own takes
       Escape for itself, and Escape here closes the panel first. */
    const root = document.documentElement;
    const fullBtn = document.getElementById('g-full');
    const fullScreen = (() => {
      let on = false;
      const set = (next) => {
        if (next === on) return;
        on = next;
        root.classList.toggle('is-full', on);
        fullBtn.setAttribute('aria-pressed', String(on));
        fullBtn.title = on ? 'Leave full screen (Escape)' : 'Full screen (F)';
        fullBtn.querySelector('span').textContent = on ? 'Leave full screen' : 'Full screen';
        fullBtn.querySelector('kbd').textContent = on ? 'Esc' : 'F';
        if (state.placed !== null && view === 'graph') camera.frame(state.placed, at(state.focus), false);
      };
      return { set, toggle: () => set(!on), isOn: () => on };
    })();
    fullBtn.addEventListener('click', () => fullScreen.toggle());

    /* The drawer: drag its edge to widen it, fold it to a rail. */
    const grip = document.getElementById('g-grip');
    const foldBtn = document.getElementById('g-fold');
    const rail = document.getElementById('g-rail');
    const railName = document.getElementById('g-rail-name');
    const drawer = (() => {
      let width = Number(remembered.read('width', 330)) || 330;
      let folded = remembered.read('folded', false) === true;
      const room = () => stage.clientWidth || window.innerWidth;
      const apply = () => {
        stage.style.setProperty('--drawer-w', width + 'px');
        stage.classList.toggle('is-folded', folded);
        const say = folded ? 'Unfold the details panel' : 'Fold the details panel';
        foldBtn.setAttribute('aria-expanded', String(!folded));
        foldBtn.setAttribute('aria-label', say);
        foldBtn.title = say;
        rail.setAttribute('aria-expanded', String(!folded));
        grip.setAttribute('aria-valuemin', String(DRAWER.min));
        grip.setAttribute('aria-valuemax', String(drawerWidth(Infinity, room())));
        grip.setAttribute('aria-valuenow', String(width));
      };
      const resize = (wanted) => {
        width = drawerWidth(wanted, room());
        apply();
        remembered.write('width', width);
      };
      const fold = (next) => {
        folded = next;
        apply();
        remembered.write('folded', folded);
      };
      /* The rail names what is open, so a folded panel still says what it holds. */
      const name = () => {
        const v = state.open;
        railName.textContent = v === null ? '' : nodes[v][LB];
        rail.style.setProperty('--hue', v === null ? 'var(--rule)' : hueOf(nodes[v][RP]));
        rail.setAttribute('aria-label', v === null ? 'Unfold the details panel'
          : `Unfold the details of ${nodes[v][LB]}`);
      };
      new MutationObserver(name).observe(panel, { childList: true });
      width = drawerWidth(width, window.innerWidth);
      apply();
      return { resize, fold, width: () => width, folded: () => folded };
    })();

    foldBtn.addEventListener('click', () => drawer.fold(!drawer.folded()));
    rail.addEventListener('click', () => { drawer.fold(false); foldBtn.focus(); });

    let gripFrom = null;
    grip.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      gripFrom = { x: event.clientX, width: drawer.width() };
      grip.setPointerCapture(event.pointerId);
      grip.classList.add('is-dragging');
    });
    grip.addEventListener('pointermove', (event) => {
      // The drawer is on the right, so dragging its edge left widens it.
      if (gripFrom !== null) drawer.resize(gripFrom.width + gripFrom.x - event.clientX);
    });
    const letGrip = () => { gripFrom = null; grip.classList.remove('is-dragging'); };
    grip.addEventListener('pointerup', letGrip);
    grip.addEventListener('pointercancel', letGrip);
    const GRIP_KEYS = {
      ArrowLeft: (w) => w + 24,
      ArrowRight: (w) => w - 24,
      Home: () => DRAWER.min,
      End: () => Infinity,
    };
    grip.addEventListener('keydown', (event) => {
      if (GRIP_KEYS[event.key]) {
        event.preventDefault();
        drawer.resize(GRIP_KEYS[event.key](drawer.width()));
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        drawer.fold(true);
        rail.focus();
      }
    });

    /* A canvas that changes size - full screen, a wider or folded panel, a
       turned phone - keeps what was in its middle in its middle. */
    new ResizeObserver(() => {
      camera.resized();
      if (state.placed !== null) sizeMinimap(extentOf(state.placed));
    }).observe(wrap);

    /* A picture of the drawing as it stands, at its own size rather than the
       window's: every style the page gives it written onto the element, since
       the file will not have the page's stylesheet, and anything the page hides
       left out. A part of the drawing that is not part of the picture says so
       with `data-export="skip"`.

       A picture is taken at full detail whatever the zoom: zoomed out, the
       screen shows shapes without names, but a picture is read at its own
       size, so its names, counts and badges are drawn, and each service's name
       sits at the left of its band rather than wherever the camera left it. */
    const atFullDetail = (take) => {
      const was = zoomNow || 'near';
      if (was !== 'near') {
        svg.classList.remove('z-' + was);
        svg.classList.add('z-near');
      }
      const laneSize = svg.style.getPropertyValue('--lane-size');
      svg.style.setProperty('--lane-size', '12.5px');
      for (const name of world.querySelectorAll('.g-lane text')) name.setAttribute('x', '12');
      try {
        return take();
      } finally {
        if (was !== 'near') {
          svg.classList.remove('z-near');
          svg.classList.add('z-' + was);
        }
        svg.style.setProperty('--lane-size', laneSize);
        pinLaneNames(camera.view());
      }
    };
    const PICTURE_STYLES = ['display', 'visibility', 'opacity', 'fill', 'fill-opacity', 'stroke',
      'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'stroke-opacity',
      'paint-order', 'font-family', 'font-size', 'font-weight', 'font-style', 'letter-spacing',
      'text-transform', 'text-anchor', 'dominant-baseline'];
    const PICTURE_PAD = 24;
    const picture = () => atFullDetail(() => {
      const box = world.getBBox();
      const width = Math.ceil(box.width + PICTURE_PAD * 2);
      const height = Math.ceil(box.height + PICTURE_PAD * 2);
      const copy = svg.cloneNode(true);
      const from = [...svg.querySelectorAll('*')];
      const to = [...copy.querySelectorAll('*')];
      const dropped = [];
      from.forEach((el, n) => {
        const out = to[n];
        const style = getComputedStyle(el);
        if (el.closest('[data-export="skip"]') || style.display === 'none' || style.visibility === 'hidden') {
          dropped.push(out);
          return;
        }
        out.setAttribute('style', PICTURE_STYLES.map((name) => `${name}:${style.getPropertyValue(name)}`).join(';'));
        for (const attr of [...out.attributes]) {
          if (/^(class|tabindex|role|aria-|data-)/.test(attr.name)) out.removeAttribute(attr.name);
        }
      });
      for (const el of dropped) el.remove();
      for (const attr of [...copy.attributes]) copy.removeAttribute(attr.name);
      copy.setAttribute('xmlns', SVG_NS);
      copy.setAttribute('width', String(width));
      copy.setAttribute('height', String(height));
      copy.setAttribute('viewBox', `0 0 ${width} ${height}`);
      copy.querySelector('#g-world').setAttribute('transform', `translate(${PICTURE_PAD - box.x} ${PICTURE_PAD - box.y})`);
      const ground = getComputedStyle(wrap).backgroundColor;
      copy.prepend(
        svgEl('title', {}, `${document.title}: around ${nodes[state.focus][LB]}`),
        svgEl('rect', { width, height, fill: ground }),
      );
      const text = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
      return { text, width, height };
    });

    const save = (blob, name) => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
    const pictureFile = (ext) => pictureName(document.title, nodes[state.focus][LB], ext);

    const svgOut = document.getElementById('g-svg-out');
    const pngOut = document.getElementById('g-png-out');
    svgOut.addEventListener('click', () => {
      const shot = picture();
      save(new Blob([shot.text], { type: 'image/svg+xml' }), pictureFile('svg'));
      flash(svgOut, 'Saved');
    });
    /* PNG: the same SVG drawn onto a canvas, in the page, offline. */
    pngOut.addEventListener('click', async () => {
      try {
        const shot = picture();
        const scale = pictureScale(shot.width, shot.height, Math.max(2, window.devicePixelRatio || 1));
        const image = new Image();
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(shot.text);
        await image.decode();
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(shot.width * scale);
        canvas.height = Math.round(shot.height * scale);
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        context.drawImage(image, 0, 0, shot.width, shot.height);
        const blob = await new Promise((done) => canvas.toBlob(done, 'image/png'));
        if (blob === null) throw new Error('the browser would not encode the picture');
        save(blob, pictureFile('png'));
        flash(pngOut, 'Saved');
      } catch (error) {
        pngOut.title = 'Could not save the picture: ' + (error && error.message ? error.message : error);
        flash(pngOut, 'Failed', false);
      }
    });

    /* Copy link: this view's address, which names nodes by key and so opens the
       same view in this file after the graph is rebuilt. */
    const copyBtn = document.getElementById('g-copy');
    copyBtn.addEventListener('click', async () => {
      const link = location.href.split('#')[0] + hashNow();
      let copied = false;
      try {
        await navigator.clipboard.writeText(link);
        copied = true;
      } catch {
        // No clipboard API here (an older browser, or a page it does not trust):
        // the selection still copies.
        const area = document.createElement('textarea');
        area.value = link;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.append(area);
        area.select();
        try { copied = document.execCommand('copy'); } catch { copied = false; }
        area.remove();
      }
      if (copied) flash(copyBtn, 'Copied');
      else window.prompt('Copy this link', link);
    });

    /* Keys for the frame. `F` is full screen anywhere but a text field; `W`,
       `+`, Enter and the arrows belong to a node with the keyboard on it.

       Escape closes one thing at a time, the nearest first:
         1. the search's list of nodes, or picking a path's end with it;
         2. the details panel, which is the drawer in full screen;
         3. the problems list, a half-chosen path, then a path or impact
            answer, back to the neighbourhood;
         4. full screen.
       The search, a node and the panel close what is theirs and say so with
       preventDefault; whatever is left comes here. */
    const typing = (el) => el instanceof HTMLElement &&
      (el.isContentEditable || el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA');
    document.addEventListener('keydown', (event) => {
      if (view !== 'graph' || event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return;
      if ((event.key === 'f' || event.key === 'F') && !typing(event.target)) {
        event.preventDefault();
        fullScreen.toggle();
      } else if (event.key === 'Escape') {
        if (!resultsEl.hidden) closeResults();
        else if (state.picking !== null) stopPicking();
        else if (state.open !== null) closeDetails();
        else if (dismissAnswer()) { /* closed */ }
        else if (fullScreen.isOn()) fullScreen.set(false);
        else return;
        event.preventDefault();
      }
    });

    /* ── wiring ──────────────────────────────────────────────────────── */

    const controls = document.getElementById('walk-controls');
    const legendEl = document.getElementById('legend');
    const tabs = [...document.querySelectorAll('.tab')];
    let view = 'walk';

    const WALK_LEGEND =
      '<span><b>Trust</b> static, read from the code &middot; marker, an annotation said so &middot; heuristic, a guess</span>' +
      '<span><b>:param</b> a route hole, so one address matches every id</span>';
    const line = (dash) => `<svg width="30" height="8" aria-hidden="true"><path d="M1 4H29" stroke="currentColor" ` +
      `stroke-width="1.6" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/></svg>`;
    const GRAPH_LEGEND =
      `<span>${line('')} static</span><span>${line('6 4')} heuristic</span>` +
      `<span>${line('0.5 4')} marker, declared</span>` +
      '<span><b>band</b> one service; a coloured line leaving it crosses into another</span>' +
      '<span><b>stacked box</b> a group, with its count; click to open</span>' +
      '<span><b>2 guards &middot; 1 pipe</b> plumbing folded onto a way in; click to draw it</span>' +
      '<span><b>+N</b> more of the flow, not drawn; click to expand</span>' +
      '<span><b class="g-key-context">faded, dashed</b> context: who else uses a node, outside the flow; ' +
      'its <b>used by N others</b> badge, or O, draws it</span>' +
      '<span><b class="g-key-bad">3</b> rows name the node &middot; <b class="g-key-warn">2</b> rows at its line</span>' +
      '<span><b>hover</b> lights the way from the focus</span>' +
      '<span><b>keys</b> arrows move &middot; Enter opens &middot; + expands &middot; O who else &middot; W unfolds plumbing &middot; ' +
      'F full screen &middot; Escape closes &middot; double-click centres</span>';

    function showView(name, asked) {
      if (name !== 'graph') fullScreen.set(false);
      view = name;
      for (const tab of tabs) tab.setAttribute('aria-selected', String(tab.dataset.view === name));
      controls.hidden = name !== 'walk';
      walkEl.hidden = name === 'graph';
      graphView.hidden = name !== 'graph';
      legendEl.innerHTML = name === 'graph' ? GRAPH_LEGEND : WALK_LEGEND;
      if (name !== 'graph' && location.hash.startsWith('#graph')) {
        history.replaceState(null, '', location.pathname + location.search);
      }
      if (name === 'walk') drawWalk();
      else if (name === 'crossings') drawCrossings();
      else if (name === 'missing') drawMissing();
      else graph.show(asked);
    }

    for (const tab of tabs) tab.addEventListener('click', () => showView(tab.dataset.view));

    /* A link to a node is a hash; following one opens the graph there. A link
       made before nodes had keys names a position, and still opens whatever
       sits there; a key this page does not hold is said, not guessed at. */
    const followHash = () => {
      const asked = parseHash(location.hash, keys);
      if (asked === null) return false;
      notice.clear();
      if (asked.hops !== null) graph.setHops(asked.hops);
      if (asked.focus === null) {
        showView('graph');
        if (asked.among.length > 0) {
          const hops = asked.hops === null ? '' : '/' + asked.hops;
          notice.say(`This link's key, <code>${esc(asked.key)}</code>, now names ${asked.among.length} nodes, ` +
            'since one was added after the link was made. Open ' + asked.among.map((v) =>
              `<a href="#graph/${keys.keyOf(v)}${hops}">${esc(nodes[v][LB])}</a> (${esc(repoName(v))})`).join(' or ') + '.');
        } else {
          notice.say(`This link names a node this page does not hold, <code>${esc(asked.key)}</code>: ` +
            'it was removed or renamed after the link was made.');
        }
        return true;
      }
      if (asked.hidden !== null) graph.setHidden(asked.hidden);
      showView('graph', asked.focus);
      const answered = asked.ask === null || graph.ask(asked.ask, asked.focus);
      if (asked.expanded.length > 0 || asked.also.length > 0) reopen(asked.expanded, asked.also);
      if (!answered) {
        notice.say(`This link asks for a path to a node this page does not hold, <code>${esc(asked.ask.key)}</code>: ` +
          'it was removed or renamed after the link was made. Its start is drawn.');
      } else if (asked.byPosition) {
        notice.say('This older link names a node by its place in the page, so it opens what is there in this ' +
          'build. The address now names it by key, which lasts.');
      }
      return true;
    };
    window.addEventListener('hashchange', followHash);

    entrySearch.addEventListener('input', drawEntries);
    kindSelect.addEventListener('change', drawEntries);
    depthSel.addEventListener('change', drawWalk);
    capSel.addEventListener('change', drawWalk);

    document.getElementById('colophon').innerHTML =
      'Everything here was read from source, never run. A path shown as <code>/orders/:param/cancel</code> ' +
      'is the route as registered; a caller writes a real id there. Where a call could not be ' +
      'followed, it appears under <b>Not joined</b> with the reason rather than being dropped, which is the ' +
      'difference between a map and a guess.';

    /* Open on a way in that actually leaves a service rather than on an empty
       shell. Which one that is gets computed from the graph in hand: walk the
       forward edges backwards from every crossing, and take the first way in
       the walk reached. Naming a route here would only ever fit one project. */
    const reachesCrossing = (() => {
      const back = nodes.map(() => []);
      const seen = new Uint8Array(nodes.length);
      const queue = [];
      for (const e of data.edges) {
        const name = edgeTypes[e[2]];
        if (FORWARD.has(name)) back[e[1]].push(e[0]);
        if (CROSSES.has(name) && !seen[e[0]]) { seen[e[0]] = 1; queue.push(e[0]); }
      }
      for (let head = 0; head < queue.length; head += 1) {
        for (const prev of back[queue[head]]) {
          if (!seen[prev]) { seen[prev] = 1; queue.push(prev); }
        }
      }
      return seen;
    })();

    current = entryIx.find((i) => reachesCrossing[i]) ?? entryIx[0];
    drawEntries();
    if (!followHash()) showView('walk');
  })();
</script>
