        svgEl('rect', { class: 'g-sheet', x: 6, y: -6, width: BOX.w, height: BOX.h, rx: 3 }),
        svgEl('rect', { class: 'g-sheet', x: 3, y: -3, width: BOX.w, height: BOX.h, rx: 3 }),
        svgEl('rect', { class: 'g-box', width: BOX.w, height: BOX.h, rx: 3 }),
        svgEl('rect', { class: 'g-rule', width: 3, height: BOX.h, rx: 1 }),
      );
      const glyph = GLYPH[typeName] || typeName.slice(0, 4);
      const gw = glyph.length * 5.8 + 8;
      const digits = count.toLocaleString();
      const room = BOX.w - 11 - gw - 6 - digits.length * 9.5 - 14;
      g.append(
        svgEl('rect', { class: 'g-glyph', x: 11, y: 7, width: gw, height: 13, rx: 2 }),
        svgEl('text', { class: 'g-glyph-text', x: 15, y: 16.5 }, glyph),
        svgEl('text', { class: 'g-label', x: 11 + gw + 6, y: 18 }, middle(name, fits(room, 7.1))),
        svgEl('text', { class: 'g-sub', x: 11, y: 33 }, middle(sub, fits(BOX.w - 19 - digits.length * 9.5, 5.7))),
        svgEl('text', { class: 'g-count', x: BOX.w - 10, y: 27 }, digits),
      );
      // A group carries its members' badges, summed per tone.
      const tones = new Map();
      for (const v of group.members) {
        for (const badge of badgesFor(v)) {
          const tone = badge.tone || 'info';
          tones.set(tone, (tones.get(tone) || 0) + (Number(badge.count) || 0));
        }
      }
      drawBadges(g, ['bad', 'warn', 'info'].filter((tone) => tones.get(tone) > 0)
        .map((tone) => ({ count: tones.get(tone), tone, title: `${tones.get(tone)} across the group` })));
      return g;
    };

    /* Selection and the keyboard cursor change classes, never the drawing: a
       redraw under a double click would leave the second click nowhere. */
    const paintSelection = (moveFocus) => {
      for (const el of world.querySelectorAll('.g-node')) {
        const v = unitOf(el);
        el.classList.toggle('is-open', v === state.open);
        el.setAttribute('tabindex', v === state.cursor ? '0' : '-1');
        if (moveFocus && v === state.cursor) el.focus({ preventScroll: true });
      }
      const open = String(state.open);
      for (const el of world.querySelectorAll('.g-link')) {
        el.classList.toggle('is-lit', state.open !== null && (el.dataset.from === open || el.dataset.to === open));
      }
    };

    /* Hovering, or moving the keys onto, a unit lights the way the walk took
       from the focus to it, and quiets everything else. */
    const traceTo = (unit) => {
      const path = unit === null || state.hood === null ? [] : trace(state.hood, unit);
      const on = new Set(path.map(String));
      const steps = new Set();
      for (let i = 1; i < path.length; i += 1) {
        steps.add(path[i - 1] + '|' + path[i]);
        steps.add(path[i] + '|' + path[i - 1]);
      }
      world.classList.toggle('is-tracing', path.length > 1);
      for (const el of world.querySelectorAll('.g-node')) el.classList.toggle('is-on', on.has(String(unitOf(el))));
      for (const el of world.querySelectorAll('.g-link')) {
        el.classList.toggle('is-on', steps.has(el.dataset.from + '|' + el.dataset.to));
      }
    };

    /* ── the hover card: a node's types, or one type's fields ── */

    /* One floating card, shown after a pause on whatever it describes and
       moved, not hidden, while the pointer goes from one thing to the next.
       It describes what it is anchored to (aria-describedby), so the keys
       read it too; touch never shows it, since a tap already opens details.
       The pointer can cross onto it and stay: leaving what it describes only
       hides it after a pause, and being on it holds it. */
    const card = (() => {
      const el = document.createElement('div');
      el.className = 'g-card';
      el.id = 'g-card';
      el.setAttribute('role', 'tooltip');
      el.hidden = true;
      document.body.append(el);
      const DELAY = { first: 250, next: 60, leave: 120 };
      const GAP = 10;
      const EDGE = 8;
      let timer = 0;
      let key = null;
      let anchor = null;
      let side = 'side';
      let build = null;

      const clear = () => { clearTimeout(timer); timer = 0; };
      const hide = () => {
        clear();
        if (anchor !== null) anchor.removeAttribute('aria-describedby');
        anchor = null;
        key = null;
        el.hidden = true;
      };
      /* Beside the anchor - to its right, or below it - and flipped or held
         inside the window when there is no room that way. */
      const place = (box, side) => {
        const w = el.offsetWidth, h = el.offsetHeight;
        const vw = window.innerWidth, vh = window.innerHeight;
        let x, y;
        if (side === 'below') {
          x = box.left;
          y = box.bottom + 6 + h <= vh - EDGE ? box.bottom + 6 : box.top - 6 - h;
        } else {
          x = box.right + GAP + w <= vw - EDGE ? box.right + GAP : box.left - GAP - w;
          y = box.top;
        }
        el.style.left = Math.round(Math.max(EDGE, Math.min(x, vw - EDGE - w))) + 'px';
        el.style.top = Math.round(Math.max(EDGE, Math.min(y, vh - EDGE - h))) + 'px';
      };
      const show = (target, asked, make, where) => {
        clear();
        if (anchor !== null && anchor !== target) anchor.removeAttribute('aria-describedby');
        el.innerHTML = make();
        el.hidden = false;
        el.scrollTop = 0;
        place(target.getBoundingClientRect(), where);
        target.setAttribute('aria-describedby', el.id);
        anchor = target;
        key = asked;
        side = where;
        build = make;
      };
      const soon = () => {
        clear();
        if (!el.hidden) timer = setTimeout(hide, DELAY.leave);
      };
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') hide(); });
      // Scrolling the card itself is reading it; any other scroll moves what it points at.
      window.addEventListener('scroll', (event) => { if (!el.contains(event.target)) hide(); }, true);
      window.addEventListener('resize', hide);
      el.addEventListener('pointerenter', clear);
      el.addEventListener('pointerleave', soon);
      // A press on one of its buttons keeps the keyboard where it was, so the
      // node it describes does not lose focus and take the card with it.
      el.addEventListener('mousedown', (event) => { if (event.target.closest('button')) event.preventDefault(); });
      return {
        el,
        /* After a pause: a long one onto the first thing, a short one between. */
        later(target, asked, make, where) {
          if (asked === key) { clear(); return; }
          clear();
          timer = setTimeout(() => show(target, asked, make, where), el.hidden ? DELAY.first : DELAY.next);
        },
        now: (target, asked, make, where) => show(target, asked, make, where),
        /* Off what it describes onto nothing: gone unless something else is hovered first. */
        soon,
        hide,
        /* What it shows, or null. */
        showing: () => (el.hidden ? null : key),
        /* The keys or the pointer are on it: focus leaving what it describes
           for the card, or text on it being selected, is not leaving. */
        holds: (node) => !el.hidden && ((node !== null && el.contains(node)) || el.matches(':hover')),
        /* Drawn again where it is, after what it shows grew: it keeps its
           corner, under the pointer that asked, and only moves up as far as
           the window needs. Placed afresh, a taller card flips away from its
           anchor and out from under the pointer, which then leaves it. */
        refresh() {
          if (el.hidden || build === null) return;
          const top = el.scrollTop;
          el.innerHTML = build();
          const y = Math.min(parseFloat(el.style.top) || EDGE, window.innerHeight - EDGE - el.offsetHeight);
          el.style.top = Math.round(Math.max(EDGE, y)) + 'px';
          el.scrollTop = top;
        },
      };
    })();

    const cardRowsHtml = (rows) => rows.map((row) =>
      `<div class="g-card-row"><span>${esc(row.name)}</span><span>${esc(row.text)}</span></div>`).join('');

    /* What a card was asked to show past its glance, for the one thing it is
       on; a card on anything else starts from a glance again. */
    let wideNow = { asked: null, ...GLANCE };
    const wideFor = (asked) => {
      if (wideNow.asked !== asked) wideNow = { asked, ...GLANCE };
      return wideNow;
    };
    /* The types the last node card showed, which a click on its node opens. */
    let cardSeen = { v: -1, types: [] };

    /* "+N more — show" where the card may grow, a plain count where its
       ceiling is what cut it. */
    const showHtml = (can, attr, text) => (can
      ? `<button class="g-card-show" ${attr}>${text} &mdash; show</button>`
      : `<div class="g-card-note">${text}</div>`);

    /* `open`: its name opens it in the details; `show`: what it cut can be shown. */
    const peekHtml = (peek, { open = false, show = true } = {}) =>
      `<div class="g-card-peek"><div class="g-card-type">` +
      (open
        ? `<button data-card-open="${peek.type}" title="Open it in the details">${esc(peek.name)}</button>`
        : esc(peek.name)) +
      ` <span>${esc(TYPE_KIND_SAYS[peek.kind] || peek.kind)} &middot; ${esc(peek.from)}</span></div>` +
      cardRowsHtml(peek.rows) +
      (peek.more > 0 ? showHtml(show, `data-card-rows="${peek.type}"`, '+' + plural(peek.more, 'more', 'more')) : '') +
      (peek.note ? `<div class="g-card-note">${esc(peek.note)}</div>` : '') +
      '</div>';

    /* A node's card: its full name, whose and where, what it is to the flow
       when it is context, and what it takes and gives back with a peek at
       each type that names. What it cut can be shown on it, up to its
       ceiling; its name, and each type's, go on to the details. */
    const nodeCardHtml = (v) => {
      const parts = labelParts(model, v);
      const context = contextOf(v);
      const found = cardOf(model, v, CARD_BOUNDS, wideFor('node:' + v));
      cardSeen = { v, types: found === null ? [] : found.peeks.map((peek) => peek.type) };
      const head = `<button class="g-card-title" data-card-node title="Open it in the details">${esc(nodes[v][LB])}</button>` +
        `<div class="g-card-sub">${esc([parts.owner, repoName(v), placeOf(v)].filter(Boolean).join(' · '))}</div>` +
        (context
          ? `<div class="g-card-note">Not in the flow: ${esc(ALSO_SAYS[context.look].mark(context.of))}. ` +
            'Double-click to centre on it.</div>'
          : '');
      if (found === null) {
        return head + (SHAPED.has(typeOf(v)) ? '<div class="g-card-note">Types not recorded.</div>' : '');
      }
      const show = !found.capped;
      return head +
        `<pre class="g-card-face">${esc(found.lines.join('\n'))}` +
          (found.more > 0
            ? '\n' + (show
              ? `<button class="g-card-show" data-card-lines>… ${plural(found.more, 'more line', 'more lines')} &mdash; show</button>`
              : `… ${plural(found.more, 'more line', 'more lines')}`)
            : '') + '</pre>' +
        found.peeks.map((peek) => peekHtml(peek, { open: true, show })).join('') +
        (found.left > 0 ? showHtml(show, 'data-card-types', plural(found.left, 'more type', 'more types')) : '') +
        (found.capped
          ? `<div class="g-card-note">A card holds ${CARD_BOUNDS.most} rows; the rest is in the details.</div>`
          : '') +
        '<div class="g-card-note">Click the node for everything &middot; E in the panel opens all</div>';
    };

    /* A type's card, from the panel: one level of it, without opening it, and
       every row of it when asked, up to a card's ceiling. */
    const typeCardHtml = (t, asked) => {
      const all = wideFor(asked).rows.includes(t);
      const peek = peekOf(model, t, all ? { ...CARD_BOUNDS, rows: CARD_BOUNDS.most - 1 } : CARD_BOUNDS);
      return peek === null
        ? ''
        : peekHtml(peek, { show: !all }) +
          '<div class="g-card-note">Click to open it here &middot; E opens everything under it</div>';
    };

    /* Only what a person can point at: not a touch, and not the badges on a
       node, which say what a click on them does. */
    const NODE_PARTS = '.g-more, .g-also, .g-chip';
    const cardNode = (event) => {
      const node = event.target.closest('.g-node');
      return node && node.dataset.node !== undefined && !event.target.closest(NODE_PARTS) ? node : null;
    };
    const visibleFocus = (el) => {
      try { return el.matches(':focus-visible'); } catch { return true; }
    };

    /* ── semantic zoom and the minimap: both follow the camera ── */

    const extentOf = (placed) => ({
      w: (placed.max - placed.min) * BOX.column + BOX.w + BOX.pad * 2,
      h: placed.height + BOX.pad * 2 + BOX.head,
    });

    let zoomNow = null;
    const paintZoom = (k) => {
      const level = zoomLevel(k);
      if (level !== zoomNow) {
        if (zoomNow !== null) svg.classList.remove('z-' + zoomNow);
        svg.classList.add('z-' + level);
        zoomNow = level;
      }
      // A lane keeps its name readable however far out, like a region on a map.
      svg.style.setProperty('--lane-size', Math.min(30, Math.max(12.5, 12.5 / k)).toFixed(1) + 'px');
    };

    /* A lane's name stays at the left edge of the screen while its band is on
       it, so the service is named wherever the camera is. */
    const pinLaneNames = ({ x, k }) => {
      const left = Math.max(12, (12 - x) / k);
      for (const name of world.querySelectorAll('.g-lane text')) name.setAttribute('x', left.toFixed(1));
    };

    const mini = document.createElement('div');
    mini.className = 'g-mini';
    mini.dataset.export = 'skip';
    mini.hidden = true;
    mini.title = 'The whole drawing. Click or drag to move there.';
    const miniSvg = svgEl('svg', { 'aria-hidden': 'true' });
    mini.append(miniSvg);
    wrap.append(mini);
    let miniView = null;

    const paintMinimap = () => {
      if (state.placed === null || miniView === null) return;
      const { x, y, k, w, h } = camera.view();
      const all = extentOf(state.placed);
      const view = { x: -x / k, y: -y / k, w: w / k, h: h / k };
      // Nothing to find when all of it is on screen.
      mini.hidden = view.x <= 0 && view.y <= 0 && view.x + view.w >= all.w && view.y + view.h >= all.h;
      miniView.setAttribute('x', view.x.toFixed(1));
      miniView.setAttribute('y', view.y.toFixed(1));
      miniView.setAttribute('width', view.w.toFixed(1));
      miniView.setAttribute('height', view.h.toFixed(1));
    };

    /* The minimap is a corner, never a column: it fits a small box whatever
       the drawing's shape. Sized by its width alone, an opened group of fifty
       made it taller than the canvas, over the column of callers on the left,
       and the first click on a group there moved the view instead. */
    const MINI = { w: 168, h: 120, narrow: { w: 108, h: 84 } };
    const sizeMinimap = (all) => {
      const most = wrap.clientWidth < 520 ? MINI.narrow : MINI;
      const scale = Math.min(most.w / all.w, Math.min(most.h, wrap.clientHeight * 0.3) / all.h);
      mini.style.width = Math.max(28, Math.round(all.w * scale)) + 'px';
      miniSvg.style.height = Math.max(20, Math.round(all.h * scale)) + 'px';
    };

    const drawMinimap = () => {
      const { hood, placed } = state;
      const all = extentOf(placed);
      miniSvg.setAttribute('viewBox', `0 0 ${all.w} ${all.h}`);
      miniSvg.setAttribute('preserveAspectRatio', 'none');
      sizeMinimap(all);
      const parts = [];
      for (const lane of placed.lanes) {
        const box = laneBox(lane);
        const band = svgEl('rect', { class: 'm-lane', x: 0, y: box.y, width: all.w, height: box.h });
        band.style.setProperty('--hue', laneHue(lane.repo));
        parts.push(band);
      }
      for (const v of hood.nodes) {
        const p = at(v);
        const unit = svgEl('rect', { class: v === hood.focus ? 'm-focus' : 'm-unit', x: p.x, y: p.y, width: BOX.w, height: BOX.h, rx: 4 });
        unit.style.setProperty('--hue', laneHue(repoOfUnit(v)));
        parts.push(unit);
      }
      miniView = svgEl('rect', { class: 'm-view' });
      parts.push(miniView);
      miniSvg.replaceChildren(...parts);
      paintMinimap();
    };

    camera.watch((view) => {
      paintZoom(view.k);
      pinLaneNames(view);
      paintMinimap();
    });

    const miniTo = (event) => {
      const box = miniSvg.getBoundingClientRect();
      const all = extentOf(state.placed);
      camera.lookAt(((event.clientX - box.left) / box.width) * all.w, ((event.clientY - box.top) / box.height) * all.h);
    };
    let miniDrag = null;
    mini.addEventListener('pointerdown', (event) => {
      // The canvas under it pans on a drag; here a drag moves the view.
      event.stopPropagation();
      miniDrag = event.pointerId;
      mini.setPointerCapture(event.pointerId);
      miniTo(event);
    });
    mini.addEventListener('pointermove', (event) => { if (miniDrag === event.pointerId) miniTo(event); });
    mini.addEventListener('pointerup', () => { miniDrag = null; });
    mini.addEventListener('pointercancel', () => { miniDrag = null; });

    const drawDrawing = () => {
      card.hide();
      const hadFocus = svg.contains(document.activeElement);
      const { hood, placed } = state;
      const heads = svgEl('g');
      for (let layer = placed.min; layer <= placed.max; layer += 1) {
        heads.append(svgEl('text', {
          class: 'g-col',
          x: (layer - placed.min) * BOX.column + BOX.pad + BOX.w / 2,
          y: BOX.pad + 4,
        }, columnName(layer)));
      }
      const links = svgEl('g');
      for (const k of hood.edges) links.append(drawEdge(k));
      for (const bundle of hood.bundles) links.append(drawBundle(bundle));
      const boxes = svgEl('g');
      for (const v of hood.nodes) boxes.append(isGroup(v) ? drawGroup(v) : drawNode(v));
      world.replaceChildren(drawLanes(placed, extentOf(placed).w), heads, links, boxes);
      world.classList.remove('is-tracing');
      pinLaneNames(camera.view());
      svg.setAttribute('aria-label', `Neighbourhood of ${nodes[state.focus][LB]}`);
      paintSelection(hadFocus);
      drawMinimap();
    };

    const drawStatus = () => {
      if (drawAnswer()) return;
      const { hood } = state;
      const filter = filterNow();
      const groups = [...hood.groups.values()];
      const drawnNodes = hood.nodes.length - groups.length;
      const parts = [
        `<b>${plural(drawnNodes, 'node', 'nodes')}</b>` +
        (groups.length ? ` and <b>${plural(groups.length, 'group', 'groups')}</b>` : '') +
        ` drawn within ${plural(state.hops, 'hop', 'hops')} of <b>${esc(nodes[state.focus][LB])}</b>.`,
      ];
      if (groups.length > 0) {
        const held = groups.reduce((sum, group) => sum + group.members.length, 0);
        parts.push(`The groups hold ${plural(held, 'node', 'nodes')}` +
          (hood.behind > 0 ? `, with ${hood.behind.toLocaleString()} more past them` : '') +
          '; click one to open it.');
      }
      const context = [...hood.context.keys()]
        .reduce((sum, u) => sum + (isGroup(u) ? hood.groups.get(u).members.length : 1), 0);
      if (context > 0) {
        parts.push(`${plural(context, 'node', 'nodes')} faded as context: who else uses ` +
          `${plural(new Set([...hood.context.values()].map((c) => c.of)).size, 'node', 'nodes')} of the flow.`);
      }
      if (hood.left > 0) {
        parts.push(`<b>${hood.left.toLocaleString()} more</b> not drawn: the cap is ${state.cap}. ` +
          'Raise it, expand a node marked +N, or filter.');
      } else {
        parts.push(hood.nodes.length === 1 && hood.edges.length === 0
          ? 'Nothing the filters let through joins it.'
          : 'Nothing within reach is left out.');
      }
      if (filter.active) {
        const hiddenServices = repos.filter((name) => !shown.has(name)).length;
        const off = [
          hiddenServices && plural(hiddenServices, 'service', 'services'),
          state.hiddenEdgeTypes.size && plural(state.hiddenEdgeTypes.size, 'edge type', 'edge types'),
          state.hiddenConfidences.size && plural(state.hiddenConfidences.size, 'kind of trust', 'kinds of trust'),
        ].filter(Boolean);
        parts.push('Filters hide ' + off.join(', ') + '.');
      }
      const folded = [...hood.chips.values()].filter((chip) => !chip.open);
      if (folded.length > 0) {
        parts.push(`Plumbing in front of ${plural(folded.length, 'node', 'nodes')} is folded into its chip.`);
      }
      if (state.opened.size > 0) parts.push('<button class="g-again" data-again>Group again</button>');
      statusEl.className = 'g-status' + (hood.left > 0 ? ' is-cut' : '');
      statusEl.innerHTML = parts.join(' ');
    };

    /* ── the details panel ── */

    const edgeGroup = (dir, group, far) => {
      const key = dir + group.type;
      const all = group.edges;
      const listed = state.openGroups.has(key) ? all : all.slice(0, GROUP_LIMIT);
      const items = listed.map((k) => {
        const e = data.edges[k];
        const v = e[far];
        return `<li><button class="g-far" data-go="${v}" style="--hue:${hueOf(nodes[v][RP])}" ` +
          `title="Centre on ${esc(nodes[v][LB])}${placeOf(v) ? ', ' + esc(placeOf(v)) : ''}">` +
          `<span class="label">${esc(nodes[v][LB])}</span>` +
          `<small>${esc(repoName(v))} &middot; ${esc(confidences[e[3]])}</small></button></li>`;
      }).join('');
      const rest = all.length - listed.length;
      return `<div class="g-group"><div class="g-group-name">${esc(edgeTypes[group.type])} &middot; ${all.length}</div>` +
        `<ul class="g-edges">${items}</ul>` +
        (rest > 0 ? `<button class="g-more-btn" data-group="${key}">Show ${rest.toLocaleString()} more</button>` : '') +
        '</div>';
    };

    const rowHtml = (r) => {
      const row = data.rows[r];
      const reason = reasons[row[ROW.reason]];
      const tone = reason.includes('not-found') ? 'bad' : reason.includes('dynamic') ? 'warn' : '';
      const file = row[ROW.file] >= 0 ? files[row[ROW.file]] + (row[ROW.line] ? ':' + row[ROW.line] : '') : '';
      const hint = row[ROW.hint] >= 0 ? data.dicts.hints[row[ROW.hint]] : '';
      return `<div class="g-row"><span class="tag${tone ? ' is-' + tone : ''}">${esc(reason)}</span> ` +
        `<span class="hint">${esc(data.dicts.levels[row[ROW.level]])}` +
        (row[ROW.sites] > 1 ? ` &middot; ${row[ROW.sites]} places` : '') +
        (file ? ' &middot; ' + opener(row[ROW.repo], row[ROW.file], row[ROW.line], file) : '') + '</span>' +
        `<p>${esc(row[ROW.message])}</p>` +
        (hint ? `<p class="hint-text">${esc(hint)}</p>` : '') + '</div>';
    };

    /* What a node takes and gives back, worded by what kind of thing it is. */
    const FACE_SAYS = {
      method: { title: 'Takes and returns', back: 'returns', none: 'Takes no parameters.' },
      bare: {
        title: 'Takes and returns', back: 'returns', none: 'Takes no parameters.',
        note: 'Only the types were recorded, not the parameter names.',
      },
      route: { title: 'Request and response', back: 'responds', none: 'Reads no body, path params, query or headers.' },
      call: { title: 'Sends and expects back', back: 'gets back', none: 'Sends nothing typed.' },
      channel: { title: 'Payload', back: '', none: '', note: 'As its producers send it.' },
      handler: {
        title: 'Hands its handler', back: 'returns', none: 'Its handler takes no parameters.',
        note: 'What the function that answers it takes.',
      },
    };
    const TYPE_KIND_SAYS = { object: 'object', enum: 'enum', union: 'union', generic: 'generic', external: 'external' };

    /* A reference with each named type a button that opens it underneath.
       `at` names where the row sits, so one type opened in two rows is two
       openings; `inside` holds the types this row is already within, and one
       of those is marked as open above rather than opened again. */
    const refHtml = (r, at, inside) => refParts(model, r).map((part) => {
      if (part.type === undefined) return esc(part.text);
      if (part.type < 0) return `<span class="g-type is-plain" title="Not in the type registry">${esc(part.text)}</span>`;
      if (inside.has(part.type)) {
        return `<span class="g-type is-plain is-cycle" title="Already open above: this type holds itself">` +
          `&#8635; ${esc(part.text)}</span>`;
      }
      const open = state.openTypes.has(at + ':' + part.type);
      return `<button class="g-type" data-type="${part.type}" data-at="${esc(at)}" data-ref="${r}" ` +
        `aria-expanded="${open}">${esc(part.text)}</button>`;
    }).join('');

    /* What an "Expand all" left closed at the bounds, under where it was asked. */
    const moreHtml = (asked) => {
      const more = state.typeMore.get(asked);
      return more
        ? `<button class="g-type-more" data-more="${esc(asked)}">${plural(more.left, 'more type', 'more types')} ` +
          'left closed &mdash; open them</button>'
        : '';
    };

    const shapeRowHtml = (name, r, at, inside, back = false) => {
      const opened = [];
      let openable = false;
      let cycle = false;
      for (const part of refParts(model, r)) {
        if (part.type === undefined || part.type < 0) continue;
        if (inside.has(part.type)) { cycle = true; continue; }
        openable = true;
        if (state.openTypes.has(at + ':' + part.type) && !opened.includes(part.type)) opened.push(part.type);
      }
      return `<div class="g-shape-row${back ? ' g-shape-back' : ''}">` +
        `<span class="g-shape-name">${esc(name)}</span>` +
        `<span class="g-shape-type">${refHtml(r, at, inside)}` +
          (cycle ? ' <span class="g-shape-see">&mdash; see above</span>' : '') +
          (openable
            ? `<button class="g-type-all" data-all="${esc(at)}" data-ref="${r}" ` +
              'title="Open everything under this row">expand all</button>'
            : '') +
        '</span></div>' +
        moreHtml(at) +
        opened.map((t) => typeBodyHtml(t, at + ':' + t, inside)).join('');
    };

    const typeBodyHtml = (t, at, inside) => {
      const info = typeInfo(model, t);
      if (info === null) return '';
      const within = new Set(inside).add(t);
      const head = `${TYPE_KIND_SAYS[info.kind] || info.kind}` +
        (info.typeParams.length ? '&lt;' + esc(info.typeParams.join(', ')) + '&gt;' : '') +
        ` &middot; ${esc(info.declaredIn)}`;
      let body = '';
      if (info.kind === 'external') {
        body = `<p class="g-shape-note">Declared by a dependency; its fields are not read.</p>`;
      } else if (info.kind === 'enum') {
        body = `<div class="g-shape-row"><span class="g-shape-name">one of</span>` +
          `<span class="g-shape-type">${esc(info.members.map((m) => m.text).join(' | '))}</span></div>`;
      } else if (info.members.length > 0) {
        body = info.members.map((m, k) => (m.ref !== undefined
          ? shapeRowHtml('|', m.ref, at + '.' + k, within)
          : `<div class="g-shape-row"><span class="g-shape-name">|</span><span class="g-shape-type">${esc(m.text)}</span></div>`)).join('');
      } else if (info.fields.length > 0) {
        body = info.fields.map((f, k) => shapeRowHtml(f.name + (f.optional ? '?' : ''), f.ref, at + '.' + k, within)).join('');
      } else {
        body = '<p class="g-shape-note">No fields recorded.</p>';
      }
      return `<div class="g-type-body"><div class="g-type-head">${head}</div>${body}</div>`;
    };

    /* The rows of a face, by the names the panel gives them: a parameter or
       request part `p<k>`, what comes back `r`. */
    const faceRows = (face) => [
      ...face.params.map((param, k) => ({ at: 'p' + k, ref: param.ref })),
      ...(face.returns >= 0 ? [{ at: 'r', ref: face.returns }] : []),
    ];

    const shapeHtml = (v) => {
      const face = faceOf(model, v);
      if (face === null) {
        return SHAPED.has(typeOf(v))
          ? '<section><h4>Takes and returns</h4><p class="g-none">Types not recorded for this node. They are read ' +
            'for the methods and functions a reader draws, the ways in that reach them, and the calls and ' +
            'payloads whose code is typed.</p></section>'
          : '';
      }
      const says = FACE_SAYS[face.face];
      const none = new Set();
      const label = (param) => param.label === ''
        ? ''
        : (param.flag === PARAM_FLAG.rest ? '...' : '') + param.label + (param.flag === PARAM_FLAG.optional ? '?' : '') +
          (param.flag === PARAM_FLAG.claimed ? CLAIMED_MARK : '');
      const rows = face.params.map((param, k) => shapeRowHtml(label(param) || '#' + (k + 1), param.ref, 'p' + k, none));
      const cast = face.params.some((param) => param.flag === PARAM_FLAG.claimed)
        ? `<p class="g-shape-note">A part marked${CLAIMED_MARK} is what a cast in the handler says it is; nothing checks it.</p>`
        : '';
      const openable = faceRows(face).some(({ ref }) => refParts(model, ref).some((part) => part.type >= 0));
      const tools = '<span class="g-shape-tools">' +
        (openable
          ? `<button class="tool" data-types="all" title="Open every type in this section, as deep as the bounds allow">Expand all</button>` +
            `<button class="tool" data-types="none"${state.openTypes.size ? '' : ' disabled'}>Collapse all</button>`
          : '') +
        '<button class="tool" data-types="copy" title="Copy what it takes and gives back as TypeScript, every type ' +
        'opened inline"><span>Copy as TypeScript</span></button></span>';
      return `<section><div class="g-shape-head"><h4>${says.title}</h4>${tools}</div>` +
        moreHtml('all') +
        (rows.length > 0 ? rows.join('') : (says.none ? `<p class="g-none">${says.none}</p>` : '')) +
        (face.returns >= 0 ? shapeRowHtml('→ ' + says.back, face.returns, 'r', none, true) : '') +
        (says.note ? `<p class="g-shape-note">${says.note}</p>` : '') +
        cast +
        '</section>';
    };

    const drawDetails = () => {
      card.hide();
      const v = state.open;
      stage.classList.toggle('is-closed', v === null);
      panel.hidden = v === null;
      if (v === null) return;
      const d = describe(model, v);
      const t = typeOf(v);
      const kind = kinds[nodes[v][KD]];
      const hue = hueOf(nodes[v][RP]);
      const meta = metaOf(v);
      const canExpand = state.hood.more.has(v) && !state.expanded.includes(v);
      const others = state.hood.others.get(v);
      const context = contextOf(v);
      const total = (groups) => groups.reduce((sum, group) => sum + group.edges.length, 0);
      const fileRows = state.openGroups.has('file') ? d.inFile : d.inFile.slice(0, FILE_LIMIT);

      panel.innerHTML =
        '<header>' +
          `<div class="g-head"><span><span class="glyph" style="--hue:${hue}">${esc(glyphOf(v))}</span> ` +
          `<span class="hint">${esc(t)}${kind ? ' &middot; ' + esc(kind) : ''}</span></span>` +
          '<button class="g-close" data-act="close" aria-label="Close details" title="Close (Escape)">&times;</button></div>' +
          `<h3 id="g-details-title">${esc(nodes[v][LB])}</h3>` +
          `<div><span class="tag" style="color:${hue};border-color:${hue}">${esc(repoName(v))}</span> ` +
          opener(nodes[v][RP], nodes[v][FL], nodes[v][LN], placeOf(v)) + '</div>' +
          badgesHtml(v) +
        '</header>' +
        '<div class="g-actions">' +
          `<button class="tool" data-act="centre"${v === state.focus && state.query === null ? ' disabled' : ''}>Centre here</button>` +
          `<button class="tool" data-act="expand"${canExpand ? '' : ' disabled'} title="More of the flow, the way it ` +
          `looks from the focus (+)">${LOOK_SAYS[lookOf(v).flow].expand}</button>` +
          (others
            ? `<button class="tool" data-act="also" aria-pressed="${others.shown}" title="${ALSO_SAYS[others.look].count(others.count)}, ` +
              `not in the flow, drawn faded as context (O)">${ALSO_SAYS[others.look].ask} &middot; ${others.count.toLocaleString()}</button>`
            : '') +
          (DOORS.has(t) ? '<button class="tool" data-act="walk">Open in Walk</button>' : '') +
        '</div>' +
        (context
          ? `<p class="hint">Not in the flow: drawn as context, it ${esc(ALSO_SAYS[context.look].mark(context.of))}. ` +
            '<i>Centre here</i> to follow it.</p>'
          : '') +
        checkActionsHtml(v) +
        (meta.length > 0
          ? '<dl class="g-meta">' + meta.map(([key, value]) => `<dt>${esc(key)}</dt><dd>${esc(value)}</dd>`).join('') + '</dl>'
          : '') +
        shapeHtml(v) +
        `<section><h4>In &middot; ${total(d.into)}</h4>` +
          (d.into.length ? d.into.map((group) => edgeGroup('in', group, 0)).join('') : '<p class="g-none">Nothing reaches it.</p>') +
        '</section>' +
        `<section><h4>Out &middot; ${total(d.out)}</h4>` +
          (d.out.length ? d.out.map((group) => edgeGroup('out', group, 1)).join('') : '<p class="g-none">It reaches nothing.</p>') +
        '</section>' +
        `<section><h4>Problems &middot; ${d.rows.length + d.atLine.length}</h4>` +
          (d.rows.length ? `<div class="g-group-name">Name this node &middot; ${d.rows.length}</div>` + d.rows.map(rowHtml).join('') : '') +
          (d.atLine.length
            ? `<div class="g-group-name" style="margin-top:8px">At its line, naming no node &middot; ${d.atLine.length}</div>` +
              d.atLine.map(rowHtml).join('')
            : '') +
          (d.rows.length + d.atLine.length === 0 ? '<p class="g-none">No row names this node or sits at its line.</p>' : '') +
          (d.inFile.length
            ? `<div class="g-group-name" style="margin-top:8px">Elsewhere in its file &middot; ${d.inFile.length}</div>` +
              fileRows.map(rowHtml).join('') +
              (fileRows.length < d.inFile.length
                ? `<button class="g-more-btn" data-group="file">Show ${(d.inFile.length - fileRows.length).toLocaleString()} more</button>`
                : '')
            : '') +
        '</section>';
      panel.setAttribute('aria-labelledby', 'g-details-title');
    };

    /* ── checking: problems, a path between two nodes, impact ── */

    /* Every answer is a set of nodes graph.js shapes like a neighbourhood, so
       the drawing draws it unchanged. The page keeps which question is asked
       in `state.query`; `asked` turns that into the hood the drawing reads,
       and `drawAnswer` says what the answer was and what was searched. */

    const answerEl = document.getElementById('g-answer');
    const problemsBtn = document.getElementById('g-problems');
    const onlyBox = document.getElementById('g-only');
    const onlyNote = document.getElementById('g-only-note');
    const endBtns = { from: document.getElementById('g-from'), to: document.getElementById('g-to') };
    const wayBtn = document.getElementById('g-way');
    const pathDepthSel = document.getElementById('g-path-depth');
    const clearBtn = document.getElementById('g-clear');
    const searchEl = document.getElementById('g-search');
    const searchPrompt = searchEl.placeholder;
    const ANSWER_LIMIT = 60;

    /* A `file:line` that opens in the editor `--editor-links` named, or plain text. */
    const editor = data.editor || null;
    const opener = (repo, file, line, text) => {
      const url = editor === null || repo < 0 || file < 0
        ? null
        : editorUrl(editor.name, editor.roots[repo], files[file], line);
      return url === null
        ? `<span class="g-place">${esc(text)}</span>`
        : `<a class="g-place" href="${esc(url)}" title="Open in ${esc(editor.name)}">${esc(text)}</a>`;
    };

    /* The same badges the drawing pins on the node, said in words. */
    const badgesHtml = (v) => {
      const list = badgesFor(v);
      if (list.length === 0) return '';
      return '<div class="g-badges">' + list.map((badge) => {
        const say = (BADGE[badge.kind] || { say: (n) => n.toLocaleString() }).say;
        return `<span class="tag is-${badge.tone}" title="${esc(badge.title || '')}">${say(badge.count)}</span>`;
      }).join('') + '</div>';
    };

    const checkActionsHtml = (v) => {
      const impactOn = state.query !== null && state.query.kind === 'impact' && state.query.target === v;
      const end = (name, text, title) =>
        `<button class="tool" data-check="${name}" aria-pressed="${state.ends[name] === v}" title="${title}">${text}</button>`;
      return '<div class="g-actions">' +
        end('from', 'Path from here', 'Find the shortest path that starts here') +
        end('to', 'Path to here', 'Find the shortest path that ends here') +
        `<button class="tool" data-check="impact"${impactOn ? ' disabled' : ''} ` +
        'title="Everything upstream of this node, to the ways in, as flowatlas impact walks it">Impact</button>' +
        '</div>';
    };

    /* What is drawn: the neighbourhood, cut to its problems when asked, or
       the answer to the question asked. Every one folds plumbing into chips
       the same way; only the neighbourhood groups, since an answer is every
       node on it. */
    const asked = () => {
      const query = state.query;
      const fold = { draw: state.plumbing, unfolded: state.unfolded };
      if (query === null) {
        const hood = neighbourhood(model, {
          focus: state.focus,
          hops: state.hops,
          cap: state.cap,
          filter: filterNow(),
          expanded: state.expanded,
          also: state.also,
          fold,
          group: true,
          opened: state.opened,
        });
        return state.problemsOnly ? onlyProblems(model, hood, problems.has) : hood;
      }
      if (query.kind === 'path') {
        const filter = filterNow();
        return shortestPath(model, {
          from: state.ends.from,
          to: state.ends.to,
          directed: state.directed,
          depth: state.pathDepth,
          cap: state.cap,
          filter,
          fold: { ...fold, filter },
        });
      }
      return impactView(model, query.found, { cap: state.cap, expanded: state.expanded, fold });
    };

    /* Asking goes to the answer's focus the ordinary way, so Back returns to
       the neighbourhood before it, and draws the answer there. */
    const ask = (query, focus) => {
      state.answer = 'query';
      go(focus, true, query);
    };
    const askPath = () => ask({ kind: 'path' }, state.ends.from);
    const askImpact = (v) => ask({ kind: 'impact', target: v, found: upstream(model, v) }, v);

    const stopPicking = () => {
      state.picking = null;
      paintChecks();
    };

    /* What Escape closes after the panel: the problems list over an answer,
       then the half-chosen path, then the answer itself. True when it closed
       something. */
    const dismissAnswer = () => {
      if (state.answer === 'problems') {
        state.answer = state.query === null ? null : 'query';
        drawAnswer();
        return true;
      }
      if (state.query === null && state.answer === 'ends') {
        state.ends = { from: null, to: null };
        state.answer = null;
        drawAnswer();
        drawDetails();
        return true;
      }
      if (state.query !== null) {
        clearQuery();
        return true;
      }
      return false;
    };

    const chooseEnd = (v, end = state.picking) => {
      state.ends[end] = v;
      state.picking = null;
      if (state.ends.from !== null && state.ends.to !== null) askPath();
      else {
        state.answer = 'ends';
        drawAnswer();
        drawDetails();
      }
    };

    const filtersSaid = () => {
      const hiddenServices = repos.filter((name) => !shown.has(name)).length;
      const off = [
        hiddenServices && plural(hiddenServices, 'service', 'services'),
        state.hiddenEdgeTypes.size && plural(state.hiddenEdgeTypes.size, 'edge type', 'edge types'),
        state.hiddenConfidences.size && plural(state.hiddenConfidences.size, 'kind of trust', 'kinds of trust'),
      ].filter(Boolean);
      return off.length === 0 ? 'with no filters on' : 'with ' + off.join(', ') + ' hidden by the filters';
    };

    const nameOf = (v) => `<b>${esc(nodes[v][LB])}</b>`;
    const pickable = (v, note, text) =>
      `<li><button class="g-far" data-pick="${v}" style="--hue:${hueOf(nodes[v][RP])}" ` +
      `title="${esc(nodes[v][LB])}${placeOf(v) ? ', ' + esc(placeOf(v)) : ''}">` +
      `<span class="label">${esc(text || nodes[v][LB])}</span><small>${esc(note)}</small></button>${graphLink(v)}</li>`;
    const listHtml = (key, title, items, empty) => {
      const open = state.answerOpen.has(key);
      const shownItems = open ? items : items.slice(0, ANSWER_LIMIT);
      return `<h4>${title} &middot; ${items.length.toLocaleString()}</h4>` +
        (items.length === 0 ? `<p class="g-none">${empty}</p>` : `<ul>${shownItems.join('')}</ul>`) +
        (shownItems.length < items.length
          ? `<button class="g-more-btn" data-list="${key}">Show ${(items.length - shownItems.length).toLocaleString()} more</button>`
          : '');
    };
    const reasonsAt = (v) => {
      const found = problems.of(v);
      return problems.reasonsOf([...found.on, ...found.atLine]).join(', ');
    };

    const problemsHtml = () => {
      const { waysIn, crossings, calls } = problems.list();
      const ways = waysIn.map((item) => pickable(item.node,
        [repoName(item.node), item.unhandled ? 'no handler read' : '', reasonsAt(item.node)].filter(Boolean).join(' · ')));
      const crossed = crossings.map((item) => {
        const e = data.edges[item.edge];
        const v = problems.has(e[1]) ? e[1] : e[0];
        return pickable(v, `${repoName(e[0])} → ${repoName(e[1])} · ${edgeTypes[e[2]]}, ${confidences[e[3]]} · ` +
          `${[reasonsAt(e[0]), reasonsAt(e[1])].filter(Boolean).join(', ')}`, `${nodes[e[0]][LB]} → ${nodes[e[1]][LB]}`);
      });
      const unjoined = calls.map((item) => pickable(item.node,
        [repoName(item.node), item.unjoined ? 'joined nothing' : '', reasonsAt(item.node)].filter(Boolean).join(' · ')));
      return '<p>Where to look first. A problem is a row of <b>Not joined</b> that names a node or sits at its ' +
        'line; a node carrying one is badged with the count.</p>' +
        listHtml('ways', 'Ways in with problems', ways, 'Every way in has a handler that was read, and no row.') +
        listHtml('crossings', 'Crossings with problems', crossed, 'No crossing has a row at either end.') +
        listHtml('calls', 'Calls that did not join, or carry rows', unjoined, 'Every call joined, and none carries a row.');
    };

    const pathHtml = (hood) => {
      const way = state.directed ? 'along edges the way the calls run' : 'along edges either way';
      const ends = `from ${nameOf(hood.from)} to ${nameOf(hood.to)}`;
      if (!hood.found) {
        const tries = [state.directed && 'either way', hood.depth < 24 && 'a longer search', filterNow().active && 'fewer filters']
          .filter(Boolean);
        return `<p><b>No path</b> ${ends} within ${plural(hood.depth, 'step', 'steps')} ${way}, ${filtersSaid()}.</p>` +
          `<p>Searched the ${plural(hood.searched, 'node', 'nodes')} ${nameOf(hood.from)} reaches that way.` +
          (tries.length ? ' Try ' + tries.join(', or ') + '.' : '') + '</p>';
      }
      return `<p><b>${plural(hood.paths, 'shortest path', 'shortest paths')}</b> of ${plural(hood.length, 'step', 'steps')} ` +
        `${ends}, ${way}, ${filtersSaid()}.` +
        (hood.left > 0 ? ` ${plural(hood.left, 'node', 'nodes')} on them not drawn: the cap is ${state.cap}; one whole path is drawn first.` : '') +
        '</p>';
    };

    const impactHtml = (hood) => {
      const found = state.query.found;
      const entries = found.entries.map((v) => pickable(v,
        `${repoName(v)} · ${kinds[nodes[v][KD]] || typeOf(v)} · ${plural(found.dist.get(v), 'hop', 'hops')} back`));
      const screens = found.doors.filter((v) => typeOf(v) !== 'entry').map((v) => pickable(v,
        `${repoName(v)} · ${kinds[nodes[v][KD]] || typeOf(v)} · ${plural(found.dist.get(v), 'hop', 'hops')} back`));
      const stops = found.withoutEntry.map((s) => esc(repos[s]));
      if (found.reached === 0) {
        return `<p><b>Nothing reaches</b> ${nameOf(found.target)} along the edges <code>flowatlas impact</code> walks ` +
          'back, so a change to it is seen only from it.</p>';
      }
      return `<p><b>${plural(found.reached, 'node reaches', 'nodes reach')}</b> ${nameOf(found.target)} within ` +
        `${plural(found.depth, 'hop', 'hops')} back, walked as <code>flowatlas impact</code> walks it, so no filter applies.` +
        (hood.left > 0 ? ` ${plural(hood.left, 'node', 'nodes')} not drawn: the cap is ${state.cap}; every way in is drawn first, with one chain down from it.` : '') +
        '</p>' +
        (stops.length ? `<p>Also reaches ${stops.join(', ')}, where the chain stops before an entry point.</p>` : '') +
        listHtml('entries', 'Entry points', entries, 'Nothing that reaches it is an entry point.') +
        (screens.length ? listHtml('screens', 'Screen actions', screens, '') : '');
    };

    const endsHtml = () => {
      const set = state.ends.from !== null ? 'from' : 'to';
      const other = set === 'from' ? 'to' : 'from';
      return `<p>Path ${set} ${nameOf(state.ends[set])}. Now choose where it ${other === 'to' ? 'ends' : 'starts'}: ` +
        `<b>Path ${other} here</b> on another node, or <b>${other}: pick&hellip;</b> above and search.</p>`;
    };

    const paintChecks = () => {
      const { waysIn, crossings, calls } = problems.list();
      problemsBtn.textContent = `Problems · ${(waysIn.length + crossings.length + calls.length).toLocaleString()}`;
      problemsBtn.setAttribute('aria-expanded', String(state.answer === 'problems'));
      for (const [end, button] of Object.entries(endBtns)) {
        const v = state.ends[end];
        button.textContent = `${end}: ` + (v === null ? 'pick…' : middle(nodes[v][LB], 30));
        button.title = v === null ? `Pick where the path ${end === 'from' ? 'starts' : 'ends'}` : nodes[v][LB];
        button.classList.toggle('is-picking', state.picking === end);
      }
      wayBtn.innerHTML = state.directed ? '&rarr; one way' : '&harr; either way';
      wayBtn.setAttribute('aria-pressed', String(!state.directed));
      pathDepthSel.value = String(state.pathDepth);
      clearBtn.hidden = state.query === null;
      onlyBox.checked = state.problemsOnly;
      onlyBox.disabled = state.query !== null;
      onlyNote.textContent = state.problemsOnly && state.query === null && state.hood && state.hood.clean
        ? plural(state.hood.clean, 'node', 'nodes') + ' without problems hidden'
        : '';
      searchEl.placeholder = state.picking === null ? searchPrompt
        : `Pick where the path ${state.picking === 'from' ? 'starts' : 'ends'} (Escape to stop)`;
    };

    /* The answer box and, while a question is asked, the line under the
       drawing. True when it wrote that line. */
    function drawAnswer() {
      paintChecks();
      const query = state.query;
      const showing = state.answer === 'query' ? (query === null ? null : query.kind)
        : state.answer === 'ends' ? (query === null && (state.ends.from === null) !== (state.ends.to === null) ? 'ends' : null)
        : state.answer;
      answerEl.hidden = showing === null;
      answerEl.classList.toggle('is-none', showing === 'path' && !state.hood.found);
      if (showing === 'problems') answerEl.innerHTML = problemsHtml();
      else if (showing === 'path') answerEl.innerHTML = pathHtml(state.hood);
      else if (showing === 'impact') answerEl.innerHTML = impactHtml(state.hood);
      else if (showing === 'ends') answerEl.innerHTML = endsHtml();
      if (query === null || state.hood === null) return false;

      const hood = state.hood;
      const drawn = `<b>${plural(hood.nodes.length, 'node', 'nodes')}</b> drawn`;
      statusEl.className = 'g-status' + (hood.left > 0 ? ' is-cut' : '');
      statusEl.innerHTML = query.kind === 'path'
        ? (hood.found
          ? `${drawn} on the shortest ${hood.paths === 1 ? 'path' : 'paths'} from ${nameOf(hood.from)} to ${nameOf(hood.to)}.`
          : `<b>No path</b> from ${nameOf(hood.from)} to ${nameOf(hood.to)} within ${plural(hood.depth, 'step', 'steps')}.`)
        : `${drawn} upstream of ${nameOf(query.target)}, of ${plural(query.found.reached, 'node', 'nodes')} that reach it.`;
      if (hood.left > 0) statusEl.innerHTML += ` <b>${hood.left.toLocaleString()} more</b> not drawn: the cap is ${state.cap}.`;
      return true;
    }

    problemsBtn.addEventListener('click', () => {
      state.answer = state.answer === 'problems' ? (state.query === null ? null : 'query') : 'problems';
      drawAnswer();
    });
    onlyBox.addEventListener('change', () => { state.problemsOnly = onlyBox.checked; draw(false); });
    for (const [end, button] of Object.entries(endBtns)) {
      button.addEventListener('click', () => {
        state.picking = state.picking === end ? null : end;
        paintChecks();
        if (state.picking !== null) searchEl.focus();
      });
    }
    wayBtn.addEventListener('click', () => {
      state.directed = !state.directed;
      if (state.query !== null && state.query.kind === 'path') draw(true);
      else paintChecks();
    });
    pathDepthSel.addEventListener('change', () => {
      state.pathDepth = Number(pathDepthSel.value);
      if (state.query !== null && state.query.kind === 'path') draw(true);
    });
    function clearQuery() {
      state.query = null;
      state.answer = null;
      state.expanded = [];
      state.also = [];
      draw(true);
      syncControls();
    }
    clearBtn.addEventListener('click', clearQuery);
    answerEl.addEventListener('click', (event) => {
      const more = event.target.closest('[data-list]');
      if (more) { state.answerOpen.add(more.dataset.list); drawAnswer(); return; }
      const named = event.target.closest('[data-pick]');
      if (!named) return;
      const v = Number(named.dataset.pick);
      if (state.hood.layer.has(v)) { select(v, false); camera.reveal(at(v)); } else go(v);
    });
    panel.addEventListener('click', (event) => {
      const target = event.target.closest('button[data-check]');
      if (!target || state.open === null) return;
      if (target.dataset.check === 'impact') askImpact(state.open);
      else chooseEnd(state.open, target.dataset.check);
    });

    /* ── state changes: every control ends in one of these ── */

    /* The view in the address: the focus, the hops and what was expanded, each
       node by its key, so the link opens the same view after a rebuild; then
       the question asked of it, and what the filters hide, by name. */
    const askNow = () => {
      const query = state.query;
      if (query !== null && query.kind === 'impact') return { kind: 'impact' };
      if (query !== null && query.kind === 'path') {
        return { kind: 'path', to: state.ends.to, depth: state.pathDepth, directed: state.directed };
      }
      return state.problemsOnly ? { kind: 'only' } : null;
    };
    const hiddenNow = () => ({
      services: repos.filter((name) => !shown.has(name)),
      edgeTypes: [...state.hiddenEdgeTypes].map((i) => edgeTypes[i]),
      confidences: [...state.hiddenConfidences].map((i) => confidences[i]),
    });
    const hashNow = () => formatHash(keys, state.focus, state.hops, state.expanded, {
      ask: askNow(),
      hidden: hiddenNow(),
      also: state.also,
    });
    const writeHash = () => {
      if (view !== 'graph') return;
      history.replaceState(null, '', hashNow());
      notice.moved();
    };

    const syncControls = () => {
      backBtn.disabled = !trail.canBack();
      forwardBtn.disabled = !trail.canForward();
      writeHash();
      titleEl.textContent = nodes[state.focus][LB];
    };

    const draw = (frame) => {
      state.hood = asked();
      state.placed = layout(model, state.hood, {
        column: BOX.column, row: BOX.row, laneGap: BOX.laneGap, laneHead: BOX.laneHead,
      });
      if (state.open !== null && !state.hood.layer.has(state.open)) state.open = null;
      if (!state.hood.layer.has(state.cursor)) state.cursor = state.focus;
      drawDrawing();
      drawStatus();
      drawDetails();
      if (frame) camera.frame(state.placed, at(state.focus), false);
      writeHash();
    };

    const select = (v, moveFocus) => {
      state.cursor = v;
      if (state.open !== v) { state.openGroups.clear(); state.openTypes.clear(); state.typeMore.clear(); }
      state.open = v;
      paintSelection(moveFocus);
      drawDetails();
    };

    /* The details for a node with the types its card showed - or only the
       one asked for - opened one level, so nothing seen on the card is lost. */
    const openWithCard = (v, only, moveFocus) => {
      const shown = only !== null ? [only] : cardSeen.v === v ? cardSeen.types : [];
      select(v, moveFocus);
      const keys = panelKeysOf(model, v, shown);
      if (keys.length === 0) return;
      for (const key of keys) state.openTypes.add(key);
      drawDetails();
      const [first] = keys;
      const at = first.slice(0, first.lastIndexOf(':'));
      const type = first.slice(first.lastIndexOf(':') + 1);
      const opened = panel.querySelector(`button.g-type[data-at="${CSS.escape(at)}"][data-type="${type}"]`);
      if (opened) opened.scrollIntoView({ block: 'nearest' });
    };

    /* A click on the card shows, there on it, what it cut; or goes on to the
       details, with what it showed open. */
    card.el.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      const asked = card.showing();
      if (button === null || asked === null) return;
      const wide = wideFor(asked);
      const { cardRows, cardLines, cardTypes, cardOpen } = button.dataset;
      if (cardRows !== undefined) wide.rows = [...wide.rows, Number(cardRows)];
      else if (cardLines !== undefined) wide.lines = true;
      else if (cardTypes !== undefined) wide.types = true;
      else {
        if (!asked.startsWith('node:')) return;
        card.hide();
        openWithCard(Number(asked.slice('node:'.length)), cardOpen !== undefined ? Number(cardOpen) : null, false);
        return;
      }
      card.refresh();
    });

    const go = (v, record = true, query = null) => {
      if (record) trail.visit(v);
      state.query = query;
      state.focus = v;
      state.cursor = v;
      state.open = v;
      state.expanded = [];
      state.also = [];
      state.openGroups.clear();
      state.openTypes.clear();
      state.typeMore.clear();
      state.unfolded = new Set();
      state.opened = new Set();
      draw(true);
      syncControls();
    };

    /* A group opens in place into what it holds; a chip draws, or folds back,
       the plumbing in front of its node. */
    const openGroup = (id) => {
      state.opened.add(id);
      state.cursor = state.hood.parent.get(id) ?? state.focus;
      draw(false);
    };
    const toggleChain = (v) => {
      if (state.unfolded.has(v)) state.unfolded.delete(v); else state.unfolded.add(v);
      state.cursor = v;
      draw(false);
    };

    const expand = (v) => {
      if (!state.expanded.includes(v)) state.expanded.push(v);
      state.cursor = v;
      state.open = v;
      draw(false);
      writeHash();
    };

    /* Who else uses a node, drawn as context or put away again. */
    const toggleAlso = (v) => {
      if (!state.hood.others.has(v)) return;
      state.also = state.also.includes(v) ? state.also.filter((u) => u !== v) : [...state.also, v];
      state.cursor = v;
      state.open = v;
      draw(false);
    };

    const closeDetails = () => {
      state.open = null;
      paintSelection(panel.contains(document.activeElement));
      drawDetails();
    };

    /* ── controls ── */

    backBtn.addEventListener('click', () => go(trail.back(), false));
    forwardBtn.addEventListener('click', () => go(trail.forward(), false));
    hopsSel.addEventListener('change', () => { state.hops = Number(hopsSel.value); draw(true); syncControls(); });
    gCapSel.addEventListener('change', () => { state.cap = Number(gCapSel.value); draw(true); });
    document.getElementById('g-zoom-in').addEventListener('click', () => camera.zoom(1.25));
    document.getElementById('g-zoom-out').addEventListener('click', () => camera.zoom(0.8));
    document.getElementById('g-fit').addEventListener('click', () => camera.frame(state.placed, at(state.focus), true));

    /* Filters: services on the rail above, edge types and trust here. */
    const filterBar = document.getElementById('g-filters');
    const filterChips = [];
    const chips = (title, names, hidden) => {
      const label = document.createElement('span');
      label.className = 'hint';
      label.textContent = title;
      filterBar.append(label);
      names.forEach((name, i) => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = name;
        chip.setAttribute('aria-pressed', 'true');
        chip.addEventListener('click', () => {
          if (hidden.has(i)) hidden.delete(i); else hidden.add(i);
          chip.setAttribute('aria-pressed', String(!hidden.has(i)));
          draw(false);
        });
        filterChips.push({ chip, hidden, i });
        filterBar.append(chip);
      });
    };
    chips('edges', edgeTypes, state.hiddenEdgeTypes);
    chips('trust', confidences, state.hiddenConfidences);
    {
      // Plumbing is folded into a chip on what it wraps unless asked for.
      const label = document.createElement('span');
      label.className = 'hint';
      label.textContent = 'plumbing';
      const toggle = document.createElement('button');
      toggle.className = 'chip';
      toggle.textContent = 'drawn as nodes';
      toggle.title = 'Guards, interceptors, pipes and middleware: folded into a chip on what they wrap, ' +
        'or drawn as nodes of their own';
      toggle.setAttribute('aria-pressed', String(state.plumbing));
      toggle.addEventListener('click', () => {
        state.plumbing = !state.plumbing;
        state.unfolded.clear();
        toggle.setAttribute('aria-pressed', String(state.plumbing));
        draw(false);
      });
      filterBar.append(label, toggle);
    }
    filterBar.insertAdjacentHTML('beforeend', '<span class="hint">services: the rail above</span>');

    /* Pointer: one finger or a mouse drags to pan; two fingers pan and pinch to
       zoom; a wheel or a trackpad pans, and a trackpad pinch or ctrl+wheel zooms.
       Every pointer down is kept by id, in the canvas's own pixels, so a second
       finger joining or one lifting picks up where the gesture is. */
    const fingers = new Map();
    let dragged = false;
    const local = (event) => {
      const box = wrap.getBoundingClientRect();
      return { x: event.clientX - box.left, y: event.clientY - box.top };
    };
    let anchor = null;
    wrap.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || event.target.closest('.g-zoom, .g-notice, .g-mini')) return;
      // A mouse or a pen is one pointer: one let go outside the canvas never
      // said so, and must not turn the next drag into a pinch.
      if (event.pointerType !== 'touch') fingers.clear();
      fingers.set(event.pointerId, local(event));
      if (fingers.size === 1) { anchor = local(event); dragged = false; }
      else {
        // A second finger is a pinch, never a click on whatever it landed on.
        dragged = true;
        wrap.classList.add('is-panning');
      }
    });
    wrap.addEventListener('pointermove', (event) => {
      if (!fingers.has(event.pointerId)) return;
      const here = local(event);
      if (fingers.size >= 2) {
        const before = [...fingers.values()].slice(0, 2);
        fingers.set(event.pointerId, here);
        const after = [...fingers.values()].slice(0, 2);
        const move = pinch(before, after);
        camera.pan(move.dx, move.dy);
        camera.zoomAt(move.at.x, move.at.y, move.factor);
        return;
      }
      fingers.set(event.pointerId, here);
      const dx = here.x - anchor.x, dy = here.y - anchor.y;
      if (!dragged && Math.hypot(dx, dy) < 4) return;
      if (!dragged) {
        dragged = true;
        wrap.setPointerCapture(event.pointerId);
        wrap.classList.add('is-panning');
      }
      camera.pan(dx, dy);
      anchor = here;
    });
    const lift = (event) => {
      fingers.delete(event.pointerId);
      // The finger left behind carries on panning from where it is now.
      if (fingers.size === 1) anchor = [...fingers.values()][0];
      if (fingers.size === 0) wrap.classList.remove('is-panning');
    };
    wrap.addEventListener('pointerup', lift);
    wrap.addEventListener('pointercancel', lift);
    wrap.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (event.ctrlKey || event.metaKey) {
        const box = wrap.getBoundingClientRect();
        camera.zoomAt(event.clientX - box.left, event.clientY - box.top, Math.exp(-event.deltaY * 0.004));
      } else camera.pan(-event.deltaX, -event.deltaY);
    }, { passive: false });

    svg.addEventListener('click', (event) => {
      if (dragged) { dragged = false; return; }
      const chip = event.target.closest('.g-chip');
      if (chip) { toggleChain(Number(chip.dataset.chip)); return; }
      const badge = event.target.closest('.g-more');
      if (badge) { expand(Number(badge.dataset.more)); return; }
      const also = event.target.closest('.g-also');
      if (also) { toggleAlso(Number(also.dataset.also)); return; }
      const node = event.target.closest('.g-node');
      if (node && node.dataset.group !== undefined) openGroup(node.dataset.group);
      else if (node) {
        const v = Number(node.dataset.node);
        if (pressedCard === 'node:' + v) openWithCard(v, null, false);
        else select(v, false);
      }
    });
    svg.addEventListener('dblclick', (event) => {
      const node = event.target.closest('.g-node');
      if (node && node.dataset.node !== undefined && !event.target.closest('.g-more, .g-also, .g-chip')) {
        go(Number(node.dataset.node));
      }
    });

    /* The trace follows the pointer, and the keys; so does the card. */
    svg.addEventListener('pointerover', (event) => {
      // Not while panning or pinching: the pointer is moving the drawing.
      if (fingers.size > 0 && dragged) return;
      const node = event.target.closest('.g-node');
      traceTo(node ? unitOf(node) : null);
      const pointed = event.pointerType === 'touch' ? null : cardNode(event);
      if (pointed === null) card.soon();
      else {
        const v = unitOf(pointed);
        card.later(pointed, 'node:' + v, () => nodeCardHtml(v), 'side');
      }
    });
    // Off the drawing may be onto the card, which holds itself while the pointer is on it.
    svg.addEventListener('pointerleave', () => { traceTo(null); card.soon(); });
    /* A press hides the card, and remembers what it was on: a click on the
       node it described opens the details with what it showed. */
    let pressedCard = null;
    svg.addEventListener('pointerdown', () => { pressedCard = card.showing(); card.hide(); });
    svg.addEventListener('focusin', (event) => {
      const node = event.target.closest('.g-node');
      if (node) traceTo(unitOf(node));
      // A node the keys moved onto, not one a click focused on its way.
      if (node && node.dataset.node !== undefined && visibleFocus(node)) {
        const v = unitOf(node);
        card.now(node, 'node:' + v, () => nodeCardHtml(v), 'side');
      }
    });
    svg.addEventListener('focusout', (event) => {
      traceTo(null);
      if (!card.holds(event.relatedTarget)) card.hide();
    });
    // A drawing that moves leaves the card pointing at where a node was.
    camera.watch(() => card.hide());
    statusEl.addEventListener('click', (event) => {
      if (!event.target.closest('[data-again]')) return;
      state.opened.clear();
      draw(false);
    });

    const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    svg.addEventListener('keydown', (event) => {
      const node = event.target.closest('.g-node');
      if (!node) return;
      const v = unitOf(node);
      if (KEYS[event.key]) {
        event.preventDefault();
        state.cursor = step(state.placed, v, KEYS[event.key]);
        // Into view first, so the card the focus brings is placed where the node ends up.
        camera.reveal(at(state.cursor));
        paintSelection(true);
      } else if (isGroup(v) && (event.key === 'Enter' || event.key === ' ' || event.key === '+')) {
        event.preventDefault();
        openGroup(v);
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (card.showing() === 'node:' + v) openWithCard(v, null, true);
        else select(v, true);
      } else if ((event.key === 'w' || event.key === 'W') && state.hood.chips.has(v)) {
        event.preventDefault();
        toggleChain(v);
      } else if (event.key === '+') {
        event.preventDefault();
        expand(v);
      } else if ((event.key === 'o' || event.key === 'O') && !isGroup(v) && state.hood.others.has(v)) {
        event.preventDefault();
        toggleAlso(v);
      } else if (event.key === 'Escape' && state.open !== null) {
        event.preventDefault();
        closeDetails();
      }
    });

    panel.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target) return;
      const v = state.open;
      if (target.dataset.go !== undefined) go(Number(target.dataset.go));
      else if (target.dataset.type !== undefined) toggleType(target.dataset.at + ':' + target.dataset.type);
      else if (target.dataset.all !== undefined) {
        openEverything([{ at: target.dataset.all, ref: Number(target.dataset.ref) }], target.dataset.all,
          `button.g-type-all[data-all="${CSS.escape(target.dataset.all)}"]`);
      } else if (target.dataset.more !== undefined) {
        const more = state.typeMore.get(target.dataset.more);
        if (more) openEverything(more.roots, target.dataset.more, `button[data-more="${CSS.escape(target.dataset.more)}"]`);
      } else if (target.dataset.types === 'all') {
        openEverything(faceRows(faceOf(model, v)), 'all', 'button[data-types="all"]');
      } else if (target.dataset.types === 'none') {
        state.openTypes.clear();
        state.typeMore.clear();
        drawDetails();
        refocus('button[data-types="all"]');
      } else if (target.dataset.types === 'copy') copyTypes(v, target);
      else if (target.dataset.group !== undefined) { state.openGroups.add(target.dataset.group); drawDetails(); }
      else if (target.dataset.act === 'close') closeDetails();
      else if (target.dataset.act === 'centre') go(v);
      else if (target.dataset.act === 'expand') expand(v);
      else if (target.dataset.act === 'also') toggleAlso(v);
      else if (target.dataset.act === 'walk') { current = v; drawEntries(); showView('walk'); }
    });
    panel.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.preventDefault(); closeDetails(); return; }
      // `E` (or `*`, as a tree has it) on a type opens everything under it.
      const type = event.target.closest && event.target.closest('button.g-type');
      if (type && (event.key === 'e' || event.key === 'E' || event.key === '*') &&
          !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        const { at, ref } = type.dataset;
        openEverything([{ at, ref: Number(ref), only: Number(type.dataset.type) }], at,
          `button.g-type[data-at="${CSS.escape(at)}"][data-type="${type.dataset.type}"]`);
      }
    });

    /* A type in the details peeks on hover, or on the keys: one level of it,
       without opening it. */
    const panelType = (event) => (event.target.closest && event.target.closest('button.g-type')) || null;
    const peekType = (type, now) => {
      const asked = 'type:' + type.dataset.at + ':' + type.dataset.type;
      const build = () => typeCardHtml(Number(type.dataset.type), asked);
      if (now) card.now(type, asked, build, 'below');
      else card.later(type, asked, build, 'below');
    };
    panel.addEventListener('pointerover', (event) => {
      const type = event.pointerType === 'touch' ? null : panelType(event);
      if (type === null) card.soon();
      else peekType(type, false);
    });
    panel.addEventListener('pointerleave', () => card.soon());
    panel.addEventListener('focusin', (event) => {
      const type = panelType(event);
      if (type !== null && visibleFocus(type)) peekType(type, true);
    });
    panel.addEventListener('focusout', (event) => { if (!card.holds(event.relatedTarget)) card.hide(); });

    /* ── search over every node, as a combobox ── */

    const findInput = document.getElementById('g-search');
    const resultsEl = document.getElementById('g-results');
    let hits = [];
    let active = -1;

    const closeResults = () => {
      resultsEl.hidden = true;
      findInput.setAttribute('aria-expanded', 'false');
      findInput.removeAttribute('aria-activedescendant');
      active = -1;
    };

    const markActive = () => {
      resultsEl.querySelectorAll('.g-hit').forEach((el, n) => el.setAttribute('aria-selected', String(n === active)));
      if (active >= 0) {
        const el = document.getElementById('g-hit-' + active);
        findInput.setAttribute('aria-activedescendant', el.id);
        el.scrollIntoView({ block: 'nearest' });
      } else findInput.removeAttribute('aria-activedescendant');
    };

    const drawResults = () => {
      if (findInput.value.trim() === '') { closeResults(); return; }
      const found = search(model, findInput.value, 40);
      hits = found.hits;
      active = hits.length > 0 ? 0 : -1;
      resultsEl.innerHTML = hits.map((i, n) =>
        `<li id="g-hit-${n}" role="option" class="g-hit" data-hit="${i}" aria-selected="false" ` +
        `style="--hue:${hueOf(nodes[i][RP])}">` +
        `<span class="row-name"><span class="glyph">${esc(glyphOf(i))}</span>${esc(nodes[i][LB])}</span>` +
        `<span class="row-meta">${esc(repoName(i))} &middot; ${esc(kinds[nodes[i][KD]] || typeOf(i))}` +
        (placeOf(i) ? ' &middot; ' + esc(placeOf(i)) : '') + '</span></li>').join('') +
        (found.total > hits.length
          ? `<li role="presentation"><div class="cut">${(found.total - hits.length).toLocaleString()} more. Keep typing to narrow.</div></li>`
          : '') +
        (found.total === 0 ? '<li role="presentation"><div class="cut">Nothing matches every word.</div></li>' : '');
      resultsEl.hidden = false;
      findInput.setAttribute('aria-expanded', 'true');
      markActive();
    };

    const pick = (i) => {
      closeResults();
      findInput.value = '';
      if (state.picking !== null) chooseEnd(i);
      else go(i);
    };

    findInput.addEventListener('input', drawResults);
    findInput.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (resultsEl.hidden) { drawResults(); return; }
        if (hits.length === 0) return;
        active = (active + (event.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
        markActive();
      } else if (event.key === 'Enter') {
        if (active >= 0 && !resultsEl.hidden) { event.preventDefault(); pick(hits[active]); }
      } else if (event.key === 'Escape' && !resultsEl.hidden) {
        // Closing the list is all this Escape does; the panel and full screen stay.
        event.preventDefault();
        closeResults();
      } else if (event.key === 'Escape' && state.picking !== null) {
        // So is giving up picking a path's end, the search's other errand.
        event.preventDefault();
        stopPicking();
      }
    });
    findInput.addEventListener('blur', () => setTimeout(closeResults, 120));
    resultsEl.addEventListener('mousedown', (event) => event.preventDefault());
    resultsEl.addEventListener('click', (event) => {
      const hit = event.target.closest('.g-hit');
      if (hit) pick(Number(hit.dataset.hit));
    });

    const graph = {
      go,
      refresh: () => { if (state.focus !== null) draw(false); },
      /* Opening the tab: on what was asked for, else where it was, else the
         way in the walk is on. */
      show(asked) {
        if (asked !== undefined && asked !== null) go(asked);
        else if (state.focus === null) go(current ?? 0);
        else { draw(true); syncControls(); }
      },
      setHops(hops) { state.hops = hops; hopsSel.value = String(hops); },
      /* What a link says the filters hide, by name; a name this page does not
         have hides nothing. Drawn by whatever opens the view next. */
      setHidden(hidden) {
        const pick = (names, list) => new Set(names.map((name) => list.indexOf(name)).filter((i) => i >= 0));
        const services = new Set(hidden.services);
        shown.clear();
        for (const name of repos) if (!services.has(name)) shown.add(name);
        for (const b of fleet.querySelectorAll('.ship')) b.setAttribute('aria-pressed', String(shown.has(b.dataset.repo)));
        state.hiddenEdgeTypes.clear();
        for (const i of pick(hidden.edgeTypes, edgeTypes)) state.hiddenEdgeTypes.add(i);
        state.hiddenConfidences.clear();
        for (const i of pick(hidden.confidences, confidences)) state.hiddenConfidences.add(i);
        for (const { chip, hidden: set, i } of filterChips) chip.setAttribute('aria-pressed', String(!set.has(i)));
        drawEntries();
      },
      /* The question a link asks of the view on its focus. Says why when it
         cannot be asked here; true when it was. */
      ask(question, focus) {
        if (question.kind === 'only') {
          state.problemsOnly = true;
          draw(false);
          return true;
        }
        if (question.kind === 'impact') {
          askImpact(focus);
          return true;
        }
        if (question.to === null) return false;
        state.ends = { from: focus, to: question.to };
        state.directed = question.directed;
        state.pathDepth = PATH_DEPTHS.includes(question.depth) ? question.depth : 12;
        askPath();
        return true;
      },
    };

    /* ── the frame: full screen, the drawer, pictures, links ─────────── */

    /* What a person set for themselves - the panel's width, whether it is
       folded - kept in this browser only. The page is whole without it: a
       private window, or storage switched off, just starts from the defaults. */
    const remembered = {
      read(key, fallback) {
        try {
          const value = localStorage.getItem('flowatlas.graph.' + key);
          return value === null ? fallback : JSON.parse(value);
        } catch { return fallback; }
      },
      write(key, value) {
        try { localStorage.setItem('flowatlas.graph.' + key, JSON.stringify(value)); } catch { /* kept for this visit only */ }
      },
    };

    /* Types: a line under every node of what it takes and gives back. A way of
       reading, not a view, so it is remembered like the panel's width and not
       put in the link; a link opened elsewhere draws the same nodes either way. */
    const typesBtn = document.getElementById('g-types');
    const setTypes = (on) => {
      state.types = on;
      Object.assign(BOX, on ? BOX_HEIGHTS.typed : BOX_HEIGHTS.plain);
      typesBtn.setAttribute('aria-pressed', String(on));
      remembered.write('types', on);
      if (state.focus !== null) draw(false);
    };
    typesBtn.addEventListener('click', () => setTypes(!state.types));
    if (remembered.read('types', false) === true) {
      state.types = true;
      Object.assign(BOX, BOX_HEIGHTS.typed);
      typesBtn.setAttribute('aria-pressed', 'true');
    }

    /* A type in the details panel opens underneath its row, and closing it
       closes whatever was opened inside it. The button keeps the keyboard. */
    /* The keyboard stays on what it was on after the panel is drawn again;
       a control that went with the drawing - a note that is all opened now -
       hands it to the section's own *Expand all*. */
    const refocus = (selector) => {
      const again = panel.querySelector(selector) || panel.querySelector('button[data-types="all"]');
      if (again) again.focus();
    };
    const toggleType = (key) => {
      if (state.openTypes.has(key)) {
        for (const open of [...state.openTypes]) if (open === key || open.startsWith(key + '.')) state.openTypes.delete(open);
        for (const asked of [...state.typeMore.keys()]) if (asked.startsWith(key + '.')) state.typeMore.delete(asked);
      } else state.openTypes.add(key);
      const [at, type] = [key.slice(0, key.lastIndexOf(':')), key.slice(key.lastIndexOf(':') + 1)];
      drawDetails();
      refocus(`button.g-type[data-at="${CSS.escape(at)}"][data-type="${type}"]`);
    };

    /* "Expand all": everything under some rows opened at once, within the
       bounds. What the bounds left closed is said under where it was asked,
       and asking there again opens the next stretch, since what is open is
       walked through and not counted again. */
    const openEverything = (roots, asked, focus) => {
      const { keys, left } = openAll(model, roots, state.openTypes);
      for (const key of keys) state.openTypes.add(key);
      if (left > 0) state.typeMore.set(asked, { roots, left });
      else state.typeMore.delete(asked);
      drawDetails();
      refocus(focus);
    };

    /* Text onto the clipboard, true when it got there. */
    const copyText = async (text) => {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        // No clipboard API here (an older browser, or a page it does not trust):
        // the selection still copies.
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.append(area);
        area.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch { copied = false; }
        area.remove();
        return copied;
      }
    };

    /* Copy as TypeScript: the node's face with every type opened inline. */
    const copyTypes = async (v, button) => {
      const written = typeScriptOf(model, v);
      if (written === null) return;
      const copied = await copyText(written.text);
      const cut = written.left > 0 ? ` · ${plural(written.left, 'type', 'types')} kept as names` : '';
      flash(button, copied ? 'Copied' + cut : 'Could not copy', copied);
    };

    /* A button says what it did, in its own words, for a moment. */
    const flash = (button, text, ok = true) => {
      const label = button.querySelector('span') || button;
      if (button.dataset.label === undefined) button.dataset.label = label.textContent;
      label.textContent = text;
      button.classList.toggle('is-done', ok);
      clearTimeout(Number(button.dataset.timer));
      button.dataset.timer = String(setTimeout(() => {
        label.textContent = button.dataset.label;
        button.classList.remove('is-done');
      }, 1600));
    };
