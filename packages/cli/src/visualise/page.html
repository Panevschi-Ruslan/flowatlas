<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #e9ecea;
    --paper: #f6f8f6;
    --raise: #ffffff;
    --ink: #171b19;
    --muted: #5f6d67;
    --faint: #8b9891;
    --rule: #cbd3ce;
    --rule-soft: #dde3df;
    --accent: #0d5c55;
    --accent-soft: #d3e5e1;

    --good: #3f7d3f;
    --warn: #97701a;
    --bad: #a03626;

    --s-0: #2f6f8f;
    --s-1: #a2542f;
    --s-2: #5b6e2f;
    --s-3: #7a3f6d;
    --s-4: #b08424;

    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --gap: 18px;
    --radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #101412;
      --paper: #171d1a;
      --raise: #1e2622;
      --ink: #e4e9e6;
      --muted: #94a39c;
      --faint: #6d7b74;
      --rule: #2b3531;
      --rule-soft: #222b27;
      --accent: #5ec7bb;
      --accent-soft: #123833;

      --good: #7bbb72;
      --warn: #d8ac52;
      --bad: #e08573;

      --s-0: #6fb2d4;
      --s-1: #e0916a;
      --s-2: #a4bd6a;
      --s-3: #c68fb8;
      --s-4: #e0bd63;
    }
  }

  :root[data-theme='dark'] {
    --ground: #101412;
    --paper: #171d1a;
    --raise: #1e2622;
    --ink: #e4e9e6;
    --muted: #94a39c;
    --faint: #6d7b74;
    --rule: #2b3531;
    --rule-soft: #222b27;
    --accent: #5ec7bb;
    --accent-soft: #123833;

    --good: #7bbb72;
    --warn: #d8ac52;
    --bad: #e08573;

    --s-0: #6fb2d4;
    --s-1: #e0916a;
    --s-2: #a4bd6a;
    --s-3: #c68fb8;
    --s-4: #e0bd63;
  }

  * { box-sizing: border-box; }

  /* A class that sets `display` would otherwise win over the attribute, and
     the walk's controls stayed on screen under every other tab. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .shell {
    max-width: 1500px;
    margin: 0 auto;
    padding: 26px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  @media (max-width: 640px) {
    .shell { padding: 18px 16px 40px; }
  }

  /* ── masthead ───────────────────────────────────────────────────────── */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    font-family: var(--f-display);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    margin: 4px 0 0;
    color: var(--muted);
    max-width: 62ch;
  }

  .built {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--faint);
    text-align: right;
    line-height: 1.7;
  }

  /* ── the reconciliation band ────────────────────────────────────────── */

  .band {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 1px;
    background: var(--rule-soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .stat {
    background: var(--paper);
    padding: 12px 14px 13px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .stat dt {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--faint);
    font-weight: 500;
  }

  .stat dd {
    margin: 0;
    font-family: var(--f-mono);
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }

  .stat small {
    color: var(--muted);
    font-size: 11.5px;
    font-family: var(--f-ui);
  }

  .stat.is-good dd { color: var(--good); }
  .stat.is-warn dd { color: var(--warn); }

  /* ── service rail ───────────────────────────────────────────────────── */

  .fleet {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ship {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 11px 6px 9px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--hue);
    border-radius: var(--radius);
    background: var(--paper);
    font-size: 12.5px;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
  }

  .ship[aria-pressed='true'] {
    background: var(--raise);
    border-color: var(--hue);
  }

  .ship[aria-pressed='false'] { opacity: 0.5; }

  .ship b { font-weight: 600; }

  .ship span {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .ship em {
    font-style: normal;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--faint);
  }

  /* ── working area ───────────────────────────────────────────────────── */

  .work {
    display: grid;
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
    gap: var(--gap);
    align-items: start;
  }

  @media (max-width: 900px) {
    .work { grid-template-columns: minmax(0, 1fr); }
  }

  .panel {
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--paper);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
    flex-wrap: wrap;
  }

  .panel-head h2 {
    font-family: var(--f-display);
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .hint {
    font-size: 11.5px;
    color: var(--faint);
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
  }

  input[type='search'],
  select {
    font-family: var(--f-ui);
    font-size: 13px;
    color: var(--ink);
    background: var(--raise);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 6px 9px;
  }

  input[type='search'] { width: 100%; }

  .filters {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    max-height: 560px;
  }

  .list li + li { border-top: 1px solid var(--rule-soft); }

  .row {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 3px solid var(--hue);
    padding: 8px 12px;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .row:hover { background: var(--raise); }
  .row[aria-current='true'] { background: var(--accent-soft); }

  .row-name {
    font-family: var(--f-mono);
    font-size: 12px;
    word-break: break-word;
  }

  .row-meta {
    font-size: 11px;
    color: var(--faint);
  }

  .verb {
    font-weight: 500;
    color: var(--hue);
  }

  /* ── the walk ───────────────────────────────────────────────────────── */

  .tabs {
    display: flex;
    gap: 2px;
  }

  .tab {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 11px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--muted);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .tab[aria-selected='true'] {
    background: var(--raise);
    color: var(--ink);
    border-color: var(--accent);
  }

  .walk {
    overflow: auto;
    max-height: 620px;
    padding: 4px 0 12px;
  }

  .step {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 10px;
    padding: 3px 14px 3px 0;
    padding-left: calc(var(--level) * 15px + 14px);
    white-space: nowrap;
    position: relative;
  }

  /* One hairline per level of depth, so the shape of the walk is readable
     without spending characters on drawing it. */
  .step[data-level]:not([data-level='0'])::before {
    content: '';
    position: absolute;
    left: calc(var(--level) * 15px + 4px);
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--rule);
  }

  .step:hover { background: var(--raise); }

  .via {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .via.is-marker { color: var(--warn); }
  .via.is-heuristic { color: var(--warn); }
  .via.is-runtime { color: var(--bad); }

  .what {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
  }

  .glyph {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--raise);
    background: var(--hue);
    border-radius: 2px;
    padding: 1px 4px;
    flex: none;
  }

  .label {
    font-family: var(--f-mono);
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .where {
    font-size: 11px;
    color: var(--faint);
    font-family: var(--f-mono);
    text-align: right;
  }

  .crossing {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 5px 14px 5px 0;
    padding: 4px 10px;
    border-left: 3px solid var(--hue);
    background: var(--raise);
    border-radius: var(--radius);
    font-size: 11.5px;
    color: var(--muted);
  }

  .crossing b {
    font-weight: 600;
    color: var(--hue);
    font-family: var(--f-ui);
  }

  .repeat { color: var(--faint); font-style: italic; }

  .cut {
    margin: 8px 14px 0 0;
    padding: 7px 11px;
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--muted);
  }

  /* ── tables ─────────────────────────────────────────────────────────── */

  .sheet { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--faint);
    font-weight: 500;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }

  td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
  }

  td.mono {
    font-family: var(--f-mono);
    font-size: 11.5px;
    word-break: break-word;
  }

  td.num {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  tr:hover td { background: var(--raise); }

  .tag {
    display: inline-block;
    font-family: var(--f-mono);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 2px;
    border: 1px solid var(--rule);
    color: var(--muted);
    white-space: nowrap;
  }

  .tag.is-good { color: var(--good); border-color: var(--good); }
  .tag.is-warn { color: var(--warn); border-color: var(--warn); }
  .tag.is-bad { color: var(--bad); border-color: var(--bad); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 11.5px;
    color: var(--muted);
    padding: 10px 12px;
    border-top: 1px solid var(--rule-soft);
  }

  .legend span { display: inline-flex; align-items: baseline; gap: 6px; }

  .colophon {
    color: var(--faint);
    font-size: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 14px;
    max-width: 72ch;
  }

  .colophon code {
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
  }

  /* ── show in graph ──────────────────────────────────────────────────── */

  .to-graph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    color: var(--faint);
    border-radius: 2px;
    text-decoration: none;
    vertical-align: middle;
  }

  .to-graph:hover { color: var(--accent); }
  .to-graph svg { width: 14px; height: 14px; display: block; }

  .list li { display: flex; align-items: stretch; }
  .list li .row { flex: 1; min-width: 0; }
  .list li .to-graph { width: 34px; border-left: 1px solid var(--rule-soft); }
  .list li .to-graph:hover { background: var(--raise); }
  .what .to-graph { margin-left: 2px; }

  /* ── the graph ──────────────────────────────────────────────────────── */

  .graph { display: flex; flex-direction: column; min-width: 0; }

  .g-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .g-find { position: relative; flex: 1 1 260px; min-width: 0; }

  .g-results {
    position: absolute;
    z-index: 5;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: 340px;
    overflow-y: auto;
    background: var(--raise);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.35);
  }

  .g-results li + li { border-top: 1px solid var(--rule-soft); }

  .g-hit {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 6px 10px 6px 9px;
    border-left: 3px solid var(--hue);
    cursor: pointer;
  }

  .g-hit[aria-selected='true'] { background: var(--accent-soft); }
  .g-hit .row-name { display: flex; gap: 7px; align-items: baseline; }
  .g-results .cut { margin: 6px 8px; }

  .tool {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
  }

  .tool:hover:not(:disabled) { background: var(--raise); border-color: var(--accent); }
  .tool:disabled { color: var(--faint); cursor: default; }

  .g-pick { display: flex; align-items: center; gap: 6px; }

  .g-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .g-filters .hint { margin-right: 2px; }
  .g-filters .hint:not(:first-child) { margin-left: 10px; }

  .chip {
    font-family: var(--f-mono);
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid var(--rule);
    background: var(--raise);
    color: var(--muted);
    cursor: pointer;
  }

  .chip[aria-pressed='false'] {
    background: transparent;
    color: var(--faint);
    text-decoration: line-through;
    border-style: dashed;
  }

  .g-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    min-height: 0;
  }

  .g-stage.is-closed { grid-template-columns: minmax(0, 1fr); }

  @media (max-width: 1240px) {
    .g-stage { grid-template-columns: minmax(0, 1fr); }
  }

  .g-canvas {
    position: relative;
    height: 560px;
    overflow: hidden;
    background:
      radial-gradient(circle, var(--rule-soft) 1px, transparent 1.2px) 0 0 / 18px 18px,
      var(--ground);
    touch-action: none;
    cursor: grab;
  }

  .g-canvas.is-panning { cursor: grabbing; }

  @media (max-width: 640px) {
    .g-canvas { height: 430px; }
  }

  .g-canvas > svg { display: block; width: 100%; height: 100%; }

  .g-zoom {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    gap: 2px;
  }

  .g-zoom .tool { padding: 3px 9px; font-family: var(--f-mono); }

  .g-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }

  /* Drawn in the page's own vocabulary: a hairline box, the service's hue as a
     rule down the left, the type as a glyph. Resources a flow ends at - a
     table, a channel, an outside API, a setting - are pills, so the edge of a
     drawing reads as its edge. */
  .g-node { cursor: pointer; outline: none; }
  .g-box { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
  .g-node:hover .g-box { fill: var(--raise); stroke: var(--muted); }
  .g-rule { fill: var(--hue); }
  .g-node.is-pill .g-box { stroke: var(--hue); stroke-width: 1.4; }
  .g-node.is-focus .g-box { fill: var(--raise); stroke: var(--accent); stroke-width: 2; }
  .g-node.is-open .g-box { fill: var(--accent-soft); }
  .g-node:focus-visible .g-box { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 2; }
  .g-glyph { fill: var(--hue); }
  .g-glyph-text {
    fill: var(--raise);
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .g-label { fill: var(--ink); font-family: var(--f-mono); font-size: 11.5px; }
  .g-sub { fill: var(--faint); font-family: var(--f-ui); font-size: 10.5px; }
  .g-more rect { fill: var(--ground); stroke: var(--rule); }
  .g-more text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
  .g-more:hover rect, .g-more:focus-visible rect { stroke: var(--accent); fill: var(--accent-soft); }
  .g-more { cursor: pointer; outline: none; }

  .g-col {
    fill: var(--faint);
    font-family: var(--f-mono);
    font-size: 10.5px;
    text-anchor: middle;
  }

  .g-link path.g-edge {
    fill: none;
    stroke: var(--faint);
    stroke-width: 1.25;
  }

  .g-link path.g-hit { fill: none; stroke: transparent; stroke-width: 10; }
  .g-link.is-cross path.g-edge { stroke: var(--hue); stroke-width: 1.75; }
  .g-link.is-heuristic path.g-edge { stroke-dasharray: 6 4; }
  .g-link.is-marker path.g-edge,
  .g-link.is-declared path.g-edge { stroke-dasharray: 0.5 4; stroke-linecap: round; stroke-width: 1.75; }
  .g-link.is-lit path.g-edge { stroke: var(--accent); stroke-width: 2; }
  .g-link:hover path.g-edge { stroke: var(--ink); }
  .g-tip {
    fill: var(--muted);
    font-family: var(--f-mono);
    font-size: 9.5px;
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--ground);
    stroke-width: 3px;
  }

  .g-status {
    margin: 0;
    padding: 8px 12px;
    border-top: 1px solid var(--rule-soft);
    font-size: 12px;
    color: var(--muted);
  }

  .g-status b { font-weight: 600; color: var(--ink); }
  .g-status.is-cut { color: var(--warn); }

  /* ── details ────────────────────────────────────────────────────────── */

  .g-details {
    border-left: 1px solid var(--rule-soft);
    max-height: 560px;
    overflow-y: auto;
    padding: 12px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 12.5px;
    background: var(--paper);
  }

  @media (max-width: 1240px) {
    .g-details { border-left: 0; border-top: 1px solid var(--rule); max-height: none; }
  }

  .g-details header { display: flex; flex-direction: column; gap: 5px; }

  .g-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .g-details h3 {
    margin: 0;

<script type="application/json" id="graph">__DATA__</script>

<script type="module">
/* The graph view's logic, written in by the command from graph.js. */
__GRAPH_LOGIC__

  (() => {
    const data = JSON.parse(document.getElementById('graph').textContent);
    const { types, repos, kinds, files, edgeTypes, confidences, reasons } = data.dicts;

    /* Node fields, as packed: type, label, repo, kind, file, line, meta. A node
       is known by its position; only the ways in keep a name, in entryIds. */
    const TY = 0, LB = 1, RP = 2, KD = 3, FL = 4, LN = 5, MT = 6;
    const nodes = data.nodes;

    const hueOf = (repoIndex) => `var(--s-${repoIndex % 5})`;
    const repoName = (i) => repos[nodes[i][RP]];
    const typeName = (i) => types[nodes[i][TY]];

    /* Edges a walk follows outward. Guards hang off the entry, never descended. */
    const FORWARD = new Set(['handles', 'calls', 'queries', 'caches', 'emits', 'consumes',
      'http_calls', 'hits', 'triggers', 'reads_config']);
    const CROSSES = new Set(['http_calls', 'hits']);

    const out = nodes.map(() => []);
    const guards = nodes.map(() => []);
    for (const e of data.edges) {
      const name = edgeTypes[e[2]];
      if (name === 'guarded_by') guards[e[0]].push(e);
      else if (FORWARD.has(name)) out[e[0]].push(e);
    }

    /* Short, readable stand-ins for node types; the vocabulary is the subject's. */
    const GLYPH = {
      entry: 'in', method: 'fn', provider: 'cls', db_query: 'db', table: 'tbl',
      channel: 'ch', producer: 'pub', consumer: 'sub', http_out: 'out',
      ui_component: 'view', ui_action: 'act', ui_api_call: 'req',
      config_key: 'cfg', external_api: 'ext', module: 'mod', repo: 'repo',
      guard: 'grd', interceptor: 'int', pipe: 'pipe',
    };

    /* Labels are source text: `requireSecret<Ctx>(...)`, `click="save()"`. Any
       of it written as markup is escaped first. */
    const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ESCAPES[c]);

    /* Every node named on the page can be opened in the graph. A link rather
       than a handler, so it can be opened in a new tab or copied. */
    const GRAPH_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4"><circle cx="3.5" cy="8" r="2"/><circle cx="12.5" cy="3.5" r="2"/>' +
      '<circle cx="12.5" cy="12.5" r="2"/><path d="M5.3 7.1 10.7 4.4M5.3 8.9l5.4 2.7"/></svg>';
    const graphLink = (i) =>
      `<a class="to-graph" href="#graph/${i}" title="Show in graph" ` +
      `aria-label="Show ${esc(nodes[i][LB])} in the graph">${GRAPH_ICON}</a>`;

    /* ── the reconciliation band ─────────────────────────────────────── */

    const r = data.report;
    const band = document.getElementById('band');
    const stat = (label, value, note, tone) => {
      const el = document.createElement('div');
      el.className = 'stat' + (tone ? ' is-' + tone : '');
      el.innerHTML = `<dt>${label}</dt><dd>${value}</dd><small>${note}</small>`;
      band.append(el);
    };

    stat('Graph', r.totals.nodes.toLocaleString() + ' nodes',
      r.totals.edges.toLocaleString() + ' edges, ' + r.types.total.toLocaleString() + ' types');
    stat('Service calls', r.httpOut.linked + ' / ' + r.httpOut.total + ' joined',
      r.httpOut.external + ' third party, ' + r.httpOut.dynamic + ' built at run time',
      r.httpOut.linked > 0 ? 'good' : null);
    if (r.ui) {
      stat('Browser calls', r.ui.resolved + ' / ' + r.ui.total + ' joined',
        r.ui.unresolved + ' still unmatched', r.ui.resolved > 0 ? 'warn' : null);
    }
    stat('Routes reached', r.routes.called + ' / ' + r.routes.total,
      (r.routes.total - r.routes.called) + ' nothing calls');
    stat('Channels', r.channels.linked + ' / ' + r.channels.total + ' joined',
      r.channels.noConsumers.length + ' with no handler',
      r.channels.linked === 0 ? 'warn' : 'good');
    stat('Left unresolved', r.totals.unresolved.toLocaleString(),
      'each one recorded with a reason');

    const read = r.services.filter((s) => s.skipped === null).length;
    document.getElementById('standfirst').textContent =
      `${read} of ${r.services.length} repositories read and joined into one graph. Pick a way in ` +
      'on the left and follow it; a rule across the walk marks every point where it leaves one ' +
      'service for another.';

    document.getElementById('built').innerHTML =
      'built ' + new Date(data.builtAt).toISOString().replace('T', ' ').slice(0, 19) + ' UTC<br>' +
      r.services.map((s) => s.durationMs + 'ms ' + s.name).join(' &middot; ');

    /* ── service rail, doubling as the filter ────────────────────────── */

    const shown = new Set(repos);
    const fleet = document.getElementById('fleet');
    repos.forEach((name, i) => {
      const summary = r.services.find((s) => s.name === name);
      const b = document.createElement('button');
      b.className = 'ship';
      b.style.setProperty('--hue', hueOf(i));
      b.setAttribute('aria-pressed', 'true');
      b.innerHTML = `<b>${name}</b><em>${summary ? summary.type : ''}</em>` +
        `<span>${summary ? summary.nodes.toLocaleString() : '0'} nodes</span>`;
      b.addEventListener('click', () => {
        if (shown.has(name)) shown.delete(name); else shown.add(name);
        b.setAttribute('aria-pressed', String(shown.has(name)));
        drawEntries();
        if (view === 'graph') graph.refresh();
      });
      fleet.append(b);
    });

    /* ── ways in ─────────────────────────────────────────────────────── */

    const entryIx = [];
    for (let i = 0; i < nodes.length; i += 1) {
      const t = typeName(i);
      if (t === 'entry' || t === 'ui_action') entryIx.push(i);
    }
    entryIx.sort((a, b) => {
      const ra = repoName(a), rb = repoName(b);
      if (ra !== rb) return ra < rb ? -1 : 1;
      return nodes[a][LB] < nodes[b][LB] ? -1 : 1;
    });

    const kindSelect = document.getElementById('kind');
    for (const k of [...new Set(entryIx.map((i) => kinds[nodes[i][KD]]).filter(Boolean))].sort()) {
      const o = document.createElement('option');
      o.value = k; o.textContent = k;
      kindSelect.append(o);
    }

    const entrySearch = document.getElementById('search');
    const listEl = document.getElementById('entries');
    const countEl = document.getElementById('entry-count');
    let current = null;

    const matches = () => {
      const q = entrySearch.value.trim().toLowerCase();
      const kind = kindSelect.value;
      return entryIx.filter((i) => {
        if (!shown.has(repoName(i))) return false;
        if (kind && kinds[nodes[i][KD]] !== kind) return false;
        if (!q) return true;
        return nodes[i][LB].toLowerCase().includes(q);
      });
    };

    function drawEntries() {
      const found = matches();
      countEl.textContent = found.length.toLocaleString() + ' of ' + entryIx.length.toLocaleString();
      listEl.replaceChildren();
      const frag = document.createDocumentFragment();
      for (const i of found.slice(0, 400)) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.className = 'row';
        b.style.setProperty('--hue', hueOf(nodes[i][RP]));
        if (i === current) b.setAttribute('aria-current', 'true');
        const meta = nodes[i][MT] || {};
        const name = meta.m
          ? `<span class="verb">${esc(meta.m)}</span> ${esc(meta.p || '')}`
          : esc(nodes[i][LB]);
        b.innerHTML = `<span class="row-name">${name}</span>` +
          `<span class="row-meta">${esc(repoName(i))} &middot; ${esc(kinds[nodes[i][KD]] || typeName(i))}` +
          (files[nodes[i][FL]] ? ' &middot; ' + esc(files[nodes[i][FL]].split('/').pop()) : '') + '</span>';
        b.addEventListener('click', () => {
          current = i;
          drawEntries();
          // On the graph a way in is a focus; anywhere else it is a walk.
          if (view === 'graph') graph.go(i); else showView('walk');
        });
        li.append(b);
        li.insertAdjacentHTML('beforeend', graphLink(i));
        frag.append(li);
      }
      if (found.length > 400) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="cut" style="margin:8px 12px">${(found.length - 400).toLocaleString()} more. Narrow the filter.</div>`;
        frag.append(li);
      }
      listEl.append(frag);
    }

    /* ── the walk ────────────────────────────────────────────────────── */

    const walkEl = document.getElementById('walk');
    const titleEl = document.getElementById('walk-title');
    const depthSel = document.getElementById('depth');
    const capSel = document.getElementById('cap');


    function drawWalk() {
      if (current === null) return;
      const depth = Number(depthSel.value);
      const cap = Number(capSel.value);
      walkEl.replaceChildren();
      titleEl.textContent = nodes[current][LB];

      const frag = document.createDocumentFragment();
      let used = 0, over = 0;

      const emit = (i, level, edge, path) => {
        const row = document.createElement('div');
        row.className = 'step';
        row.style.setProperty('--hue', hueOf(nodes[i][RP]));
        row.style.setProperty('--level', String(level));
        row.dataset.level = String(level);
        const t = typeName(i);
        const meta = nodes[i][MT] || {};
        const label = meta.m ? `${meta.m} ${meta.p || ''}` : nodes[i][LB];
        const conf = edge ? confidences[edge[3]] : '';
        row.innerHTML =
          `<span class="what">` +
            `<span class="glyph">${GLYPH[t] || t.slice(0, 4)}</span>` +
            `<span class="label">${esc(label)}</span>` +
            graphLink(i) +
          `</span>` +
          `<span class="where">` +
            (edge ? `<span class="via is-${conf}">${edgeTypes[edge[2]]}${conf === 'static' ? '' : ' &middot; ' + conf}</span>  ` : '') +
            (files[nodes[i][FL]] ? esc(files[nodes[i][FL]].split('/').pop()) + (nodes[i][LN] ? ':' + nodes[i][LN] : '') : '') +
          `</span>`;
        frag.append(row);

        const guarded = guards[i];
        if (guarded.length > 0) {
          const g = document.createElement('div');
          g.className = 'crossing';
          g.style.setProperty('--hue', hueOf(nodes[i][RP]));
          g.style.marginLeft = (level * 15 + 28) + 'px';
          g.innerHTML = '<b>runs first</b>' + guarded
            .slice()
            .sort((a, b) => a[0] - b[0])
            .map((e) => esc(nodes[e[1]][LB].replace(/\(.*/, '')))
            .join(', ');
          frag.append(g);
        }
      };

      const queue = [{ i: current, level: 0, path: new Set([current]), edge: null }];
      emit(current, 0, null);
      used = 1;

      while (queue.length > 0) {
        const item = queue.shift();
        if (item.level >= depth) continue;
        const edges = out[item.i].slice().sort((a, b) => a[1] - b[1]);
        for (const e of edges) {
          const to = e[1];
          if (item.path.has(to)) {
            if (used < cap) {
              used += 1;
              const row = document.createElement('div');
              row.className = 'step';
              row.style.setProperty('--hue', hueOf(nodes[to][RP]));
              row.style.setProperty('--level', String(item.level + 1));
              row.dataset.level = String(item.level + 1);
              row.innerHTML =
                `<span class="what"><span class="repeat">already on this path: ${esc(nodes[to][LB])}</span></span><span></span>`;
              frag.append(row);
            } else over += 1;
            continue;
          }
          if (used >= cap) { over += 1; continue; }

          if (CROSSES.has(edgeTypes[e[2]])) {
            const cross = document.createElement('div');
            cross.className = 'crossing';
            cross.style.setProperty('--hue', hueOf(nodes[to][RP]));
            cross.style.marginLeft = (item.level * 15 + 28) + 'px';
            cross.innerHTML = `<b>${esc(repoName(item.i))} &rarr; ${esc(repoName(to))}</b>` +
              `over ${edgeTypes[e[2]]}, ${confidences[e[3]]}`;
            frag.append(cross);
          }

          used += 1;
          emit(to, item.level + 1, e);
          queue.push({ i: to, level: item.level + 1, path: new Set([...item.path, to]) });
        }
      }

      if (over > 0) {
        const cut = document.createElement('div');
        cut.className = 'cut';
        cut.textContent = over + ' more nodes. Raise the cap, or narrow the depth.';
        frag.append(cut);
      }
      walkEl.append(frag);
    }

    /* ── crossings: every edge that leaves a service ─────────────────── */

    function drawCrossings() {
      titleEl.textContent = 'Every crossing';
      const rows = data.edges
        .filter((e) => CROSSES.has(edgeTypes[e[2]]))
        .sort((a, b) => repoName(a[0]) < repoName(b[0]) ? -1 : 1);

      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>From</th><th>To</th><th>Route</th><th>Trust</th></tr></thead>';
      const body = document.createElement('tbody');
      for (const e of rows) {
        const from = nodes[e[0]], to = nodes[e[1]];
        const meta = to[MT] || {};
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td class="mono"><span class="tag" style="color:${hueOf(from[RP])};border-color:${hueOf(from[RP])}">${esc(repos[from[RP]])}</span> ${esc(files[from[FL]] ? files[from[FL]].split('/').pop() + ':' + from[LN] : from[LB])} ${graphLink(e[0])}</td>` +
          `<td class="mono"><span class="tag" style="color:${hueOf(to[RP])};border-color:${hueOf(to[RP])}">${esc(repos[to[RP]])}</span></td>` +
          `<td class="mono">${esc(meta.m || '')} ${esc(meta.p || to[LB])} ${graphLink(e[1])}</td>` +
          `<td><span class="tag is-${confidences[e[3]] === 'static' ? 'good' : 'warn'}">${edgeTypes[e[2]]} &middot; ${confidences[e[3]]}</span></td>`;
        body.append(tr);
      }
      table.append(body);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.append(table);
      walkEl.replaceChildren(sheet);
    }

    /* ── what did not join, and why ──────────────────────────────────── */

    function drawMissing() {
      titleEl.textContent = 'What did not join';
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>Reason</th><th class="num">Count</th><th>One of them</th></tr></thead>';
      const body = document.createElement('tbody');
      for (const u of data.unresolved) {
        const tr = document.createElement('tr');
        const tone = u.reason.includes('not-found') ? 'bad' : u.reason.includes('dynamic') ? 'warn' : '';
        // The example is the first row of its reason, in the order both lists
        // are written; when that row names a node, the node is one click away.
        const example = data.rows.find((row) => reasons[row[ROW.reason]] === u.reason);
        const anchor = example === undefined ? -1 : example[ROW.node];
        tr.innerHTML =
          `<td><span class="tag${tone ? ' is-' + tone : ''}">${esc(u.reason)}</span></td>` +
          `<td class="num">${u.count.toLocaleString()}</td>` +
          `<td class="mono">${u.service ? esc(u.service) + ' &middot; ' : ''}${esc(u.example)}` +
          `${anchor >= 0 ? ' ' + graphLink(anchor) : ''}</td>`;
        body.append(tr);
      }
      table.append(body);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.append(table);
      walkEl.replaceChildren(sheet);
    }

    /* ── the graph ───────────────────────────────────────────────────── */

    /* What is drawn comes from graph.js: the model, the neighbourhood, the
       layout, the keys, the history. What follows is the page's half - the
       drawing, the details panel, the camera and the controls - each a small
       function of the state below, which is the only thing that changes. */

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const svgEl = (tag, attrs, text) => {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs || {})) el.setAttribute(key, String(value));
      if (text !== undefined) el.textContent = text;
      return el;
    };

    /* The drawing's own units. A column is a hop; a row is a node. */
    const BOX = { w: 196, h: 40, column: 264, row: 54, pad: 40, head: 22 };
    const PILL = new Set(['table', 'channel', 'external_api', 'config_key']);
    const DOORS = new Set(['entry', 'ui_action']);
    const GROUP_LIMIT = 12;
    const FILE_LIMIT = 6;

    const model = createModel(data);
    const typeOf = (i) => types[nodes[i][TY]];
    const glyphOf = (i) => GLYPH[typeOf(i)] || typeOf(i).slice(0, 4);
    const clip = (text, chars) => (text.length > chars ? text.slice(0, Math.max(1, chars - 1)) + '…' : text);
    const placeOf = (i) => files[nodes[i][FL]]
      ? files[nodes[i][FL]] + (nodes[i][LN] ? ':' + nodes[i][LN] : '')
      : '';
    const plural = (n, one, many) => n.toLocaleString() + ' ' + (n === 1 ? one : many);
    const enumerated = new Set(data.dicts.enumerated || []);
    const metaOf = (i) => Object.entries(nodes[i][MT] || {}).map(([key, value]) => [
      data.dicts.meta[key] || key,
      enumerated.has(key) ? data.dicts.values[value]
        : Array.isArray(value) ? value.join(', ')
        : value === true ? 'yes' : String(value),
    ]);

    const graphView = document.getElementById('graph-view');
    const wrap = document.getElementById('g-canvas');
    const svg = document.getElementById('g-svg');
    const world = document.getElementById('g-world');
    const stage = document.getElementById('g-stage');
    const panel = document.getElementById('g-details');
    const statusEl = document.getElementById('g-status');
    const hopsSel = document.getElementById('g-hops');
    const gCapSel = document.getElementById('g-cap');
    const backBtn = document.getElementById('g-back');
    const forwardBtn = document.getElementById('g-forward');

    const state = {
      focus: null,
      hops: Number(hopsSel.value),
      cap: Number(gCapSel.value),
      expanded: [],
      cursor: null,
      open: null,
      openGroups: new Set(),
      hood: null,
      placed: null,
      hiddenEdgeTypes: new Set(),
      hiddenConfidences: new Set(),
    };
    const trail = createHistory();

    const filterNow = () => createFilter(model, {
      services: new Set(repos.flatMap((name, i) => (shown.has(name) ? [] : [i]))),
      edgeTypes: state.hiddenEdgeTypes,
      confidences: state.hiddenConfidences,
    });

    /* ── the camera: pan and zoom over the drawing ── */

    const camera = (() => {
      let x = 0, y = 0, k = 1;
      const apply = () => world.setAttribute('transform', `translate(${x} ${y}) scale(${k})`);
      const bound = (value) => Math.min(2.4, Math.max(0.2, value));
      const size = () => ({ w: wrap.clientWidth || 800, h: wrap.clientHeight || 500 });
      const extent = (placed) => ({
        w: (placed.max - placed.min) * BOX.column + BOX.w + BOX.pad * 2,
        h: placed.height + BOX.pad * 2 + BOX.head,
      });
      const zoomAt = (px, py, factor) => {
        const next = bound(k * factor);
        x = px - ((px - x) * next) / k;
        y = py - ((py - y) * next) / k;
        k = next;
        apply();
      };
      return {
        zoomAt,
        zoom(factor) { const { w, h } = size(); zoomAt(w / 2, h / 2, factor); },
        pan(dx, dy) { x += dx; y += dy; apply(); },
        /* The whole drawing when it fits at a readable size; otherwise the
           focus, readable, with the rest a drag away. `whole` always fits. */
        frame(placed, focusAt, whole) {
          const screen = size();
          const all = extent(placed);
          const fits = Math.min(1, screen.w / all.w, screen.h / all.h);
          if (whole || fits >= 0.8) {
            k = bound(fits);
            x = (screen.w - all.w * k) / 2;
            y = (screen.h - all.h * k) / 2;
          } else {
            k = 0.9;
            x = screen.w / 2 - (focusAt.x + BOX.w / 2) * k;
            y = screen.h / 2 - (focusAt.y + BOX.h / 2) * k;
          }
          apply();
        },
        /* Brings a box into view when a key has moved off the edge. */
        reveal(box) {
          const screen = size();
          const left = x + box.x * k, top = y + box.y * k;
          const right = left + BOX.w * k, bottom = top + BOX.h * k;
          if (left < 12) x += 12 - left;
          else if (right > screen.w - 12) x -= right - (screen.w - 12);
          if (top < 12) y += 12 - top;
          else if (bottom > screen.h - 12) y -= bottom - (screen.h - 12);
          apply();
        },
      };
    })();

    /* ── the drawing ── */

    const at = (v) => {
      const p = state.placed.pos.get(v);
      return { x: p.x + BOX.pad, y: p.y + BOX.pad + BOX.head };
    };

    const columnName = (layer) => layer === 0 ? 'focus'
      : layer < 0 ? 'upstream ' + -layer : 'downstream ' + layer;

    const curve = (from, to) => {
      const y1 = from.y + BOX.h / 2, y2 = to.y + BOX.h / 2;
      if (from.x === to.x) {
        // Same column: out of the right side and back into it.
        const x = from.x + BOX.w, bend = 46;
        return { d: `M${x} ${y1} C${x + bend} ${y1} ${x + bend} ${y2} ${x} ${y2}`, mid: [x + bend * 0.75, (y1 + y2) / 2] };
      }
      if (to.x > from.x) {
        const x1 = from.x + BOX.w, x2 = to.x, c = (x2 - x1) / 2;
        return { d: `M${x1} ${y1} C${x1 + c} ${y1} ${x2 - c} ${y2} ${x2} ${y2}`, mid: [(x1 + x2) / 2, (y1 + y2) / 2] };
      }
      // Pointing back toward the focus: left side out, right side in.
      const x1 = from.x, x2 = to.x + BOX.w, c = Math.max(50, (x1 - x2) / 2);
      return { d: `M${x1} ${y1} C${x1 - c} ${y1} ${x2 + c} ${y2} ${x2} ${y2}`, mid: [(x1 + x2) / 2, (y1 + y2) / 2] };
    };

    const drawEdge = (k) => {
      const e = data.edges[k];
      const conf = confidences[e[3]];
      const cross = nodes[e[0]][RP] !== nodes[e[1]][RP];
      const g = svgEl('g', {
        class: `g-link is-${conf}` + (cross ? ' is-cross' : ''),
        'data-from': e[0],
        'data-to': e[1],
      });
      g.style.setProperty('--hue', hueOf(nodes[e[1]][RP]));
      const path = curve(at(e[0]), at(e[1]));
      g.append(
        svgEl('title', {}, `${nodes[e[0]][LB]} → ${nodes[e[1]][LB]}\n${edgeTypes[e[2]]}, ${conf}`),
        svgEl('path', { class: 'g-hit', d: path.d }),
        svgEl('path', { class: 'g-edge', d: path.d, 'marker-end': 'url(#g-arrow)' }),
      );
      // Read off an annotation or a document rather than the code: said on the line.
      if (conf === 'marker' || conf === 'declared') {
        g.append(svgEl('text', { class: 'g-tip', x: path.mid[0], y: path.mid[1] - 4 }, conf));
      }
      return g;
    };

    const drawNode = (v) => {
      const t = typeOf(v);
      const p = at(v);
      const more = state.hood.more.get(v) || 0;
      const label = nodes[v][LB];
      const pill = PILL.has(t);
      const g = svgEl('g', {
        class: 'g-node' + (pill ? ' is-pill' : '') + (v === state.focus ? ' is-focus' : ''),
        transform: `translate(${p.x} ${p.y})`,
        tabindex: -1,
        role: 'button',
        'data-node': v,
        'aria-label': `${label}, ${t}, ${repoName(v)}` + (more ? `, ${more} more not drawn` : ''),
      });
      g.style.setProperty('--hue', hueOf(nodes[v][RP]));
      g.append(svgEl('title', {}, label + (placeOf(v) ? '\n' + placeOf(v) : '')));
      g.append(svgEl('rect', { class: 'g-box', width: BOX.w, height: BOX.h, rx: pill ? BOX.h / 2 : 3 }));
      if (!pill) g.append(svgEl('rect', { class: 'g-rule', width: DOORS.has(t) ? 5 : 3, height: BOX.h, rx: 1 }));
      const glyph = glyphOf(v);
      const gx = pill ? 15 : 11;
      const gw = glyph.length * 5.8 + 8;
      g.append(
        svgEl('rect', { class: 'g-glyph', x: gx, y: 7, width: gw, height: 13, rx: 2 }),
        svgEl('text', { class: 'g-glyph-text', x: gx + 4, y: 16.5 }, glyph),
        svgEl('text', { class: 'g-label', x: gx + gw + 6, y: 18 },
          clip(label, Math.floor((BOX.w - gx - gw - 6 - (pill ? 16 : 8)) / 6.9))),
        svgEl('text', { class: 'g-sub', x: gx, y: 33 },
          clip(repoName(v) + ' · ' + (kinds[nodes[v][KD]] || t), pill ? 26 : 30)),
      );
      if (more > 0) {
        const text = '+' + more.toLocaleString();
        const w = text.length * 6.2 + 10;
        const badge = svgEl('g', {
          class: 'g-more',
          'data-more': v,
          role: 'button',
          'aria-label': `Expand ${label}: ${more} more not drawn`,
          transform: `translate(${BOX.w - w + 6} -8)`,
        });
        badge.append(
          svgEl('title', {}, `${more} neighbours not drawn. Click to expand.`),
          svgEl('rect', { width: w, height: 15, rx: 7.5 }),
          svgEl('text', { x: 5, y: 11 }, text),
        );
        g.append(badge);
      }
      return g;
    };

    /* Selection and the keyboard cursor change classes, never the drawing: a
       redraw under a double click would leave the second click nowhere. */
    const paintSelection = (moveFocus) => {
      for (const el of world.querySelectorAll('.g-node')) {
        const v = Number(el.dataset.node);
        el.classList.toggle('is-open', v === state.open);
        el.setAttribute('tabindex', v === state.cursor ? '0' : '-1');
        if (moveFocus && v === state.cursor) el.focus({ preventScroll: true });
      }
      for (const el of world.querySelectorAll('.g-link')) {
        const lit = state.open !== null &&
          (Number(el.dataset.from) === state.open || Number(el.dataset.to) === state.open);
        el.classList.toggle('is-lit', lit);
      }
    };

    const drawDrawing = () => {
      const hadFocus = svg.contains(document.activeElement);
      const { hood, placed } = state;
      const heads = svgEl('g');
      for (let layer = placed.min; layer <= placed.max; layer += 1) {
        heads.append(svgEl('text', {
          class: 'g-col',
          x: (layer - placed.min) * BOX.column + BOX.pad + BOX.w / 2,
          y: BOX.pad + 4,
        }, columnName(layer)));
      }
      const links = svgEl('g');
      for (const k of hood.edges) links.append(drawEdge(k));
      const boxes = svgEl('g');
      for (const v of hood.nodes) boxes.append(drawNode(v));
      world.replaceChildren(heads, links, boxes);
      svg.setAttribute('aria-label', `Neighbourhood of ${nodes[state.focus][LB]}`);
      paintSelection(hadFocus);
    };

    const drawStatus = () => {
      const { hood } = state;
      const filter = filterNow();
      const parts = [
        `<b>${plural(hood.nodes.length, 'node', 'nodes')}</b> drawn within ${plural(state.hops, 'hop', 'hops')} ` +
        `of <b>${esc(nodes[state.focus][LB])}</b>.`,
      ];
      if (hood.left > 0) {
        parts.push(`<b>${hood.left.toLocaleString()} more</b> not drawn: the cap is ${state.cap}. ` +
          'Raise it, expand a node marked +N, or filter.');
      } else {
        parts.push(hood.nodes.length === 1 && hood.edges.length === 0
          ? 'Nothing the filters let through joins it.'
          : 'Nothing within reach is left out.');
      }
      if (filter.active) {
        const hiddenServices = repos.filter((name) => !shown.has(name)).length;
        const off = [
          hiddenServices && plural(hiddenServices, 'service', 'services'),
          state.hiddenEdgeTypes.size && plural(state.hiddenEdgeTypes.size, 'edge type', 'edge types'),
          state.hiddenConfidences.size && plural(state.hiddenConfidences.size, 'kind of trust', 'kinds of trust'),
        ].filter(Boolean);
        parts.push('Filters hide ' + off.join(', ') + '.');
      }
      statusEl.className = 'g-status' + (hood.left > 0 ? ' is-cut' : '');
      statusEl.innerHTML = parts.join(' ');
    };

    /* ── the details panel ── */

    const edgeGroup = (dir, group, far) => {
      const key = dir + group.type;
      const all = group.edges;
      const listed = state.openGroups.has(key) ? all : all.slice(0, GROUP_LIMIT);
      const items = listed.map((k) => {
        const e = data.edges[k];
        const v = e[far];
        return `<li><button class="g-far" data-go="${v}" style="--hue:${hueOf(nodes[v][RP])}" ` +
          `title="Centre on ${esc(nodes[v][LB])}${placeOf(v) ? ', ' + esc(placeOf(v)) : ''}">` +
          `<span class="label">${esc(nodes[v][LB])}</span>` +
          `<small>${esc(repoName(v))} &middot; ${esc(confidences[e[3]])}</small></button></li>`;
      }).join('');
      const rest = all.length - listed.length;
      return `<div class="g-group"><div class="g-group-name">${esc(edgeTypes[group.type])} &middot; ${all.length}</div>` +
        `<ul class="g-edges">${items}</ul>` +
        (rest > 0 ? `<button class="g-more-btn" data-group="${key}">Show ${rest.toLocaleString()} more</button>` : '') +
        '</div>';
    };

    const rowHtml = (r) => {
      const row = data.rows[r];
      const reason = reasons[row[ROW.reason]];
      const tone = reason.includes('not-found') ? 'bad' : reason.includes('dynamic') ? 'warn' : '';
      const file = row[ROW.file] >= 0 ? files[row[ROW.file]] + (row[ROW.line] ? ':' + row[ROW.line] : '') : '';
      const hint = row[ROW.hint] >= 0 ? data.dicts.hints[row[ROW.hint]] : '';
      return `<div class="g-row"><span class="tag${tone ? ' is-' + tone : ''}">${esc(reason)}</span> ` +
        `<span class="hint">${esc(data.dicts.levels[row[ROW.level]])}` +
        (row[ROW.sites] > 1 ? ` &middot; ${row[ROW.sites]} places` : '') +
        (file ? ` &middot; ${esc(file)}` : '') + '</span>' +
        `<p>${esc(row[ROW.message])}</p>` +
        (hint ? `<p class="hint-text">${esc(hint)}</p>` : '') + '</div>';
    };

    const drawDetails = () => {
      const v = state.open;
      stage.classList.toggle('is-closed', v === null);
      panel.hidden = v === null;
      if (v === null) return;
      const d = describe(model, v);
      const t = typeOf(v);
      const kind = kinds[nodes[v][KD]];
      const hue = hueOf(nodes[v][RP]);
      const meta = metaOf(v);
      const canExpand = state.hood.more.has(v) && !state.expanded.includes(v);
      const total = (groups) => groups.reduce((sum, group) => sum + group.edges.length, 0);
      const fileRows = state.openGroups.has('file') ? d.inFile : d.inFile.slice(0, FILE_LIMIT);

      panel.innerHTML =
        '<header>' +
          `<div class="g-head"><span><span class="glyph" style="--hue:${hue}">${esc(glyphOf(v))}</span> ` +
          `<span class="hint">${esc(t)}${kind ? ' &middot; ' + esc(kind) : ''}</span></span>` +
          '<button class="g-close" data-act="close" aria-label="Close details" title="Close (Escape)">&times;</button></div>' +
          `<h3 id="g-details-title">${esc(nodes[v][LB])}</h3>` +
          `<div><span class="tag" style="color:${hue};border-color:${hue}">${esc(repoName(v))}</span> ` +
          `<span class="g-place">${esc(placeOf(v))}</span></div>` +
        '</header>' +
        '<div class="g-actions">' +
          `<button class="tool" data-act="centre"${v === state.focus ? ' disabled' : ''}>Centre here</button>` +
          `<button class="tool" data-act="expand"${canExpand ? '' : ' disabled'}>Expand neighbours</button>` +
          (DOORS.has(t) ? '<button class="tool" data-act="walk">Open in Walk</button>' : '') +
        '</div>' +
        (meta.length > 0
          ? '<dl class="g-meta">' + meta.map(([key, value]) => `<dt>${esc(key)}</dt><dd>${esc(value)}</dd>`).join('') + '</dl>'
          : '') +
        `<section><h4>In &middot; ${total(d.into)}</h4>` +
          (d.into.length ? d.into.map((group) => edgeGroup('in', group, 0)).join('') : '<p class="g-none">Nothing reaches it.</p>') +
        '</section>' +
        `<section><h4>Out &middot; ${total(d.out)}</h4>` +
          (d.out.length ? d.out.map((group) => edgeGroup('out', group, 1)).join('') : '<p class="g-none">It reaches nothing.</p>') +
        '</section>' +
        `<section><h4>Not joined here &middot; ${d.rows.length}</h4>` +
          (d.rows.length ? d.rows.map(rowHtml).join('') : '<p class="g-none">No row names this node.</p>') +
          (d.inFile.length
            ? `<div class="g-group-name" style="margin-top:8px">Elsewhere in its file &middot; ${d.inFile.length}</div>` +
              fileRows.map(rowHtml).join('') +
              (fileRows.length < d.inFile.length
                ? `<button class="g-more-btn" data-group="file">Show ${(d.inFile.length - fileRows.length).toLocaleString()} more</button>`
                : '')
            : '') +
        '</section>';
      panel.setAttribute('aria-labelledby', 'g-details-title');
    };

    /* ── state changes: every control ends in one of these ── */

    const syncControls = () => {
      backBtn.disabled = !trail.canBack();
      forwardBtn.disabled = !trail.canForward();
      if (view === 'graph') history.replaceState(null, '', formatHash(state.focus, state.hops));
      titleEl.textContent = nodes[state.focus][LB];
    };

    const draw = (frame) => {
      state.hood = neighbourhood(model, {
        focus: state.focus,
        hops: state.hops,
        cap: state.cap,
        filter: filterNow(),
        expanded: state.expanded,
      });
      state.placed = layout(model, state.hood, { column: BOX.column, row: BOX.row });
      if (state.open !== null && !state.hood.layer.has(state.open)) state.open = null;
      if (!state.hood.layer.has(state.cursor)) state.cursor = state.focus;
      drawDrawing();
      drawStatus();
      drawDetails();
      if (frame) camera.frame(state.placed, at(state.focus), false);
    };

    const select = (v, moveFocus) => {
      state.cursor = v;
      if (state.open !== v) state.openGroups.clear();
      state.open = v;
      paintSelection(moveFocus);
      drawDetails();
    };

    const go = (v, record = true) => {
      if (record) trail.visit(v);
      state.focus = v;
      state.cursor = v;
      state.open = v;
      state.expanded = [];
      state.openGroups.clear();
      draw(true);
      syncControls();
    };

    const expand = (v) => {
      if (!state.expanded.includes(v)) state.expanded.push(v);
      state.cursor = v;
      state.open = v;
      draw(false);
    };

    const closeDetails = () => {
      state.open = null;
      paintSelection(panel.contains(document.activeElement));
      drawDetails();
    };

    /* ── controls ── */

    backBtn.addEventListener('click', () => go(trail.back(), false));
    forwardBtn.addEventListener('click', () => go(trail.forward(), false));
    hopsSel.addEventListener('change', () => { state.hops = Number(hopsSel.value); draw(true); syncControls(); });
    gCapSel.addEventListener('change', () => { state.cap = Number(gCapSel.value); draw(true); });
    document.getElementById('g-zoom-in').addEventListener('click', () => camera.zoom(1.25));
    document.getElementById('g-zoom-out').addEventListener('click', () => camera.zoom(0.8));
    document.getElementById('g-fit').addEventListener('click', () => camera.frame(state.placed, at(state.focus), true));

    /* Filters: services on the rail above, edge types and trust here. */
    const filterBar = document.getElementById('g-filters');
    const chips = (title, names, hidden) => {
      const label = document.createElement('span');
      label.className = 'hint';
      label.textContent = title;
      filterBar.append(label);
      names.forEach((name, i) => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = name;
        chip.setAttribute('aria-pressed', 'true');
        chip.addEventListener('click', () => {
          if (hidden.has(i)) hidden.delete(i); else hidden.add(i);
          chip.setAttribute('aria-pressed', String(!hidden.has(i)));
          draw(false);
        });
        filterBar.append(chip);
      });
    };
    chips('edges', edgeTypes, state.hiddenEdgeTypes);
    chips('trust', confidences, state.hiddenConfidences);
    filterBar.insertAdjacentHTML('beforeend', '<span class="hint">services: the rail above</span>');

    /* Pointer: drag pans, a wheel or a trackpad pans, a pinch or ctrl+wheel zooms. */
    let drag = null;
    let dragged = false;
    wrap.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || event.target.closest('.g-zoom')) return;
      drag = { x: event.clientX, y: event.clientY, id: event.pointerId };
      dragged = false;
    });
    wrap.addEventListener('pointermove', (event) => {
      if (drag === null || event.pointerId !== drag.id) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (!dragged && Math.hypot(dx, dy) < 4) return;
      if (!dragged) {
        dragged = true;
        wrap.setPointerCapture(event.pointerId);
        wrap.classList.add('is-panning');
      }
      camera.pan(dx, dy);
      drag.x = event.clientX;
      drag.y = event.clientY;
    });
    const endDrag = () => { drag = null; wrap.classList.remove('is-panning'); };
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);
    wrap.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (event.ctrlKey || event.metaKey) {
        const box = wrap.getBoundingClientRect();
        camera.zoomAt(event.clientX - box.left, event.clientY - box.top, Math.exp(-event.deltaY * 0.004));
      } else camera.pan(-event.deltaX, -event.deltaY);
    }, { passive: false });

    svg.addEventListener('click', (event) => {
      if (dragged) { dragged = false; return; }
      const badge = event.target.closest('.g-more');
      if (badge) { expand(Number(badge.dataset.more)); return; }
      const node = event.target.closest('.g-node');
      if (node) select(Number(node.dataset.node), false);
    });
    svg.addEventListener('dblclick', (event) => {
      const node = event.target.closest('.g-node');
      if (node && !event.target.closest('.g-more')) go(Number(node.dataset.node));
    });

    const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    svg.addEventListener('keydown', (event) => {
      const node = event.target.closest('.g-node');
      if (!node) return;
      const v = Number(node.dataset.node);
      if (KEYS[event.key]) {
        event.preventDefault();
        state.cursor = step(state.placed, v, KEYS[event.key]);
        paintSelection(true);
        camera.reveal(at(state.cursor));
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select(v, true);
      } else if (event.key === '+') {
        event.preventDefault();
        expand(v);
      } else if (event.key === 'Escape' && state.open !== null) {
        event.preventDefault();
        closeDetails();
      }
    });

    panel.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target) return;
      const v = state.open;
      if (target.dataset.go !== undefined) go(Number(target.dataset.go));
      else if (target.dataset.group !== undefined) { state.openGroups.add(target.dataset.group); drawDetails(); }
      else if (target.dataset.act === 'close') closeDetails();
      else if (target.dataset.act === 'centre') go(v);
      else if (target.dataset.act === 'expand') expand(v);
      else if (target.dataset.act === 'walk') { current = v; drawEntries(); showView('walk'); }
    });
    panel.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.preventDefault(); closeDetails(); }
    });

    /* ── search over every node, as a combobox ── */

    const findInput = document.getElementById('g-search');
    const resultsEl = document.getElementById('g-results');
    let hits = [];
    let active = -1;

    const closeResults = () => {
      resultsEl.hidden = true;
      findInput.setAttribute('aria-expanded', 'false');
      findInput.removeAttribute('aria-activedescendant');
      active = -1;
    };

    const markActive = () => {
      resultsEl.querySelectorAll('.g-hit').forEach((el, n) => el.setAttribute('aria-selected', String(n === active)));
      if (active >= 0) {
        const el = document.getElementById('g-hit-' + active);
        findInput.setAttribute('aria-activedescendant', el.id);
        el.scrollIntoView({ block: 'nearest' });
      } else findInput.removeAttribute('aria-activedescendant');
    };

    const drawResults = () => {
      if (findInput.value.trim() === '') { closeResults(); return; }
      const found = search(model, findInput.value, 40);
      hits = found.hits;
      active = hits.length > 0 ? 0 : -1;
      resultsEl.innerHTML = hits.map((i, n) =>
        `<li id="g-hit-${n}" role="option" class="g-hit" data-hit="${i}" aria-selected="false" ` +
        `style="--hue:${hueOf(nodes[i][RP])}">` +
        `<span class="row-name"><span class="glyph">${esc(glyphOf(i))}</span>${esc(nodes[i][LB])}</span>` +
        `<span class="row-meta">${esc(repoName(i))} &middot; ${esc(kinds[nodes[i][KD]] || typeOf(i))}` +
        (placeOf(i) ? ' &middot; ' + esc(placeOf(i)) : '') + '</span></li>').join('') +
        (found.total > hits.length
          ? `<li role="presentation"><div class="cut">${(found.total - hits.length).toLocaleString()} more. Keep typing to narrow.</div></li>`
          : '') +
        (found.total === 0 ? '<li role="presentation"><div class="cut">Nothing matches every word.</div></li>' : '');
      resultsEl.hidden = false;
      findInput.setAttribute('aria-expanded', 'true');
      markActive();
    };

    const pick = (i) => {
      closeResults();
      findInput.value = '';
      go(i);
    };

    findInput.addEventListener('input', drawResults);
    findInput.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (resultsEl.hidden) { drawResults(); return; }
        if (hits.length === 0) return;
        active = (active + (event.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
        markActive();
      } else if (event.key === 'Enter') {
        if (active >= 0 && !resultsEl.hidden) { event.preventDefault(); pick(hits[active]); }
      } else if (event.key === 'Escape') {
        closeResults();
      }
    });
    findInput.addEventListener('blur', () => setTimeout(closeResults, 120));
    resultsEl.addEventListener('mousedown', (event) => event.preventDefault());
    resultsEl.addEventListener('click', (event) => {
      const hit = event.target.closest('.g-hit');
      if (hit) pick(Number(hit.dataset.hit));
    });

    const graph = {
      go,
      refresh: () => { if (state.focus !== null) draw(false); },
      /* Opening the tab: on what was asked for, else where it was, else the
         way in the walk is on. */
      show(asked) {
        if (asked !== undefined && asked !== null) go(asked);
        else if (state.focus === null) go(current ?? 0);
        else { draw(true); syncControls(); }
      },
      setHops(hops) { state.hops = hops; hopsSel.value = String(hops); },
    };

    /* ── wiring ──────────────────────────────────────────────────────── */

    const controls = document.getElementById('walk-controls');
    const legendEl = document.getElementById('legend');
    const tabs = [...document.querySelectorAll('.tab')];
    let view = 'walk';

    const WALK_LEGEND =
      '<span><b>Trust</b> static, read from the code &middot; marker, an annotation said so &middot; heuristic, a guess</span>' +
      '<span><b>:param</b> a route hole, so one address matches every id</span>';
    const line = (dash) => `<svg width="30" height="8" aria-hidden="true"><path d="M1 4H29" stroke="currentColor" ` +
      `stroke-width="1.6" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/></svg>`;
    const GRAPH_LEGEND =
      `<span>${line('')} static</span><span>${line('6 4')} heuristic</span>` +
      `<span>${line('0.5 4')} marker, declared</span>` +
      '<span><b>coloured line</b> crosses into another service</span>' +
      '<span><b>+N</b> not drawn; click to expand</span>' +
      '<span><b>keys</b> arrows move &middot; Enter opens &middot; + expands &middot; Escape closes &middot; double-click centres</span>';

    function showView(name, asked) {
      view = name;
      for (const tab of tabs) tab.setAttribute('aria-selected', String(tab.dataset.view === name));
      controls.hidden = name !== 'walk';
      walkEl.hidden = name === 'graph';
      graphView.hidden = name !== 'graph';
      legendEl.innerHTML = name === 'graph' ? GRAPH_LEGEND : WALK_LEGEND;
      if (name !== 'graph' && location.hash.startsWith('#graph')) {
        history.replaceState(null, '', location.pathname + location.search);
      }
      if (name === 'walk') drawWalk();
      else if (name === 'crossings') drawCrossings();
      else if (name === 'missing') drawMissing();
      else graph.show(asked);
    }

    for (const tab of tabs) tab.addEventListener('click', () => showView(tab.dataset.view));

    /* A link to a node is a hash; following one opens the graph there. */
    const followHash = () => {
      const asked = parseHash(location.hash, nodes.length);
      if (asked === null) return false;
      if (asked.hops !== null) graph.setHops(asked.hops);
      showView('graph', asked.focus);
      return true;
    };
    window.addEventListener('hashchange', followHash);

    entrySearch.addEventListener('input', drawEntries);
    kindSelect.addEventListener('change', drawEntries);
    depthSel.addEventListener('change', drawWalk);
    capSel.addEventListener('change', drawWalk);

    document.getElementById('colophon').innerHTML =
      'Everything here was read from source, never run. A path shown as <code>/orders/:param/cancel</code> ' +
      'is the route as registered; a caller writes a real id there. Where a call could not be ' +
      'followed, it appears under <b>Not joined</b> with the reason rather than being dropped, which is the ' +
      'difference between a map and a guess.';

    /* Open on a way in that actually leaves a service rather than on an empty
       shell. Which one that is gets computed from the graph in hand: walk the
       forward edges backwards from every crossing, and take the first way in
       the walk reached. Naming a route here would only ever fit one project. */
    const reachesCrossing = (() => {
      const back = nodes.map(() => []);
      const seen = new Uint8Array(nodes.length);
      const queue = [];
      for (const e of data.edges) {
        const name = edgeTypes[e[2]];
        if (FORWARD.has(name)) back[e[1]].push(e[0]);
        if (CROSSES.has(name) && !seen[e[0]]) { seen[e[0]] = 1; queue.push(e[0]); }
      }
      for (let head = 0; head < queue.length; head += 1) {
        for (const prev of back[queue[head]]) {
          if (!seen[prev]) { seen[prev] = 1; queue.push(prev); }
        }
      }
      return seen;
    })();

    current = entryIx.find((i) => reachesCrossing[i]) ?? entryIx[0];
    drawEntries();
    if (!followHash()) showView('walk');
  })();
</script>
