<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #e9ecea;
    --paper: #f6f8f6;
    --raise: #ffffff;
    --ink: #171b19;
    --muted: #5f6d67;
    --faint: #8b9891;
    --rule: #cbd3ce;
    --rule-soft: #dde3df;
    --accent: #0d5c55;
    --accent-soft: #d3e5e1;

    --good: #3f7d3f;
    --warn: #97701a;
    --bad: #a03626;

    --s-0: #2f6f8f;
    --s-1: #a2542f;
    --s-2: #5b6e2f;
    --s-3: #7a3f6d;
    --s-4: #b08424;

    --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --f-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --gap: 18px;
    --radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #101412;
      --paper: #171d1a;
      --raise: #1e2622;
      --ink: #e4e9e6;
      --muted: #94a39c;
      --faint: #6d7b74;
      --rule: #2b3531;
      --rule-soft: #222b27;
      --accent: #5ec7bb;
      --accent-soft: #123833;

      --good: #7bbb72;
      --warn: #d8ac52;
      --bad: #e08573;

      --s-0: #6fb2d4;
      --s-1: #e0916a;
      --s-2: #a4bd6a;
      --s-3: #c68fb8;
      --s-4: #e0bd63;
    }
  }

  :root[data-theme='dark'] {
    --ground: #101412;
    --paper: #171d1a;
    --raise: #1e2622;
    --ink: #e4e9e6;
    --muted: #94a39c;
    --faint: #6d7b74;
    --rule: #2b3531;
    --rule-soft: #222b27;
    --accent: #5ec7bb;
    --accent-soft: #123833;

    --good: #7bbb72;
    --warn: #d8ac52;
    --bad: #e08573;

    --s-0: #6fb2d4;
    --s-1: #e0916a;
    --s-2: #a4bd6a;
    --s-3: #c68fb8;
    --s-4: #e0bd63;
  }

  * { box-sizing: border-box; }

  /* A class that sets `display` would otherwise win over the attribute, and
     the walk's controls stayed on screen under every other tab. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .shell {
    max-width: 1500px;
    margin: 0 auto;
    padding: 26px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  @media (max-width: 640px) {
    .shell { padding: 18px 16px 40px; }
  }

  /* ── masthead ───────────────────────────────────────────────────────── */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    font-family: var(--f-display);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    margin: 4px 0 0;
    color: var(--muted);
    max-width: 62ch;
  }

  .built {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--faint);
    text-align: right;
    line-height: 1.7;
  }

  /* ── the reconciliation band ────────────────────────────────────────── */

  .band {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 1px;
    background: var(--rule-soft);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .stat {
    background: var(--paper);
    padding: 12px 14px 13px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .stat dt {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--faint);
    font-weight: 500;
  }

  .stat dd {
    margin: 0;
    font-family: var(--f-mono);
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }

  .stat small {
    color: var(--muted);
    font-size: 11.5px;
    font-family: var(--f-ui);
  }

  .stat.is-good dd { color: var(--good); }
  .stat.is-warn dd { color: var(--warn); }

  /* ── service rail ───────────────────────────────────────────────────── */

  .fleet {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ship {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 11px 6px 9px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--hue);
    border-radius: var(--radius);
    background: var(--paper);
    font-size: 12.5px;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
  }

  .ship[aria-pressed='true'] {
    background: var(--raise);
    border-color: var(--hue);
  }

  .ship[aria-pressed='false'] { opacity: 0.5; }

  .ship b { font-weight: 600; }

  .ship span {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .ship em {
    font-style: normal;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--faint);
  }

  /* ── working area ───────────────────────────────────────────────────── */

  .work {
    display: grid;
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
    gap: var(--gap);
    align-items: start;
  }

  @media (max-width: 900px) {
    .work { grid-template-columns: minmax(0, 1fr); }
  }

  .panel {
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--paper);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
    flex-wrap: wrap;
  }

  .panel-head h2 {
    font-family: var(--f-display);
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .hint {
    font-size: 11.5px;
    color: var(--faint);
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
  }

  input[type='search'],
  select {
    font-family: var(--f-ui);
    font-size: 13px;
    color: var(--ink);
    background: var(--raise);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 6px 9px;
  }

  input[type='search'] { width: 100%; }

  .filters {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    max-height: 560px;
  }

  .list li + li { border-top: 1px solid var(--rule-soft); }

  .row {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 3px solid var(--hue);
    padding: 8px 12px;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .row:hover { background: var(--raise); }
  .row[aria-current='true'] { background: var(--accent-soft); }

  .row-name {
    font-family: var(--f-mono);
    font-size: 12px;
    word-break: break-word;
  }

  .row-meta {
    font-size: 11px;
    color: var(--faint);
  }

  .verb {
    font-weight: 500;
    color: var(--hue);
  }

  /* ── the walk ───────────────────────────────────────────────────────── */

  .tabs {
    display: flex;
    gap: 2px;
  }

  .tab {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 11px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--muted);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .tab[aria-selected='true'] {
    background: var(--raise);
    color: var(--ink);
    border-color: var(--accent);
  }

  .walk {
    overflow: auto;
    max-height: 620px;
    padding: 4px 0 12px;
  }

  .step {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 10px;
    padding: 3px 14px 3px 0;
    padding-left: calc(var(--level) * 15px + 14px);
    white-space: nowrap;
    position: relative;
  }

  /* One hairline per level of depth, so the shape of the walk is readable
     without spending characters on drawing it. */
  .step[data-level]:not([data-level='0'])::before {
    content: '';
    position: absolute;
    left: calc(var(--level) * 15px + 4px);
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--rule);
  }

  .step:hover { background: var(--raise); }

  .via {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .via.is-marker { color: var(--warn); }
  .via.is-heuristic { color: var(--warn); }
  .via.is-runtime { color: var(--bad); }

  .what {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
  }

  .glyph {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--raise);
    background: var(--hue);
    border-radius: 2px;
    padding: 1px 4px;
    flex: none;
  }

  .label {
    font-family: var(--f-mono);
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .where {
    font-size: 11px;
    color: var(--faint);
    font-family: var(--f-mono);
    text-align: right;
  }

  .crossing {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 5px 14px 5px 0;
    padding: 4px 10px;
    border-left: 3px solid var(--hue);
    background: var(--raise);
    border-radius: var(--radius);
    font-size: 11.5px;
    color: var(--muted);
  }

  .crossing b {
    font-weight: 600;
    color: var(--hue);
    font-family: var(--f-ui);
  }

  .repeat { color: var(--faint); font-style: italic; }

  .cut {
    margin: 8px 14px 0 0;
    padding: 7px 11px;
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--muted);
  }

  /* ── tables ─────────────────────────────────────────────────────────── */

  .sheet { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--faint);
    font-weight: 500;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }

  td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
  }

  td.mono {
    font-family: var(--f-mono);
    font-size: 11.5px;
    word-break: break-word;
  }

  td.num {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  tr:hover td { background: var(--raise); }

  .tag {
    display: inline-block;
    font-family: var(--f-mono);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 2px;
    border: 1px solid var(--rule);
    color: var(--muted);
    white-space: nowrap;
  }

  .tag.is-good { color: var(--good); border-color: var(--good); }
  .tag.is-warn { color: var(--warn); border-color: var(--warn); }
  .tag.is-bad { color: var(--bad); border-color: var(--bad); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 11.5px;
    color: var(--muted);
    padding: 10px 12px;
    border-top: 1px solid var(--rule-soft);
  }

  .legend span { display: inline-flex; align-items: baseline; gap: 6px; }

  .colophon {
    color: var(--faint);
    font-size: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 14px;
    max-width: 72ch;
  }

  .colophon code {
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
  }

  /* ── show in graph ──────────────────────────────────────────────────── */

  .to-graph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    color: var(--faint);
    border-radius: 2px;
    text-decoration: none;
    vertical-align: middle;
  }

  .to-graph:hover { color: var(--accent); }
  .to-graph svg { width: 14px; height: 14px; display: block; }

  .list li { display: flex; align-items: stretch; }
  .list li .row { flex: 1; min-width: 0; }
  .list li .to-graph { width: 34px; border-left: 1px solid var(--rule-soft); }
  .list li .to-graph:hover { background: var(--raise); }
  .what .to-graph { margin-left: 2px; }

  /* ── the graph ──────────────────────────────────────────────────────── */

  .graph { display: flex; flex-direction: column; min-width: 0; }

  .g-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .g-find { position: relative; flex: 1 1 260px; min-width: 0; }

  .g-results {
    position: absolute;
    z-index: 5;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: 340px;
    overflow-y: auto;
    background: var(--raise);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.35);
  }

  .g-results li + li { border-top: 1px solid var(--rule-soft); }

  .g-hit {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 6px 10px 6px 9px;
    border-left: 3px solid var(--hue);
    cursor: pointer;
  }

  .g-hit[aria-selected='true'] { background: var(--accent-soft); }
  .g-hit .row-name { display: flex; gap: 7px; align-items: baseline; }
  .g-results .cut { margin: 6px 8px; }

  .tool {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
  }

  .tool:hover:not(:disabled) { background: var(--raise); border-color: var(--accent); }
  .tool:disabled { color: var(--faint); cursor: default; }

  .g-pick { display: flex; align-items: center; gap: 6px; }

  .g-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .g-filters .hint { margin-right: 2px; }
  .g-filters .hint:not(:first-child) { margin-left: 10px; }

  .chip {
    font-family: var(--f-mono);
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid var(--rule);
    background: var(--raise);
    color: var(--muted);
    cursor: pointer;
  }

  .chip[aria-pressed='false'] {
    background: transparent;
    color: var(--faint);
    text-decoration: line-through;
    border-style: dashed;
  }

  .g-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--drawer-w, 330px);
    min-height: 0;
  }

  .g-stage.is-closed { grid-template-columns: minmax(0, 1fr); }

  @media (max-width: 1240px) {
    .g-stage { grid-template-columns: minmax(0, 1fr); }
  }

  .g-canvas {
    position: relative;
    height: 560px;
    overflow: hidden;
    background:
      radial-gradient(circle, var(--rule-soft) 1px, transparent 1.2px) 0 0 / 18px 18px,
      var(--ground);
    touch-action: none;
    cursor: grab;
  }

  .g-canvas.is-panning { cursor: grabbing; }

  @media (max-width: 640px) {
    .g-canvas { height: 430px; }
  }

  .g-canvas > svg { display: block; width: 100%; height: 100%; }

  .g-zoom {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    gap: 2px;
  }

  .g-zoom .tool { padding: 3px 9px; font-family: var(--f-mono); }

  .g-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }

  /* Drawn in the page's own vocabulary: a hairline box, the service's hue as a
     rule down the left, the type as a glyph. Resources a flow ends at - a
     table, a channel, an outside API, a setting - are pills, so the edge of a
     drawing reads as its edge. */
  .g-node { cursor: pointer; outline: none; }
  .g-box { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
  .g-node:hover .g-box { fill: var(--raise); stroke: var(--muted); }
  .g-rule { fill: var(--hue); }
  .g-node.is-pill .g-box { stroke: var(--hue); stroke-width: 1.4; }
  .g-node.is-focus .g-box { fill: var(--raise); stroke: var(--accent); stroke-width: 2; }
  .g-node.is-open .g-box { fill: var(--accent-soft); }
  .g-node:focus-visible .g-box { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 2; }
  .g-glyph { fill: var(--hue); }
  .g-glyph-text {
    fill: var(--raise);
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .g-label { fill: var(--ink); font-family: var(--f-mono); font-size: 11.5px; }
  .g-sub { fill: var(--faint); font-family: var(--f-ui); font-size: 10.5px; }
  .g-more rect { fill: var(--ground); stroke: var(--rule); }
  .g-more text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
  .g-more:hover rect, .g-more:focus-visible rect { stroke: var(--accent); fill: var(--accent-soft); }
  .g-more { cursor: pointer; outline: none; }
  /* Who else uses a node: outside the flow, so dashed and quiet until drawn. */
  .g-also { cursor: pointer; outline: none; }
  .g-also rect { fill: var(--ground); stroke: var(--faint); stroke-dasharray: 3 2; }
  .g-also text { fill: var(--muted); font-family: var(--f-ui); font-size: 9.5px; }
  .g-also:hover rect, .g-also:focus-visible rect { stroke: var(--accent); }
  .g-also.is-shown rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: none; }
  .g-also.is-shown text { fill: var(--accent); }

  .g-col {
    fill: var(--faint);
    font-family: var(--f-mono);
    font-size: 10.5px;
    text-anchor: middle;
  }

  .g-link path.g-edge {
    fill: none;
    stroke: var(--faint);
    stroke-width: 1.25;
  }

  .g-link path.g-hit { fill: none; stroke: transparent; stroke-width: 10; }
  .g-link.is-cross path.g-edge { stroke: var(--hue); stroke-width: 1.75; }
  .g-link.is-heuristic path.g-edge { stroke-dasharray: 6 4; }
  .g-link.is-marker path.g-edge,
  .g-link.is-declared path.g-edge { stroke-dasharray: 0.5 4; stroke-linecap: round; stroke-width: 1.75; }
  .g-link.is-lit path.g-edge { stroke: var(--accent); stroke-width: 2; }
  .g-link:hover path.g-edge { stroke: var(--ink); }
  .g-tip {
    fill: var(--muted);
    font-family: var(--f-mono);
    font-size: 9.5px;
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--ground);
    stroke-width: 3px;
  }

  .g-status {
    margin: 0;
    padding: 8px 12px;
    border-top: 1px solid var(--rule-soft);
    font-size: 12px;
    color: var(--muted);
  }

  .g-status b { font-weight: 600; color: var(--ink); }
  .g-status.is-cut { color: var(--warn); }

  /* ── reading the drawing: lanes, names, groups, chips, the trace ──────
     Read like a map: every service a faint band with its name set in the
     display face, so an edge into another band is visibly a crossing. Names
     lead in the mono face; whose a thing is follows, muted. */

  .g-canvas { --lane-tint: 6%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .g-canvas { --lane-tint: 10%; }
  }
  :root[data-theme='dark'] .g-canvas { --lane-tint: 10%; }

  .g-lane rect { fill: color-mix(in srgb, var(--hue) var(--lane-tint), transparent); }
  .g-lane line { stroke: color-mix(in srgb, var(--hue) 35%, transparent); stroke-width: 1; }
  .g-lane text {
    fill: var(--hue);
    font-family: var(--f-display);
    font-size: var(--lane-size, 12.5px);
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--ground);
    stroke-width: 3px;
  }

  .g-label { font-weight: 500; }
  .g-sub { fill: var(--muted); }

  .g-node.is-group .g-sheet { fill: var(--paper); stroke: var(--rule); }
  .g-node.is-group .g-box { stroke: color-mix(in srgb, var(--hue) 55%, var(--rule)); }
  .g-node.is-group:hover .g-box { stroke: var(--hue); }
  .g-count {
    fill: var(--hue);
    font-family: var(--f-display);
    font-size: 16px;
    font-weight: 600;
    text-anchor: end;
  }

  .g-chip { cursor: pointer; }
  .g-chip rect { fill: var(--paper); stroke: var(--faint); stroke-dasharray: 3 2; }
  .g-chip text { fill: var(--muted); font-family: var(--f-ui); font-size: 9.5px; }
  .g-chip:hover rect { stroke: var(--accent); }
  .g-chip.is-open rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: none; }
  .g-chip.is-open text { fill: var(--accent); }

  .g-badge { color: var(--muted); }
  .g-badge.is-bad { color: var(--bad); }
  .g-badge.is-warn { color: var(--warn); }
  .g-badge rect { fill: var(--raise); stroke: currentColor; }
  .g-badge text { fill: currentColor; font-family: var(--f-mono); font-size: 9.5px; font-weight: 500; }

  /* An edge says what it is when asked: on hover, and around the open node. */
  .g-tip { visibility: hidden; }
  .g-link:hover .g-tip, .g-link.is-lit .g-tip, .g-link.is-on .g-tip { visibility: visible; }
  .g-link.is-bundle path.g-edge { stroke-opacity: 0.75; }

  /* Hovering a node lights the way the walk took to it and quiets the rest. */
  #g-world.is-tracing .g-node, #g-world.is-tracing .g-link { opacity: 0.2; }
  #g-world.is-tracing .g-node.is-on, #g-world.is-tracing .g-link.is-on { opacity: 1; }
  .g-link.is-on path.g-edge { stroke: var(--accent); stroke-width: 2.25; }
  .g-node.is-on .g-box { stroke: var(--accent); }
  .g-node, .g-link { transition: opacity 120ms ease-out; }

  /* Context - who else uses a node of the flow - is drawn, but stands back:
     a dashed, faded box with what it is to the flow in place of its owner,
     and faded lines. Hovering it, or the trace, brings it up as usual. */
  .g-node.is-context { opacity: 0.6; }
  .g-node.is-context .g-box { fill: var(--ground); stroke-dasharray: 4 3; }
  .g-node.is-context .g-sub { font-style: italic; }
  .g-node.is-context:hover { opacity: 1; }
  .g-link.is-context { opacity: 0.45; }
  .g-link.is-context path.g-edge { stroke-dasharray: 2 3; }

  /* Semantic zoom: far away a node is its service and its shape; nearer, its
     name; close, everything. */
  .z-mid .g-sub, .z-mid .g-link:not(:hover) .g-tip, .z-mid .g-badge text { visibility: hidden; }
  .z-far .g-label, .z-far .g-sub, .z-far .g-glyph-text, .z-far .g-chip, .z-far .g-more, .z-far .g-also,
  .z-far .g-tip, .z-far .g-col, .z-far .g-count, .z-far .g-badge { display: none; }
  .z-far .g-box { fill: color-mix(in srgb, var(--hue) 35%, var(--paper)); stroke: var(--hue); }

  .g-mini {
    position: absolute;
    left: 10px;
    bottom: 10px;
    width: 168px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px -10px rgba(0, 0, 0, 0.4);
    cursor: crosshair;
    touch-action: none;
  }
  .g-mini svg { display: block; width: 100%; height: auto; }
  .g-mini .m-lane { fill: color-mix(in srgb, var(--hue) 14%, transparent); }
  .g-mini .m-unit { fill: var(--hue); }
  .g-mini .m-focus { fill: var(--accent); }
  .g-mini .m-view {
    fill: color-mix(in srgb, var(--accent) 12%, transparent);
    stroke: var(--accent);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }

  @media (max-width: 640px) {
    .g-mini { width: 108px; }
  }

  .g-status .g-again {
    font: inherit;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .g-node, .g-link { transition: none; }
  }

  /* ── details ────────────────────────────────────────────────────────── */

  .g-details {
    border-left: 1px solid var(--rule-soft);
    max-height: 560px;
    overflow-y: auto;
    padding: 12px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 12.5px;
    background: var(--paper);
  }

  @media (max-width: 1240px) {
    .g-details { border-left: 0; border-top: 1px solid var(--rule); max-height: none; }
  }

  .g-details header { display: flex; flex-direction: column; gap: 5px; }

  .g-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .g-details h3 {
    margin: 0;
    font-family: var(--f-mono);
    font-size: 13px;
    font-weight: 500;
    word-break: break-word;
  }

  .g-details h4 {
    margin: 0 0 4px;
    font-family: var(--f-display);
    font-size: 13.5px;
    font-weight: 600;
  }

  .g-close {
    font-family: var(--f-mono);
    background: none;
    border: 0;
    color: var(--faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
  }

  .g-close:hover { color: var(--ink); }

  .g-place { font-family: var(--f-mono); font-size: 11px; color: var(--muted); word-break: break-all; }
  .g-actions { display: flex; flex-wrap: wrap; gap: 4px; }

  .g-meta {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 3px 10px;
    margin: 0;
    font-size: 11.5px;
  }

  .g-meta dt { color: var(--faint); font-family: var(--f-mono); }
  .g-meta dd { margin: 0; font-family: var(--f-mono); word-break: break-word; }

  .g-group + .g-group { margin-top: 8px; }

  .g-group-name {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .g-edges { list-style: none; margin: 0; padding: 0; }

  .g-far {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 3px solid var(--hue);
    padding: 3px 4px 3px 7px;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  .g-far:hover { background: var(--raise); }
  .g-far .label { font-size: 11.5px; white-space: nowrap; }
  .g-far small { font-size: 10.5px; color: var(--faint); white-space: nowrap; }

  .g-more-btn {
    margin-top: 3px;
    background: none;
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    padding: 3px 8px;
    cursor: pointer;
  }

  .g-row { padding: 6px 0; border-top: 1px solid var(--rule-soft); }
  .g-row p { margin: 4px 0 0; }
  .g-row .hint-text { color: var(--muted); font-size: 12px; }
  .g-none { color: var(--faint); margin: 0; }

  /* What a node takes and gives back: one row per parameter or request part,
     a named type a link that opens its fields underneath, as deep as asked. */
  .g-shape-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 8px;
    align-items: baseline;
    padding: 2px 0;
    font-family: var(--f-mono);
    font-size: 11.5px;
  }
  .g-shape-name { color: var(--muted); white-space: nowrap; }
  .g-shape-type { word-break: break-word; }
  .g-shape-back .g-shape-name { color: var(--faint); }
  .g-type {
    background: none;
    border: 0;
    border-bottom: 1px dotted var(--accent);
    padding: 0;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }
  .g-type[aria-expanded="true"] { border-bottom-style: solid; font-weight: 600; }
  .g-type.is-plain { color: inherit; border-bottom: 0; cursor: default; }
  .g-type.is-cycle { color: var(--muted); }
  .g-shape-see { color: var(--faint); white-space: nowrap; }

  /* "Expand all" on a row is there for whoever reaches for it: shown on a
     row being pointed at or tabbed into, and always where nothing hovers. */
  .g-type-all {
    margin-left: 6px;
    padding: 0 4px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    cursor: pointer;
  }
  .g-type-all:hover { color: var(--accent); border-color: var(--accent); }
  @media (hover: hover) {
    .g-type-all { opacity: 0; }
    .g-shape-row:hover > .g-shape-type > .g-type-all, .g-type-all:focus-visible { opacity: 1; }
  }
  .g-type-more {
    display: block;
    margin: 2px 0 4px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
  }
  .g-type-more:hover { text-decoration: underline; }
  .g-shape-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 8px; }
  .g-shape-tools { display: flex; flex-wrap: wrap; gap: 4px; }
  .g-shape-tools .tool { padding: 2px 7px; font-size: 11px; }
  .g-shape-tools .tool.is-done { color: var(--good); border-color: var(--good); }
  .g-type-body {
    margin: 2px 0 4px 6px;
    padding: 2px 0 2px 9px;
    border-left: 2px solid var(--rule);
  }
  .g-type-head { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); word-break: break-all; }
  .g-shape-note { font-size: 11px; color: var(--faint); margin: 2px 0 0; }

  /* The signature line the Types toggle puts under a node's name. */
  .g-sig { fill: var(--muted); font-family: var(--f-mono); font-size: 9.5px; }
  .g-sig.is-none { fill: var(--faint); font-style: italic; }
  .z-mid .g-sig, .z-far .g-sig { visibility: hidden; }

  /* The hover card: a node's face and a peek at its types, or one type's
     fields from the panel. It floats over everything, and the pointer can
     move onto it - to show what it cut, or to open a type in the panel - and
     scroll it, past a height of its own. */
  .g-card {
    position: fixed;
    z-index: 60;
    max-width: min(440px, calc(100vw - 16px));
    max-height: min(480px, calc(100vh - 16px));
    overflow: auto;
    overscroll-behavior: contain;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--raise);
    color: var(--ink);
    box-shadow: 0 10px 28px -14px rgba(0, 0, 0, 0.45);
    font-size: 12px;
    line-height: 1.4;
  }
  .g-card[hidden] { display: none; }
  .g-card button {
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .g-card button:hover { text-decoration: underline; }
  .g-card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .g-card button.g-card-show { color: var(--accent); font-size: 11px; margin-top: 4px; display: block; }
  .g-card-face button.g-card-show { display: inline; margin: 0; }
  .g-card .g-card-title { display: block; font-weight: 600; word-break: break-word; }
  .g-card-sub { color: var(--muted); font-size: 11px; word-break: break-all; }
  .g-card-note { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .g-card-face {
    margin: 6px 0 0;
    padding: 4px 6px;
    border-radius: var(--radius);
    background: var(--paper);
    font-family: var(--f-mono);
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .g-card-peek { margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--rule); }
  .g-card > .g-card-peek:first-child { margin-top: 0; padding-left: 0; border-left: 0; }
  .g-card-type { font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--accent); }
  .g-card-type span { font-weight: 400; color: var(--faint); }
  .g-card-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 8px;
    font-family: var(--f-mono);
    font-size: 11px;
  }
  .g-card-row > :first-child { color: var(--muted); white-space: nowrap; }
  .g-card-row > :last-child { word-break: break-word; }

  /* ── checking: problems, path, impact ───────────────────────────────── */

  .g-check {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }

  .g-check-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; min-width: 0; }
  .g-check .g-pick input { margin: 0; accent-color: var(--accent); }
  .g-end { max-width: 230px; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-mono); font-size: 11.5px; }
  .g-end.is-picking { border-color: var(--accent); background: var(--accent-soft); }
  .tool[aria-pressed='true'] { border-color: var(--accent); background: var(--raise); }

  .g-answer {
    padding: 10px 12px 12px;
    border-bottom: 1px solid var(--rule-soft);
    background: var(--paper);
    font-size: 12.5px;
    max-height: 300px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .g-answer p { margin: 0; }
  .g-answer b { font-weight: 600; }
  .g-answer.is-none p:first-child { color: var(--warn); }
  .g-answer h4 {
    margin: 4px 0 2px;
    font-family: var(--f-display);
    font-size: 13px;
    font-weight: 600;
  }

  .g-answer ul { list-style: none; margin: 0; padding: 0; }
  .g-answer li { display: flex; align-items: center; gap: 4px; }
  .g-answer li + li { border-top: 1px solid var(--rule-soft); }
  .g-answer .g-far { flex: 1; min-width: 0; }
  .g-answer .g-far .label { overflow: hidden; text-overflow: ellipsis; }
  .g-answer .to-graph { width: 26px; height: 22px; }

  .g-badges { display: flex; flex-wrap: wrap; gap: 4px; }
  a.g-place { color: var(--accent); }

  .legend svg { vertical-align: middle; }
  .legend .g-key-bad, .legend .g-key-warn {
    padding: 0 5px;
    border: 1px solid currentColor;
    border-radius: 8px;
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
  }
  .legend .g-key-bad { color: var(--bad); }
  .legend .g-key-warn { color: var(--warn); }
  .legend .g-key-context {
    padding: 0 5px;
    border: 1px dashed var(--faint);
    border-radius: 3px;
    color: var(--muted);
    font-style: italic;
    font-weight: 400;
  }

  /* ── the frame: tools, the drawer, full screen ──────────────────────── */

  .g-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .g-tools .hint { margin-left: 4px; }
  .g-tools .tool { display: inline-flex; align-items: center; gap: 6px; }
  .g-tools .tool svg { width: 13px; height: 13px; flex: none; }
  .g-tools .tool[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); }
  .g-tools .tool.is-done { color: var(--good); border-color: var(--good); }
  .g-split { display: inline-flex; }
  .g-split .tool { border-radius: 0; font-family: var(--f-mono); font-size: 11px; }
  .g-split .tool:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .g-split .tool + .tool { border-left: 0; border-radius: 0 var(--radius) var(--radius) 0; }

  kbd {
    font-family: var(--f-mono);
    font-size: 10px;
    padding: 0 4px;
    border: 1px solid var(--rule);
    border-bottom-width: 2px;
    border-radius: 3px;
    color: var(--muted);
    background: var(--raise);
    line-height: 1.4;
  }

  /* What a link asked for and could not be given, said over the drawing. */
  .g-notice {
    position: absolute;
    z-index: 3;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 24px);
    margin: 0;
    padding: 7px 10px 7px 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 12px;
    color: var(--ink);
    background: var(--raise);
    border: 1px solid var(--warn);
    border-left-width: 3px;
    border-radius: var(--radius);
    box-shadow: 0 6px 18px -10px rgba(0, 0, 0, 0.4);
    cursor: default;
  }

  .g-notice code { font-family: var(--f-mono); font-size: 11px; }

  /* The details panel sits in a drawer: a grip on its edge to widen it, and a
     pull tab to fold it to a rail that still names what is open. */
  .g-drawer { position: relative; min-width: 0; display: flex; }
  .g-drawer > .g-details { flex: 1; min-width: 0; }
  .g-stage.is-closed .g-drawer { display: none; }

  .g-grip {
    position: absolute;
    z-index: 2;
    top: 0;
    bottom: 0;
    left: -4px;
    width: 8px;
    cursor: col-resize;
    touch-action: none;
    outline: none;
  }

  .g-grip::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 3px;
    width: 2px;
    background: transparent;
    transition: background 120ms;
  }

  .g-grip:hover::after,
  .g-grip.is-dragging::after,
  .g-grip:focus-visible::after { background: var(--accent); }

  .g-fold {
    position: absolute;
    z-index: 3;
    top: calc(50% - 24px);
    left: -17px;
    width: 17px;
    height: 48px;
    padding: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-right: 0;
    border-radius: 6px 0 0 6px;
    cursor: pointer;
  }

  .g-fold:hover { color: var(--accent); border-color: var(--accent); }
  .g-fold svg { width: 10px; height: 10px; transition: transform 160ms; }
  .g-stage.is-folded .g-fold svg { transform: rotate(180deg); }

  .g-rail {
    display: none;
    flex: 1;
    min-width: 0;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border: 0;
    border-left: 1px solid var(--rule-soft);
    background: var(--paper);
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    writing-mode: vertical-rl;
  }

  .g-rail:hover { color: var(--ink); background: var(--raise); }
  .g-rail b {
    font-family: var(--f-mono);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-height: 100%;
    border-left: 3px solid var(--hue, var(--rule));
    padding-left: 4px;
  }
  .g-rail span { font-size: 11px; color: var(--faint); }

  .g-stage.is-folded { grid-template-columns: minmax(0, 1fr) 36px; }
  .g-stage.is-folded .g-details,
  .g-stage.is-folded .g-grip { display: none; }
  .g-stage.is-folded .g-rail { display: flex; }

  /* Under the drawing on a narrow screen: no width to drag, and the pull tab
     moves to the top edge, a sheet's grabber. */
  @media (max-width: 1240px) {
    .g-stage.is-folded { grid-template-columns: minmax(0, 1fr); }
    .g-grip { display: none; }
    .g-fold {
      top: -17px;
      left: calc(50% - 24px);
      width: 48px;
      height: 17px;
      border: 1px solid var(--rule);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
    }
    .g-fold svg { transform: rotate(90deg); }
    .g-stage.is-folded .g-fold svg { transform: rotate(-90deg); }
    .g-rail { writing-mode: horizontal-tb; padding: 9px 12px; border-left: 0; border-top: 1px solid var(--rule); }
    .g-rail b { border-left: 0; padding-left: 0; }
  }

  /* ── the map ────────────────────────────────────────────────────────── */

  /* The whole project at the size of its services. The list of ways in steps
     aside, since the map wants the width. Boxes are the Graph tab's boxes,
     one size larger; links take their kind's colour and their weight from
     how many edges they stand for. */
  :root.is-map .work { grid-template-columns: minmax(0, 1fr); }

  .map { display: flex; flex-direction: column; min-width: 0; }

  .m-unit { cursor: pointer; outline: none; }

  .m-sheet { fill: var(--paper); stroke: var(--rule); }
  .m-rule { fill: var(--hue); }
  .m-unit:hover .m-box { fill: var(--raise); stroke: var(--muted); }
  .m-unit.is-open .m-box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
  .m-unit.is-focus .m-box { stroke: var(--accent); stroke-width: 2; }
  .m-unit:focus-visible .m-box { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 2; }
  .m-unit.is-cycle .m-box { stroke: var(--bad); }
  .m-name { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
  .m-sub { fill: var(--muted); font-family: var(--f-ui); font-size: 10.5px; }

  .m-badge.is-warn circle { fill: var(--warn); }
  .m-badge text { fill: var(--raise); font-family: var(--f-mono); font-size: 10px; font-weight: 600; }

  .m-link.is-dev { stroke-dasharray: 1.5 4; }

  .m-hit:hover + .m-link, .m-link.is-on, .m-link.is-open { stroke-opacity: 1; }

  #m-world.is-tracing .m-unit, #m-world.is-tracing .m-link { opacity: 0.18; }

  .m-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

     aside, and the details panel lays over the drawing from the right. */

<script type="module">
/* The graph view's logic, written in by the command from graph.js. */
__GRAPH_LOGIC__

/* The frame's logic - links, touch, pictures - written in from frame.js. */
__FRAME_LOGIC__

/* The map's logic - services, links, layout, checks - written in from map.js. */
__MAP_LOGIC__

  (() => {
    const data = JSON.parse(document.getElementById('graph').textContent);
    const { types, repos, kinds, files, edgeTypes, confidences, reasons } = data.dicts;

    /* Node fields, as packed: type, label, repo, kind, file, line, meta. A node
       is known by its position in this page; a link names it by its key, which
       is the same in every build of the graph. */
    const TY = 0, LB = 1, RP = 2, KD = 3, FL = 4, LN = 5, MT = 6;
    const nodes = data.nodes;
    const keys = createKeys(data.keys, nodes.length);

    const hueOf = (repoIndex) => `var(--s-${repoIndex % 5})`;
    const repoName = (i) => repos[nodes[i][RP]];
    const typeName = (i) => types[nodes[i][TY]];

    /* Edges a walk follows outward. Guards hang off the entry, never descended. */
    const FORWARD = new Set(['handles', 'calls', 'queries', 'caches', 'emits', 'consumes',
      'http_calls', 'hits', 'triggers', 'reads_config']);
    const CROSSES = new Set(['http_calls', 'hits']);

    const out = nodes.map(() => []);
    const guards = nodes.map(() => []);
    for (const e of data.edges) {
      const name = edgeTypes[e[2]];
      if (name === 'guarded_by') guards[e[0]].push(e);
      else if (FORWARD.has(name)) out[e[0]].push(e);
    }

    /* Short, readable stand-ins for node types; the vocabulary is the subject's. */
    const GLYPH = {
      entry: 'in', method: 'fn', provider: 'cls', db_query: 'db', table: 'tbl',
      channel: 'ch', producer: 'pub', consumer: 'sub', http_out: 'out',
      ui_component: 'view', ui_action: 'act', ui_api_call: 'req',
      config_key: 'cfg', external_api: 'ext', module: 'mod', repo: 'repo',
      guard: 'grd', interceptor: 'int', pipe: 'pipe',
    };

    /* Labels are source text: `requireSecret<Ctx>(...)`, `click="save()"`. Any
       of it written as markup is escaped first. */
    const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ESCAPES[c]);

    /* Every node named on the page can be opened in the graph. A link rather
       than a handler, so it can be opened in a new tab or copied. */
    const GRAPH_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4"><circle cx="3.5" cy="8" r="2"/><circle cx="12.5" cy="3.5" r="2"/>' +
      '<circle cx="12.5" cy="12.5" r="2"/><path d="M5.3 7.1 10.7 4.4M5.3 8.9l5.4 2.7"/></svg>';
    const graphLink = (i) =>
      `<a class="to-graph" href="#graph/${keys.keyOf(i)}" title="Show in graph" ` +
      `aria-label="Show ${esc(nodes[i][LB])} in the graph">${GRAPH_ICON}</a>`;

    /* ── the reconciliation band ─────────────────────────────────────── */

    const r = data.report;
    const band = document.getElementById('band');
    const stat = (label, value, note, tone) => {
      const el = document.createElement('div');
      el.className = 'stat' + (tone ? ' is-' + tone : '');
      el.innerHTML = `<dt>${label}</dt><dd>${value}</dd><small>${note}</small>`;
      band.append(el);
    };

    stat('Graph', r.totals.nodes.toLocaleString() + ' nodes',
      r.totals.edges.toLocaleString() + ' edges, ' + r.types.total.toLocaleString() + ' types');
    stat('Service calls', r.httpOut.linked + ' / ' + r.httpOut.total + ' joined',
      r.httpOut.external + ' third party, ' + r.httpOut.dynamic + ' built at run time',
      r.httpOut.linked > 0 ? 'good' : null);
    if (r.ui) {
      stat('Browser calls', r.ui.resolved + ' / ' + r.ui.total + ' joined',
        r.ui.unresolved + ' still unmatched', r.ui.resolved > 0 ? 'warn' : null);
    }
    stat('Routes reached', r.routes.called + ' / ' + r.routes.total,
      (r.routes.total - r.routes.called) + ' nothing calls');
    stat('Channels', r.channels.linked + ' / ' + r.channels.total + ' joined',
      r.channels.noConsumers.length + ' with no handler',
      r.channels.linked === 0 ? 'warn' : 'good');
    stat('Left unresolved', r.totals.unresolved.toLocaleString(),
      'each one recorded with a reason');

    const read = r.services.filter((s) => s.skipped === null).length;
    document.getElementById('standfirst').textContent =
      `${read} of ${r.services.length} repositories read and joined into one graph. Pick a way in ` +
      'on the left and follow it; a rule across the walk marks every point where it leaves one ' +
      'service for another.';

    document.getElementById('built').innerHTML =
      'built ' + new Date(data.builtAt).toISOString().replace('T', ' ').slice(0, 19) + ' UTC<br>' +
      r.services.map((s) => s.durationMs + 'ms ' + s.name).join(' &middot; ');

    /* ── service rail, doubling as the filter ────────────────────────── */

    const shown = new Set(repos);
    const fleet = document.getElementById('fleet');
    repos.forEach((name, i) => {
      const summary = r.services.find((s) => s.name === name);
      const b = document.createElement('button');
      b.className = 'ship';
      b.dataset.repo = name;
      b.style.setProperty('--hue', hueOf(i));
      b.setAttribute('aria-pressed', 'true');
      b.innerHTML = `<b>${name}</b><em>${summary ? summary.type : ''}</em>` +
        `<span>${summary ? summary.nodes.toLocaleString() : '0'} nodes</span>`;
      b.addEventListener('click', () => {
        if (shown.has(name)) shown.delete(name); else shown.add(name);
        b.setAttribute('aria-pressed', String(shown.has(name)));
        drawEntries();
        if (view === 'graph') graph.refresh();
      });
      fleet.append(b);
    });

    /* ── ways in ─────────────────────────────────────────────────────── */

    const entryIx = [];
    for (let i = 0; i < nodes.length; i += 1) {
      const t = typeName(i);
      if (t === 'entry' || t === 'ui_action') entryIx.push(i);
    }
    entryIx.sort((a, b) => {
      const ra = repoName(a), rb = repoName(b);
      if (ra !== rb) return ra < rb ? -1 : 1;
      return nodes[a][LB] < nodes[b][LB] ? -1 : 1;
    });

    const kindSelect = document.getElementById('kind');
    for (const k of [...new Set(entryIx.map((i) => kinds[nodes[i][KD]]).filter(Boolean))].sort()) {
      const o = document.createElement('option');
      o.value = k; o.textContent = k;
      kindSelect.append(o);
    }

    const entrySearch = document.getElementById('search');
    const listEl = document.getElementById('entries');
    const countEl = document.getElementById('entry-count');
    let current = null;

    const matches = () => {
      const q = entrySearch.value.trim().toLowerCase();
      const kind = kindSelect.value;
      return entryIx.filter((i) => {
        if (!shown.has(repoName(i))) return false;
        if (kind && kinds[nodes[i][KD]] !== kind) return false;
        if (!q) return true;
        return nodes[i][LB].toLowerCase().includes(q);
      });
    };

    function drawEntries() {
      const found = matches();
      countEl.textContent = found.length.toLocaleString() + ' of ' + entryIx.length.toLocaleString();
      listEl.replaceChildren();
      const frag = document.createDocumentFragment();
      for (const i of found.slice(0, 400)) {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.className = 'row';
        b.style.setProperty('--hue', hueOf(nodes[i][RP]));
        if (i === current) b.setAttribute('aria-current', 'true');
        const meta = nodes[i][MT] || {};
        const name = meta.m
          ? `<span class="verb">${esc(meta.m)}</span> ${esc(meta.p || '')}`
          : esc(nodes[i][LB]);
        b.innerHTML = `<span class="row-name">${name}</span>` +
          `<span class="row-meta">${esc(repoName(i))} &middot; ${esc(kinds[nodes[i][KD]] || typeName(i))}` +
          (files[nodes[i][FL]] ? ' &middot; ' + esc(files[nodes[i][FL]].split('/').pop()) : '') + '</span>';
        b.addEventListener('click', () => {
          current = i;
          drawEntries();
          // On the graph a way in is a focus; anywhere else it is a walk.
          if (view === 'graph') graph.go(i); else showView('walk');
        });
        li.append(b);
        li.insertAdjacentHTML('beforeend', graphLink(i));
        frag.append(li);
      }
      if (found.length > 400) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="cut" style="margin:8px 12px">${(found.length - 400).toLocaleString()} more. Narrow the filter.</div>`;
        frag.append(li);
      }
      listEl.append(frag);
    }

    /* ── the walk ────────────────────────────────────────────────────── */

    const walkEl = document.getElementById('walk');
    const titleEl = document.getElementById('walk-title');
    const depthSel = document.getElementById('depth');
    const capSel = document.getElementById('cap');


    function drawWalk() {
      if (current === null) return;
      const depth = Number(depthSel.value);
      const cap = Number(capSel.value);
      walkEl.replaceChildren();
      titleEl.textContent = nodes[current][LB];

      const frag = document.createDocumentFragment();
      let used = 0, over = 0;

      const emit = (i, level, edge, path) => {
        const row = document.createElement('div');
        row.className = 'step';
        row.style.setProperty('--hue', hueOf(nodes[i][RP]));
        row.style.setProperty('--level', String(level));
        row.dataset.level = String(level);
        const t = typeName(i);
        const meta = nodes[i][MT] || {};
        const label = meta.m ? `${meta.m} ${meta.p || ''}` : nodes[i][LB];
        const conf = edge ? confidences[edge[3]] : '';
        row.innerHTML =
          `<span class="what">` +
            `<span class="glyph">${GLYPH[t] || t.slice(0, 4)}</span>` +
            `<span class="label">${esc(label)}</span>` +
            graphLink(i) +
          `</span>` +
          `<span class="where">` +
            (edge ? `<span class="via is-${conf}">${edgeTypes[edge[2]]}${conf === 'static' ? '' : ' &middot; ' + conf}</span>  ` : '') +
            (files[nodes[i][FL]] ? esc(files[nodes[i][FL]].split('/').pop()) + (nodes[i][LN] ? ':' + nodes[i][LN] : '') : '') +
          `</span>`;
        frag.append(row);

        const guarded = guards[i];
        if (guarded.length > 0) {
          const g = document.createElement('div');
          g.className = 'crossing';
          g.style.setProperty('--hue', hueOf(nodes[i][RP]));
          g.style.marginLeft = (level * 15 + 28) + 'px';
          g.innerHTML = '<b>runs first</b>' + guarded
            .slice()
            .sort((a, b) => a[0] - b[0])
            .map((e) => esc(nodes[e[1]][LB].replace(/\(.*/, '')))
            .join(', ');
          frag.append(g);
        }
      };

      const queue = [{ i: current, level: 0, path: new Set([current]), edge: null }];
      emit(current, 0, null);
      used = 1;

      while (queue.length > 0) {
        const item = queue.shift();
        if (item.level >= depth) continue;
        const edges = out[item.i].slice().sort((a, b) => a[1] - b[1]);
        for (const e of edges) {
          const to = e[1];
          if (item.path.has(to)) {
            if (used < cap) {
              used += 1;
              const row = document.createElement('div');
              row.className = 'step';
              row.style.setProperty('--hue', hueOf(nodes[to][RP]));
              row.style.setProperty('--level', String(item.level + 1));
              row.dataset.level = String(item.level + 1);
              row.innerHTML =
                `<span class="what"><span class="repeat">already on this path: ${esc(nodes[to][LB])}</span></span><span></span>`;
              frag.append(row);
            } else over += 1;
            continue;
          }
          if (used >= cap) { over += 1; continue; }

          if (CROSSES.has(edgeTypes[e[2]])) {
            const cross = document.createElement('div');
            cross.className = 'crossing';
            cross.style.setProperty('--hue', hueOf(nodes[to][RP]));
            cross.style.marginLeft = (item.level * 15 + 28) + 'px';
            cross.innerHTML = `<b>${esc(repoName(item.i))} &rarr; ${esc(repoName(to))}</b>` +
              `over ${edgeTypes[e[2]]}, ${confidences[e[3]]}`;
            frag.append(cross);
          }

          used += 1;
          emit(to, item.level + 1, e);
          queue.push({ i: to, level: item.level + 1, path: new Set([...item.path, to]) });
        }
      }

      if (over > 0) {
        const cut = document.createElement('div');
        cut.className = 'cut';
        cut.textContent = over + ' more nodes. Raise the cap, or narrow the depth.';
        frag.append(cut);
      }
      walkEl.append(frag);
    }

    /* ── crossings: every edge that leaves a service ─────────────────── */

    function drawCrossings() {
      titleEl.textContent = 'Every crossing';
      const rows = data.edges
        .filter((e) => CROSSES.has(edgeTypes[e[2]]))
        .sort((a, b) => repoName(a[0]) < repoName(b[0]) ? -1 : 1);

      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>From</th><th>To</th><th>Route</th><th>Trust</th></tr></thead>';
      const body = document.createElement('tbody');
      for (const e of rows) {
        const from = nodes[e[0]], to = nodes[e[1]];
        const meta = to[MT] || {};
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td class="mono"><span class="tag" style="color:${hueOf(from[RP])};border-color:${hueOf(from[RP])}">${esc(repos[from[RP]])}</span> ${esc(files[from[FL]] ? files[from[FL]].split('/').pop() + ':' + from[LN] : from[LB])} ${graphLink(e[0])}</td>` +
          `<td class="mono"><span class="tag" style="color:${hueOf(to[RP])};border-color:${hueOf(to[RP])}">${esc(repos[to[RP]])}</span></td>` +
          `<td class="mono">${esc(meta.m || '')} ${esc(meta.p || to[LB])} ${graphLink(e[1])}</td>` +
          `<td><span class="tag is-${confidences[e[3]] === 'static' ? 'good' : 'warn'}">${edgeTypes[e[2]]} &middot; ${confidences[e[3]]}</span></td>`;
        body.append(tr);
      }
      table.append(body);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.append(table);
      walkEl.replaceChildren(sheet);
    }

    /* ── what did not join, and why ──────────────────────────────────── */

    function drawMissing() {
      titleEl.textContent = 'What did not join';
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>Reason</th><th class="num">Count</th><th>One of them</th></tr></thead>';
      const body = document.createElement('tbody');
      for (const u of data.unresolved) {
        const tr = document.createElement('tr');
        const tone = u.reason.includes('not-found') ? 'bad' : u.reason.includes('dynamic') ? 'warn' : '';
        // The example is the first row of its reason, in the order both lists
        // are written; when that row names a node, the node is one click away.
        const example = data.rows.find((row) => reasons[row[ROW.reason]] === u.reason);
        const anchor = example === undefined ? -1 : example[ROW.node];
        tr.innerHTML =
          `<td><span class="tag${tone ? ' is-' + tone : ''}">${esc(u.reason)}</span></td>` +
          `<td class="num">${u.count.toLocaleString()}</td>` +
          `<td class="mono">${u.service ? esc(u.service) + ' &middot; ' : ''}${esc(u.example)}` +
          `${anchor >= 0 ? ' ' + graphLink(anchor) : ''}</td>`;
        body.append(tr);
      }
      table.append(body);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.append(table);
      walkEl.replaceChildren(sheet);
    }

    /* ── the graph ───────────────────────────────────────────────────── */

    /* What is drawn comes from graph.js: the model, the neighbourhood, the
       layout, the keys, the history. What follows is the page's half - the
       drawing, the details panel, the camera and the controls - each a small
       function of the state below, which is the only thing that changes. */

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const svgEl = (tag, attrs, text) => {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs || {})) el.setAttribute(key, String(value));
      if (text !== undefined) el.textContent = text;
      return el;
    };

    /* The drawing's own units. A column is a hop; a row is a node. */
    const BOX = { w: 216, h: 40, column: 284, row: 54, pad: 40, head: 22, laneGap: 14, laneHead: 22 };
    /* With Types on, a node is a line taller and the rows open up to match. */
    const BOX_HEIGHTS = { plain: { h: 40, row: 54 }, typed: { h: 54, row: 68 } };
    /* Nodes that have a face to show when one was recorded: the rest say nothing. */
    const SHAPED = new Set([
      'method', 'function', 'ui_component', 'entry', 'ui_action', 'http_out', 'ui_api_call', 'producer', 'channel',
    ]);
    const PILL = new Set(['table', 'channel', 'external_api', 'config_key']);
    const DOORS = new Set(['entry', 'ui_action']);
    const GROUP_LIMIT = 12;
    const FILE_LIMIT = 6;

    const model = createModel(data);
    const typeOf = (i) => types[nodes[i][TY]];
    const glyphOf = (i) => GLYPH[typeOf(i)] || typeOf(i).slice(0, 4);
    const placeOf = (i) => files[nodes[i][FL]]
      ? files[nodes[i][FL]] + (nodes[i][LN] ? ':' + nodes[i][LN] : '')
      : '';
    const plural = (n, one, many) => n.toLocaleString() + ' ' + (n === 1 ? one : many);
    const enumerated = new Set(data.dicts.enumerated || []);
    const metaOf = (i) => Object.entries(nodes[i][MT] || {}).map(([key, value]) => [
      data.dicts.meta[key] || key,
      enumerated.has(key) ? data.dicts.values[value]
        : Array.isArray(value) ? value.join(', ')
        : value === true ? 'yes' : String(value),
    ]);

    const graphView = document.getElementById('graph-view');
    const wrap = document.getElementById('g-canvas');
    const svg = document.getElementById('g-svg');
    const world = document.getElementById('g-world');
    const stage = document.getElementById('g-stage');
    const panel = document.getElementById('g-details');
    const statusEl = document.getElementById('g-status');
    const hopsSel = document.getElementById('g-hops');
    const gCapSel = document.getElementById('g-cap');
    const backBtn = document.getElementById('g-back');
    const forwardBtn = document.getElementById('g-forward');

    const state = {
      focus: null,
      hops: Number(hopsSel.value),
      cap: Number(gCapSel.value),
      // Expanded nodes draw more of the flow; nodes in `also` draw who else
      // uses them, as context.
      expanded: [],
      also: [],
      cursor: null,
      open: null,
      openGroups: new Set(),
      // Types opened in the details panel, by where they sit in it.
      openTypes: new Set(),
      // Where an "Expand all" stopped at the bounds: what it was asked from,
      // and how many types it left closed.
      typeMore: new Map(),
      // Whether each node carries a line of what it takes and gives back.
      types: false,
      hood: null,
      placed: null,
      hiddenEdgeTypes: new Set(),
      hiddenConfidences: new Set(),
      // How the drawing reads: plumbing drawn as nodes or folded into chips,
      // the nodes whose own chain is unfolded, and the groups opened.
      plumbing: false,
      unfolded: new Set(),
      opened: new Set(),
      // The question asked of the drawing, if any (`{ kind: 'path' }` or
      // `{ kind: 'impact', target, found }`), the two ends of a path, which end
      // a search is picking, and which answer the box above the drawing shows.
      query: null,
      ends: { from: null, to: null },
      picking: null,
      directed: true,
      pathDepth: 12,
      problemsOnly: false,
      answer: null,
      answerOpen: new Set(),
    };
    const trail = createHistory();

    const filterNow = () => createFilter(model, {
      services: new Set(repos.flatMap((name, i) => (shown.has(name) ? [] : [i]))),
      edgeTypes: state.hiddenEdgeTypes,
      confidences: state.hiddenConfidences,
    });

    /* ── the camera: pan and zoom over the drawing ── */

    const camera = (() => {
      let x = 0, y = 0, k = 1;
      // What else reads the camera - the zoom level, the minimap - is told
      // after every move rather than polling it.
      let watchers = [];
      const apply = () => {
        world.setAttribute('transform', `translate(${x} ${y}) scale(${k})`);
        for (const watcher of watchers) watcher({ x, y, k });
      };
      const bound = (value) => Math.min(2.4, Math.max(0.2, value));
      const size = () => ({ w: wrap.clientWidth || 800, h: wrap.clientHeight || 500 });
      /* The canvas size the drawing was last placed in, so a canvas that grows
         or shrinks under it keeps what was in its middle in its middle. */
      let seen = null;
      const extent = (placed) => ({
        w: (placed.max - placed.min) * BOX.column + BOX.w + BOX.pad * 2,
        h: placed.height + BOX.pad * 2 + BOX.head,
      });
      const zoomAt = (px, py, factor) => {
        const next = bound(k * factor);
        x = px - ((px - x) * next) / k;
        y = py - ((py - y) * next) / k;
        k = next;
        apply();
      };
      return {
        zoomAt,
        watch(watcher) { watchers = [...watchers, watcher]; },
        view: () => ({ x, y, k, ...size() }),
        /* Puts a point of the drawing in the middle of the screen. */
        lookAt(wx, wy) {
          const screen = size();
          x = screen.w / 2 - wx * k;
          y = screen.h / 2 - wy * k;
          apply();
        },
        zoom(factor) { const { w, h } = size(); zoomAt(w / 2, h / 2, factor); },
        pan(dx, dy) { x += dx; y += dy; apply(); },
        /* The whole drawing when it fits at a readable size; otherwise the
           focus, readable, with the rest a drag away. `whole` always fits. */
        frame(placed, focusAt, whole) {
          const screen = size();
          seen = screen;
          const all = extent(placed);
          const fits = Math.min(1, screen.w / all.w, screen.h / all.h);
          if (whole || fits >= 0.8) {
            k = bound(fits);
            x = (screen.w - all.w * k) / 2;
            y = (screen.h - all.h * k) / 2;
          } else {
            k = 0.9;
            x = screen.w / 2 - (focusAt.x + BOX.w / 2) * k;
            y = screen.h / 2 - (focusAt.y + BOX.h / 2) * k;
          }
          apply();
        },
        /* Full screen, a wider or folded panel: the canvas changed size. */
        resized() {
          const now = size();
          if (seen !== null && (now.w !== seen.w || now.h !== seen.h)) {
            x += (now.w - seen.w) / 2;
            y += (now.h - seen.h) / 2;
            apply();
          }
          seen = now;
        },
        /* Brings a box into view when a key has moved off the edge. */
        reveal(box) {
          const screen = size();
          const left = x + box.x * k, top = y + box.y * k;
          const right = left + BOX.w * k, bottom = top + BOX.h * k;
          if (left < 12) x += 12 - left;
          else if (right > screen.w - 12) x -= right - (screen.w - 12);
          if (top < 12) y += 12 - top;
          else if (bottom > screen.h - 12) y -= bottom - (screen.h - 12);
          apply();
        },
      };
    })();

    /* ── the drawing ── */

    const at = (v) => {
      const p = state.placed.pos.get(v);
      return { x: p.x + BOX.pad, y: p.y + BOX.pad + BOX.head };
    };

    const columnName = (layer) => layer === 0 ? 'focus'
      : layer < 0 ? 'upstream ' + -layer : 'downstream ' + layer;

    const curve = (from, to) => {
      const y1 = from.y + BOX.h / 2, y2 = to.y + BOX.h / 2;
      if (from.x === to.x) {
        // Same column: out of the right side and back into it.
        const x = from.x + BOX.w, bend = 46;
        return { d: `M${x} ${y1} C${x + bend} ${y1} ${x + bend} ${y2} ${x} ${y2}`, mid: [x + bend * 0.75, (y1 + y2) / 2] };
      }
      if (to.x > from.x) {
        const x1 = from.x + BOX.w, x2 = to.x, c = (x2 - x1) / 2;
        return { d: `M${x1} ${y1} C${x1 + c} ${y1} ${x2 - c} ${y2} ${x2} ${y2}`, mid: [(x1 + x2) / 2, (y1 + y2) / 2] };
      }
      // Pointing back toward the focus: left side out, right side in.
      const x1 = from.x, x2 = to.x + BOX.w, c = Math.max(50, (x1 - x2) / 2);
      return { d: `M${x1} ${y1} C${x1 - c} ${y1} ${x2 + c} ${y2} ${x2} ${y2}`, mid: [(x1 + x2) / 2, (y1 + y2) / 2] };
    };

    /* A unit is a node position, or a group's id when the drawing grouped a
       busy side; an element names one or the other. */
    const isGroup = (u) => typeof u === 'string';
    const unitOf = (el) => (el.dataset.group !== undefined ? el.dataset.group : Number(el.dataset.node));
    const repoOfUnit = (u) => (isGroup(u) ? state.hood.groups.get(u).repo : nodes[u][RP]);
    const laneHue = (repo) => (repo >= 0 ? hueOf(repo) : 'var(--faint)');
    const laneName = (repo) => (repo >= 0 ? repos[repo] : 'several services');

    /* What expanding a node draws, and who else uses it, in words: by which
       way it looks from the focus (graph.js's LOOK), so the page never decides
       a direction of its own. */
    const LOOK_SAYS = {
      both: { expand: 'Expand neighbours', more: 'neighbours' },
      out: { expand: 'Expand: what it reaches', more: 'that it reaches' },
      in: { expand: 'Expand: what reaches it', more: 'that reach it' },
    };
    const ALSO_SAYS = {
      in: {
        ask: 'Who else uses this',
        count: (n) => plural(n, 'other caller', 'other callers'),
        badge: (n) => 'used by ' + plural(n, 'other', 'others'),
        mark: (of, n = 1) => (n === 1 ? 'also uses ' : 'also use ') + labelParts(model, of).name,
      },
      out: {
        ask: 'What else it uses',
        count: (n) => plural(n, 'other callee', 'other callees'),
        badge: (n) => 'uses ' + plural(n, 'other', 'others'),
        mark: (of) => 'also used by ' + labelParts(model, of).name,
      },
    };
    const lookOf = (v) => LOOK[state.hood.side.get(v) ?? 0];
    const contextOf = (u) => state.hood.context.get(u);
    /* An edge, or a bundle, with context at either end is context too. */
    const isContextLink = (from, to) => state.hood.context.has(from) || state.hood.context.has(to);

    /* Problem badges: the rows on a node, from graph.js's `createProblems`.

       badgesFor(node) takes a node position and returns what to pin on it,
       worst first, as [{ count, tone, title, label, kind }]:
         count  a number, drawn unless `label` is given
         tone   'bad' | 'warn' | 'info' (default 'info')
         title  what hovering it says (optional)
         label  short text drawn instead of the count (optional)
         kind   which problem it is: `rows` name the node, `line` sit at its line
       The drawing draws whatever comes back, on the node's top edge; a group
       shows its members' badges summed per tone; the details panel says each
       in words. An empty list draws nothing. */
    const problems = createProblems(model);
    const BADGE = {
      rows: { tone: 'bad', say: (n) => plural(n, 'row names it', 'rows name it') },
      line: { tone: 'warn', say: (n) => plural(n, 'row at its line', 'rows at its line') },
    };
    const badgesFor = (v) => problems.badgesFor(v).map((badge) => ({
      kind: badge.kind,
      count: badge.count,
      tone: (BADGE[badge.kind] || { tone: 'info' }).tone,
      title: badge.title,
    }));

    /* How a group says a count of one type: `56 queries`, `3 ways in`. */
    const NOUNS = {
      db_query: 'queries', method: 'methods', function: 'functions', entry: 'ways in',
      ui_api_call: 'requests', ui_action: 'actions', producer: 'publishers', consumer: 'handlers',
      http_out: 'calls out', provider: 'providers', ui_component: 'components', cache_op: 'cache calls',
      guard: 'guards', interceptor: 'interceptors', pipe: 'pipes', middleware: 'middleware',
      table: 'tables', channel: 'channels', config_key: 'settings', external_api: 'outside APIs',
      module: 'modules',
    };
    const nounOf = (typeName, n) => (n === 1 ? typeName.replace('_', ' ') : NOUNS[typeName] || typeName + 's');

    /* `2 guards · 3 interceptors · 1 pipe`, or shorter when that will not fit. */
    const chipText = (chip) => {
      const full = chip.layers.map(([layer, n]) => n + ' ' + nounOf(layer, n)).join(' · ');
      return full.length * 5.1 <= BOX.w - 24 ? full : plural(chip.total, 'wrapper', 'wrappers');
    };

    /* How many characters of a face fit in a width. */
    const fits = (px, perChar) => Math.max(4, Math.floor(px / perChar));

    const edgeName = (k) => {
      const conf = confidences[data.edges[k][3]];
      return edgeTypes[data.edges[k][2]] + (conf === 'static' ? '' : ' · ' + conf);
    };

    const drawEdge = (k) => {
      const e = data.edges[k];
      const conf = confidences[e[3]];
      const cross = nodes[e[0]][RP] !== nodes[e[1]][RP];
      const g = svgEl('g', {
        class: `g-link is-${conf}` + (cross ? ' is-cross' : '') + (isContextLink(e[0], e[1]) ? ' is-context' : ''),
        'data-from': e[0],
        'data-to': e[1],
      });
      g.style.setProperty('--hue', hueOf(nodes[e[1]][RP]));
      const path = curve(at(e[0]), at(e[1]));
      g.append(
        svgEl('title', {}, `${nodes[e[0]][LB]} → ${nodes[e[1]][LB]}\n${edgeTypes[e[2]]}, ${conf}`),
        svgEl('path', { class: 'g-hit', d: path.d }),
        svgEl('path', { class: 'g-edge', d: path.d, 'marker-end': 'url(#g-arrow)' }),
        // Said on the line only on hover and around the open node, so a busy
        // drawing is lines, not words.
        svgEl('text', { class: 'g-tip', x: path.mid[0], y: path.mid[1] - 4 }, edgeName(k)),
      );
      return g;
    };

    /* Every edge between two units where one is a group, as one line as thick
       as the count. */
    const drawBundle = (bundle) => {
      const first = data.edges[bundle.edges[0]];
      const n = bundle.edges.length;
      const conf = confidences[first[3]];
      const to = repoOfUnit(bundle.to);
      const g = svgEl('g', {
        class: `g-link is-bundle is-${conf}` + (repoOfUnit(bundle.from) !== to ? ' is-cross' : '') +
          (isContextLink(bundle.from, bundle.to) ? ' is-context' : ''),
        'data-from': bundle.from,
        'data-to': bundle.to,
      });
      g.style.setProperty('--hue', laneHue(to));
      const path = curve(at(bundle.from), at(bundle.to));
      const label = n.toLocaleString() + ' × ' + edgeTypes[first[2]];
      g.append(
        svgEl('title', {}, label),
        svgEl('path', { class: 'g-hit', d: path.d }),
        svgEl('path', {
          class: 'g-edge',
          d: path.d,
          'marker-end': 'url(#g-arrow)',
          'stroke-width': Math.min(5, 1.25 + Math.log2(n) * 0.6).toFixed(2),
        }),
        svgEl('text', { class: 'g-tip', x: path.mid[0], y: path.mid[1] - 4 }, label),
      );
      return g;
    };

    /* One band per service, the service's name in its corner. */
    const laneBox = (lane) => ({
      y: lane.y + BOX.pad + BOX.head - 6,
      h: lane.height - (BOX.row - BOX.h) + 14,
    });
    const drawLanes = (placed, width) => {
      const g = svgEl('g', { class: 'g-lanes' });
      for (const lane of placed.lanes) {
        const box = laneBox(lane);
        const band = svgEl('g', { class: 'g-lane' });
        band.style.setProperty('--hue', laneHue(lane.repo));
        band.append(
          svgEl('rect', { x: 0, y: box.y, width, height: box.h }),
          svgEl('line', { x1: 0, x2: width, y1: box.y, y2: box.y }),
          svgEl('text', { x: 12, y: box.y + 16 }, laneName(lane.repo)),
        );
        g.append(band);
      }
      return g;
    };

    /* Badges on a node's top edge, from the left: the hook decides what. */
    const drawBadges = (g, badges) => {
      let x = 8;
      for (const badge of badges) {
        const text = badge.label !== undefined ? String(badge.label) : Number(badge.count).toLocaleString();
        const w = text.length * 6 + 10;
        const pin = svgEl('g', { class: 'g-badge is-' + (badge.tone || 'info'), transform: `translate(${x} -8)` });
        if (badge.title) pin.append(svgEl('title', {}, badge.title));
        pin.append(svgEl('rect', { width: w, height: 15, rx: 7.5 }), svgEl('text', { x: 5, y: 11 }, text));
        g.append(pin);
        x += w + 4;
      }
    };

    const drawNode = (v) => {
      const t = typeOf(v);
      const p = at(v);
      const more = state.hood.more.get(v) || 0;
      const others = state.hood.others.get(v);
      const context = contextOf(v);
      const label = nodes[v][LB];
      const pill = PILL.has(t);
      const g = svgEl('g', {
        class: 'g-node' + (pill ? ' is-pill' : '') + (v === state.focus ? ' is-focus' : '') +
          (context ? ' is-context' : ''),
        transform: `translate(${p.x} ${p.y})`,
        tabindex: -1,
        role: 'button',
        'data-node': v,
        'aria-label': `${label}, ${t}, ${repoName(v)}` +
          (context ? `, not in the flow: ${ALSO_SAYS[context.look].mark(context.of)}` : '') +
          (more ? `, ${more} more not drawn` : '') +
          (others ? `, ${ALSO_SAYS[others.look].count(others.count)}` : '') +
          (state.hood.chips.has(v) ? `, ${state.hood.chips.get(v).total} wrappers folded` : ''),
      });
      g.style.setProperty('--hue', hueOf(nodes[v][RP]));
      // The full name, whose it is, where, and its types are the hover card's
      // (nodeCardHtml): the drawing shortens. Context says what it is to the
      // flow where its owner would be.
      const parts = labelParts(model, v);
      const sub = context ? ALSO_SAYS[context.look].mark(context.of) : parts.owner;
      const shape = faceLine(model, v);
      g.append(svgEl('rect', { class: 'g-box', width: BOX.w, height: BOX.h, rx: pill ? BOX.h / 2 : 3 }));
      if (!pill) g.append(svgEl('rect', { class: 'g-rule', width: DOORS.has(t) ? 5 : 3, height: BOX.h, rx: 1 }));
      const glyph = glyphOf(v);
      const gx = pill ? 15 : 11;
      const gw = glyph.length * 5.8 + 8;
      const right = pill ? 16 : 8;
      g.append(
        svgEl('rect', { class: 'g-glyph', x: gx, y: 7, width: gw, height: 13, rx: 2 }),
        svgEl('text', { class: 'g-glyph-text', x: gx + 4, y: 16.5 }, glyph),
        svgEl('text', { class: 'g-label', x: gx + gw + 6, y: 18 },
          middle(parts.name, fits(BOX.w - gx - gw - 6 - right, 7.1))),
        svgEl('text', { class: 'g-sub', x: gx, y: 33 }, middle(sub, fits(BOX.w - gx - right, 5.7))),
      );
      // The Types toggle's third line: the whole face, cut in the middle so
      // both the first parameter and what comes back survive.
      if (state.types && (shape || SHAPED.has(t))) {
        g.append(svgEl('text', { class: 'g-sig' + (shape ? '' : ' is-none'), x: gx, y: 47 },
          shape ? middle(shape, fits(BOX.w - gx - right, 5.75)) : 'types not recorded'));
      }
      const chip = state.hood.chips.get(v);
      if (chip !== undefined) {
        const text = chipText(chip);
        const w = text.length * 5.1 + 12;
        const tag = svgEl('g', {
          class: 'g-chip' + (chip.open ? ' is-open' : ''),
          'data-chip': v,
          role: 'button',
          'aria-label': (chip.open ? 'Fold ' : 'Draw ') + chip.layers.map(([layer, n]) => n + ' ' + nounOf(layer, n)).join(', '),
          transform: `translate(${BOX.w - w - 8} ${BOX.h - 4})`,
        });
        tag.append(
          svgEl('title', {}, chip.open
            ? 'Drawn beside it. Click, or press W, to fold them back.'
            : 'What runs in front of it, folded. Click, or press W, to draw them.'),
          svgEl('rect', { width: w, height: 14, rx: 7 }),
          svgEl('text', { x: 6, y: 10 }, text),
        );
        g.append(tag);
      }
      drawBadges(g, badgesFor(v));
      // From the right edge in: +N, more of the flow, then who else uses it.
      let edge = BOX.w + 6;
      if (more > 0) {
        const text = '+' + more.toLocaleString();
        const w = text.length * 6.2 + 10;
        edge -= w;
        const badge = svgEl('g', {
          class: 'g-more',
          'data-more': v,
          role: 'button',
          'aria-label': `Expand ${label}: ${more} more not drawn`,
          transform: `translate(${edge} -8)`,
        });
        badge.append(
          svgEl('title', {}, `${more} ${LOOK_SAYS[lookOf(v).flow].more}, not drawn. Click, or press +, to expand.`),
          svgEl('rect', { width: w, height: 15, rx: 7.5 }),
          svgEl('text', { x: 5, y: 11 }, text),
        );
        g.append(badge);
      }
      if (others) {
        const says = ALSO_SAYS[others.look];
        const text = says.badge(others.count);
        const w = text.length * 5.1 + 12;
        edge -= w + 4;
        const badge = svgEl('g', {
          class: 'g-also' + (others.shown ? ' is-shown' : ''),
          'data-also': v,
          role: 'button',
          'aria-label': `${others.shown ? 'Hide' : 'Show'} ${says.ask.toLowerCase()}: ${says.count(others.count)}, not in the flow`,
          transform: `translate(${edge} -8)`,
        });
        badge.append(
          svgEl('title', {}, `${says.count(others.count)}, not in the flow. ` +
            `Click, or press O, to ${others.shown ? 'hide them' : 'draw them as context'}.`),
          svgEl('rect', { width: w, height: 15, rx: 7.5 }),
          svgEl('text', { x: 6, y: 11 }, text),
        );
        g.append(badge);
      }
      return g;
    };

    /* A group: a small stack of sheets, whose they are, and how many. */
    const drawGroup = (id) => {
      const group = state.hood.groups.get(id);
      const p = at(id);
      const count = group.members.length;
      const typeName = types[group.type];
      const noun = nounOf(typeName, count);
      const what = group.next === 'service' ? 'services' : 'classes';
      const name = group.level === 'class' ? group.owner
        : group.level === 'service' ? laneName(group.repo)
        : `${group.parts.toLocaleString()} more ${what}`;
      const context = contextOf(id);
      const sub = (group.level === 'service' ? `${noun} in ${group.parts} classes` : noun) +
        (context ? ' · ' + ALSO_SAYS[context.look].mark(context.of, count) : '');
      const g = svgEl('g', {
        class: 'g-node is-group' + (context ? ' is-context' : ''),
        transform: `translate(${p.x} ${p.y})`,
        tabindex: -1,
        role: 'button',
        'data-group': id,
        'aria-label': `${count} ${noun}, ${name}, ${laneName(group.repo)}. Open the group.`,
      });
      g.style.setProperty('--hue', laneHue(group.repo));
      g.append(
        svgEl('title', {}, `${count.toLocaleString()} ${noun}` + (group.owner ? ` of ${group.owner}` : '') +
          ` in ${laneName(group.repo)}` +
          (group.behind > 0 ? `\n${group.behind.toLocaleString()} more past them within the hops, drawn once it is open` : '') +
          (context ? '\nNot in the flow: ' + ALSO_SAYS[context.look].mark(context.of, count) : '') +
          '\nClick, or press Enter, to open it.'),
